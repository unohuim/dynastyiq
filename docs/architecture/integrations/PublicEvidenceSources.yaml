name: Public Evidence Sources
type: Cross-Sport Source Identity And Metrics Registry
location:
  - app/Models/EvidenceSource.php
  - app/Http/Controllers/Admin/XLineupSourceController.php
  - database/migrations/2026_09_19_000001_create_public_evidence_and_nhl_lineup_tables.php
  - database/migrations/2026_09_20_000002_add_x_user_ids_and_seed_nhl_lineup_sources.php
  - database/migrations/2026_09_20_000003_add_is_active_to_source_scopes.php
purpose: Reuse publisher identity, sport and league scope, and time-varying public metrics without assigning implicit trust.
when_to_use:
  - Persisting a public account or publisher that supplied sports evidence.
  - Recording team coverage or observed follower and publishing metrics.
when_not_to_use:
  - Treating separate posts from one account as independent corroborating sources.
  - Assigning source trust or accuracy scores without an approved evaluation model.
rules:
  - Manually pasted lineup evidence uses platform manual with a stable per-submitting-user handle. Authorized partner manual submissions use a distinct api-client-{id} handle on the same platform, attributed from the authenticated ApiClient rather than client input. Attribution does not confer NHL official status, and manual sources must never be queried through X discovery. Temporary submission authority is governed by NhlAnticipatedLineups.yaml rather than a source trust score.
  - Provider-native account ids may be cached on sources.platform_user_id after resolving a public handle so recurring timeline reads do not repeat paid account lookups.
  - NHL anticipated-lineup discovery may use only team-scoped source timelines and must not issue generic X keyword searches.
  - Source identity is platform scoped and reusable across sports and leagues.
  - Sport, league, and optional team coverage belongs to source scopes rather than the source identity.
  - Source-to-team coverage is many-to-many; source_scopes.is_active controls discovery eligibility for each team independently.
  - Deactivating a source or removing a team assignment must retain the source, scope, observations, and metric history.
  - Mutable account metrics are append-only snapshots with observation timestamps.
  - Mutable engagement values for evidence URLs are append-only snapshots with observation timestamps.
  - Reposts and multiple posts from one source count as one source for corroboration.
  - Source records capture attribution and provenance but do not imply trust.
public_interface:
  - sources
  - source_scopes
  - source_metric_snapshots
  - source_engagement_snapshots
  - GET|POST /admin/lineup-sources
  - PUT|DELETE /admin/lineup-sources/{source}
  - EvidenceSource
example_usage: |
  EvidenceSource::query()->where('platform', 'x')->where('handle', 'reporter')->first();
