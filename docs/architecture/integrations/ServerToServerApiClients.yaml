name: Server To Server API Clients
type: Partner API Authentication Pattern
location:
  - app/Models/ApiClient.php
  - app/Console/Commands/CreateApiClientCommand.php
  - app/Http/Middleware/AuthenticateApiClient.php
  - app/Http/Controllers/Api/NhlReferenceController.php
  - app/Http/Controllers/Api/NhlSeasonStatsController.php
  - app/Http/Controllers/Api/NhlGamePredictionsController.php
  - app/Http/Controllers/Api/NhlInjuriesController.php
  - app/Http/Controllers/Api/NhlStartingGoaliesController.php
  - app/Http/Controllers/Api/NhlAnticipatedLineupsController.php
  - app/Http/Controllers/Api/NhlLineupsController.php
  - app/Http/Controllers/Api/NhlLineupSubmissionsController.php
  - app/Services/NhlSeasonStatsPayload.php
  - app/Services/NhlGamePredictionPayload.php
  - database/migrations/2026_07_27_000002_create_api_clients_table.php
  - routes/api.php
  - docs/integrations/DIQ-API-Usage-Doc.md
purpose: Authenticate scoped server-to-server API clients for partner-owned ingestion workflows without using human user sessions.
when_to_use:
  - Creating revocable API tokens for first-party or partner applications.
  - Protecting reference-data API endpoints consumed by another server.
  - Exposing DynastyIQ-owned NHL reference data to a scoped integration.
  - Exposing DynastyIQ-owned NHL season stats and expected-stat outputs to a scoped integration.
  - Exposing DynastyIQ-owned NHL game prediction outputs to a scoped integration.
when_not_to_use:
  - Browser session authentication.
  - User-owned OAuth provider credentials.
  - Public unauthenticated API endpoints.
  - Bot runtime commands that belong in the Discord bot service.
rules:
  - GET /api/nhl/lineups requires nhl-stats:read and an explicit calendar date. It returns every scheduled game with both teams using the shared verified current-lineup payload and starting-goalie selector. Missing eligible lineups return empty players, not projected rosters. Reads never trigger provider discovery or prediction assembly; projected goalie selections remain explicitly labelled.
  - docs/integrations/DIQ-API-Usage-Doc.md is the canonical consumer-facing usage contract for all partner API endpoints and must be updated whenever authentication, parameters, response fields, or consumption guidance changes.
  - API clients must store only hashed bearer tokens.
  - Plaintext tokens may be shown only once by the creation command or authorized admin key-creation response.
  - API client endpoints must require explicit scopes.
  - POST /api/nhl-lineups requires the dedicated nhl-lineups:write scope. Existing read scopes never imply writes, and adding the write option to key management must not grant it to existing keys or select it by default. Partners use separate per-submitter write keys stored only in their server environment; DynastyIQ authenticates database token hashes and requires no environment-based write secret.
  - Lineup submission actor identity comes exclusively from the authenticated ApiClient, not request-supplied attribution. Text and bounded JPEG/PNG uploads reuse the manual validator and OCR. Invalid submissions leave current evidence unchanged; successful submissions return their persisted observation identifier and selected lineup/starter.
  - Revoked clients must not authenticate.
  - Partner-facing payloads must use stable external identifiers rather than DynastyIQ primary keys as their primary lookup keys.
  - NHL reference endpoints must assume the consumer owns its local league id mapping.
  - NHL season stats endpoints must send league_abbrev and stable NHL lookup keys, not consumer-owned league_id values.
  - NHL season stats endpoints must require the explicit nhl-stats:read scope.
  - NHL season stats endpoints must support stat_group and window_key slicing so consumers can import full seasons through bounded chunked requests.
  - NHL season stats player_stats rows must expose consistent supported windows across basic, on_ice, and expected stat groups: season, last_5, last_10, and last_20 when qualifying data exists.
  - NHL season stats payloads must include goalie-specific player_stats rows for basic and expected goalie data when qualifying goalie source data exists.
  - NHL game prediction endpoints must require the explicit nhl-stats:read scope and must fail when both starting goalies cannot be resolved to usable goalie performance projections.
  - NHL injury and starting-goalie endpoints must require the explicit nhl-stats:read scope.
  - NHL starting-goalie requests default to today; date and nhl_game_id filters are mutually exclusive.
  - NHL injury requests without filters return all current injuries and may filter by team_abbrev and nhl_player_id together.
public_interface:
  - GET /api/nhl/lineups
  - POST /api/nhl-lineups
  - api-client:create
  - api.client middleware
  - api_clients
  - GET /api/nhl-teams
  - GET /api/nhl-players
  - GET /api/nhl-season-stats
  - GET /api/nhl-game-predictions
  - GET /api/nhl-starting-goalies
  - GET /api/nhl-injuries
  - GET /api/nhl-anticipated-lineups
  - docs/integrations/DIQ-API-Usage-Doc.md
example_usage: |
  php artisan api-client:create partner-app --scope=nhl-reference:read --scope=nhl-stats:read
