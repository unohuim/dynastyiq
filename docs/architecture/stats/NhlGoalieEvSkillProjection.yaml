name: NHL Goalie EV Skill Projection
type: Opportunity-Based Goalie Goal-Prevention Strategy
location:
  - app/Services/NhlGoalieEvSkillProjectionService.php
  - app/Services/NhlSatModelPredictionService.php
purpose: Apply training-only goalie EV goal-prevention skill to projected xGA without changing shot volume or xGA.
rules:
  - The EV adjustment is calculated from goalie GSAx relative to the same-run league EV baseline.
  - The adjustment changes projected goals against only; it must never alter projected SAT, SOG, or xGA.
  - When EV skill inputs are unavailable, the existing per-bucket goalie calculation remains the exclusive fallback.
  - The EV and legacy bucket adjustments must never be combined.
  - PP and PK retain their existing calculation until separately validated.
  - Persisted projection inputs must identify the active skill source and EV adjustment for auditability.
