name: NHL Projected Team Matchups
type: Projected Team Matchup Simulator And Partner Prediction Assembly
location:
  - app/Services/NhlProjectedTeamMatchupSimulator.php
  - app/Http/Controllers/Admin/NhlShotAttemptController.php
  - app/Http/Controllers/Api/NhlGamePredictionsController.php
  - app/Services/NhlGamePredictionPayload.php
  - app/Services/NhlGameLineupProjectionBuilder.php
  - docs/architecture/stats/NhlProjectedTeamMatchups.yaml
  - resources/views/admin/nhl-shot-attempts/index.blade.php
purpose: Simulate team-vs-team projected offense and assemble partner predictions, including a bounded official-lineup refresh when preseason roster evidence is missing.
when_to_use:
  - Comparing two projected NHL teams from versioned TOI and skater offensive projection outputs.
  - Building partner-facing prediction payloads from an NHL game id.
  - Explaining high-level xSAT, xSOG, EV xGF, PK xG, and total expected-goals matchup changes through composed roster chance profiles and goalie adjustment buckets.
  - Testing matchup methodology before persisting team profile buckets.
when_not_to_use:
  - Persisting official team projection snapshots.
  - Applying defensive suppression or broad bonuses for opponent defensive weakness.
  - Guessing target-season goalie workloads or starter assignments from historical source-team profile rows.
  - Replacing player-level offensive projections, TOI projections, or historical skater defensive profiles.
rules:
  - Preseason unresolved skaters on any forward line or defense pairing use the resolved same-group peers' mean projections and retain their names with null NHL ids. A group must have at least one resolved peer. Regular-season and playoff fallback eligibility remains F4/D3 only. The same game type must reach lineup verification and projection construction so an eligible roster is not rejected at a downstream gate.
  - The public game-detail preview reuses the TOI-ranked projected roster selector when no verified report exists, taking twelve forwards and six defensemen after the existing injury exclusions. Display-only projected line slots must not be persisted as reported evidence.
  - Per-team game-detail projections reuse NhlGameLineupProjectionBuilder and the same usable SAT model selection without requiring the other team's report or a goalie model. This preview does not relax partner full-game prediction eligibility. Missing inputs remain unavailable, not fabricated zeros.
  - For an explicit official or reported game roster, request-time skater projections may use the newest created complete SAT model whose /60 build has finished successfully. The model run's target_season_id is an evaluation season, not a requirement to match the game's season. Model TOI, when available, must come from that same model and player; missing TOI must not discard usable rate rows. Newer incomplete runs must not displace a usable run.
  - SAT-model game volume is the sum of bucket SAT/60 times game TOI seconds divided by 3600. Expected SOG additionally multiplies each bucket by its trained attempt-to-SOG probability; expected goals additionally multiplies by its SOG-to-goal probability. Comparison-only projected_xsog_per_60 and projected_xg_per_60 columns are not prediction inputs.
  - Every game type uses positive model TOI/GP, then previous-season regular-season TOI divided by GP, then the average of same-line teammates with model or historical TOI, then general line estimates. Resolve teammate anchors before estimates to avoid circular or order-dependent results. General minutes are F1 20, F2 16.5, F3 13.5, F4 8.5, D1 24, D2 20, D3 16. Expose toi_source and rescale fallback production to chosen minutes. NHLe and depth-peer production rules and goalie adjustments remain intact.
  - SAT-model integration must preserve selected roster identities, expose selected and applied model ids and input rates, and retain legacy projections when no usable model or player pair exists. Legacy simulator and goalie prerequisites still apply; model-run builds alone do not populate those dependencies.
  - Projected rosters must come from nhl_player_toi_projections target-team assignments after excluding current out players backed by reported or stronger injury evidence.
  - Offensive output must start from versioned skater offensive projection bucket rows.
  - Defensive profiles are descriptive composed roster chance-allowed context in the current simulator and must not subtract from offensive baseline.
  - The goalie-facing EV environment must blend attacking offense bucket shape with defending roster chance-allowed bucket shape at the approved 70/30 weighting, while preserving the attacking team's projected total xSAT, xSOG, and xGF.
  - Defensive weakness must not create automatic offensive bonuses in the current simulator version.
  - Defensive suppression requires a later approved abstraction and must not be inferred from chance-allowed bucket share alone.
  - Goalie selectors must prefer manual overrides, then official NHL starters, then confirmed before expected starting-goalie observations, then the highest projected-start goalie from valid nhl_goalie_season_projections rows, then workload projections.
  - Partner predictions must prefer complete official NHL skater rosters, then complete canonically resolved reported lineups regardless of corroboration count, then projected rosters.
  - Before withholding a preseason partner prediction for missing lineups, prediction assembly must query the current NHL gamecenter boxscore through the official-lineup importer, persist any complete official team rosters, and reevaluate both teams.
  - Preseason partner predictions must not publish scores, probabilities, or betting output unless both teams have complete official or complete canonically resolved reported lineups; an unresolved preseason game must instead return successful evidence-only output identifying each missing team and clearly label any fallback roster preview as projected_roster.
  - A complete official or reported game roster is newer game-specific availability evidence than the current injury table and must not have listed skaters removed by the generic injury exclusion.
  - Reported-lineup prediction inputs must retain all eighteen skaters and expose line, special-teams units, game-specific projected TOI, projection source, NHLe factor, and confidence.
  - Final game-specific skater TOI must follow the model, previous-season, linemate, then line-estimate ladder. Reported slots identify eligible peers and the final estimate; they must not override a usable model or historical TOI.
  - Reported skaters below twenty-five career NHL regular-season games may use previous-season non-NHL production translated through versioned NHLe factors when available; the same factor may provisionally translate SOG only with low confidence.
  - Lineup-aware NHLe values are read-time game prediction inputs and must not replace raw imported statistics or stored season projections.
  - A reported player without either a usable NHL projection or translatable non-NHL history must remain in the game roster with an explicitly low-confidence replacement-level rate.
  - Matchup goalie projection versions must be valid finished goalie performance projections with matching EV bucket rows in nhl_goalie_projection_chance_buckets; workload-only versions must not be selectable as matchup goalie versions.
  - Goalie option filtering must use the current goalie roster from players.team_abbrev, infer goalie eligibility from players.is_goalie or G position fields, and must not include historical source-team-only matches.
  - Goalie option labels must expose current team and historical source team context so traded goalies are not mistaken for projected team assignments.
  - Selected goalies must always influence the matchup when valid goalie season projections exist; sparse exact bucket matches must fall back to season EV/PK goalie GA/xGA ratios rather than silently removing goalie impact.
  - Goalie EV bucket adjustments must start from the goalie season EV GA/xGA ratio; projected goalie bucket GA/xGA ratios may tilt that season anchor by bucket confidence and must not be hidden by a hard confidence cutoff.
  - Matchup PK contribution must use projected goalie PK bucket rows and season PK totals; until projected PP offensive bucket storage exists, the PK bucket mix may be tilted by opponent projected offensive bucket shares where bucket keys overlap, with bounded weights and confidence-shrunk bucket effects.
  - Composed roster offensive, defensive, and adjusted-goalie-environment profile sections must roll granular skater buckets into readable groups that target 90% xSAT/xSOG representation, without changing the underlying projection math.
  - Goalie matchup reasons must preserve granular bucket calculations internally but roll up the explanation display until PP opportunities fit into the top 3 groups and EV opportunities fit into the top 3-5 groups while targeting 90% coverage for both xSAT and xSOG.
  - Rolled goalie matchup reasons must sit directly below the adjusted goalie environment, collapse lower-signal dimensions progressively, starting with shot type, expose represented totals and percentages, and then show weighted goalie GA/xGA response, GSAx/G, GA/G, and confidence for each displayed group.
  - Team matchup profiles are computed on demand and must not be persisted until a separate team-profile storage abstraction is approved.
  - Results must expose high-level per-game rates and rolled bucket-level data explaining offensive generation, defensive chances allowed, and goalie response.
  - Partner-facing game prediction payloads must resolve nhl_game_id through nhl_games, derive missing starters from goalie performance projections or workload projections, and fail when a usable projected starter cannot be resolved for both teams.
  - Partner-facing game prediction payloads must expose model-owned full-game moneyline probabilities under market_probabilities[] using moneyline, full_game, and away/home selection keys.
  - Partner-facing game prediction payloads may accept requested market keys, puckline spreads, and total lines, and must expose line-dependent puckline and total probabilities from the DynastyIQ projected score distribution instead of requiring consumers to invent distribution assumptions.
  - Partner-facing goalie edge must be expressed in goals saved per game edge, include selected starter objects for both teams, and include the edge scale metadata.
  - Per-game rates must use projected games from projection rows and fall back to the current 84-game NHL regular-season length only when projected games are unavailable.
  - Roster comparison rows must sort by projected xGF and show compact per-game player impact context without projected TOI.
public_interface:
  - admin.nhl-shot-attempts.index
  - api.nhl-game-predictions.show
  - NhlProjectedTeamMatchupSimulator
  - NhlGamePredictionPayload
  - NhlGameLineupProjectionBuilder
  - resources/views/admin/nhl-shot-attempts/index.blade.php
example_usage: |
  GET /admin/nhl-shot-attempts?tab=matchup&matchup_team_a=TOR&matchup_team_b=BOS
