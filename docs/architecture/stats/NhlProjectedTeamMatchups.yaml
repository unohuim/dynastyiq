name: NHL Projected Team Matchups
type: Shared Game Prediction Compatibility Boundary
location:
  - app/Services/NhlProjectedTeamMatchupSimulator.php
  - app/Services/NhlGamePredictionPayload.php
  - app/Services/NhlCustomGameForecast.php
  - app/Http/Controllers/Admin/NhlShotAttemptController.php
purpose: Keep existing API and admin matchup interfaces while routing every new game forecast through the default pregame EV/PP calculator.
when_to_use:
  - Producing partner API game predictions or admin engine and stack previews.
  - Comparing selected teams through the existing matchup inspector.
when_not_to_use:
  - Recalculating or rewriting historical saved predictions.
  - Applying legacy offensive/defensive percentages, goal dilution or confidence boosts to new forecasts.
rules:
  - NhlCustomGamePrediction.yaml owns current game calculation, completeness fallbacks, model selection, time cutoffs and probability semantics. NhlGamePredictionPayload.build and both preview methods call this single calculation. No stack delegation or annual-projection fallback can switch a new forecast to the retired game math.
  - Existing simulator entry points resolve the selected teams' next scheduled meeting in the requested season, or their most recent meeting if no future meeting exists. Return the selected game identity and date explicitly. Preserve caller team order and explicit resolved roster identities. No scheduled meeting is an explicit input error.
  - Annual player/goalie projection helpers remain available for statistical evidence and Goalie Edge. They do not replace the new engine's player minutes, SAT buckets, conversion or final PP allocation. Goalie Edge receives the new opposing SOG and goal estimates; unavailable diagnostic components remain labelled. The adopted neutral goalie scoring stage is unchanged.
  - Preserve public route names, API scopes, NHL identities and the existing game/teams/goalies/markets response envelope. Current forecast provenance identifies the algorithm and selected SAT model instead of attributing new outcomes to a legacy stack member. Nullable confidence is distinct from win probability.
  - API scores are the new engine's team goals rounded only for display. Team summaries and player rosters derive from its unrounded EV/PP components. Do not run legacy goal normalization or apply retired confidence boosts or penalties. Moneyline prices use the calculator's returned probabilities, including its approved schedule delta.
  - Existing private annual/projection formatting helpers may remain for historical evidence and independent statistical consumers. Their old formulas are not an alternate path for new game predictions.
public_interface:
  - NhlGamePredictionPayload::build
  - NhlGamePredictionPayload::previewEngine
  - NhlGamePredictionPayload::previewStack
  - NhlProjectedTeamMatchupSimulator::simulate
  - NhlProjectedTeamMatchupSimulator::simulateWithRosters
example_usage: |
  Request a stored NHL game ID through the existing partner API.
  The default calculator supplies its EV/PP scores and probabilities;
  saved annual goalie projections supply separate diagnostic evidence.
