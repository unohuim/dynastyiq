name: NHL Game Prediction Response Cache
type: Partner Prediction Cache And Refresh Boundary
location:
  - app/Services/NhlGamePredictionResponseCache.php
  - app/Jobs/RefreshNhlGamePredictionJob.php
  - app/Http/Controllers/Api/NhlGamePredictionsController.php
purpose: Publish immutable revisions and bounded cached responses from the single default pregame engine.
when_to_use:
  - Serving partner game predictions and explicit manual admin recalculations.
  - Refreshing a matching stale response through the existing lineup queue.
when_not_to_use:
  - Selecting a legacy stack engine or substituting old prediction math.
  - Rewriting a saved revision on a cache hit.
rules:
  - Partner API requests first read the latest successful saved revision for the requested game, for every date, through NhlGamePredictionHistory. Return HTTP 200 immediately with original meta.predicted_at and revision ID, applying public-confidence presentation and explicit requested-market pricing from that same saved forecast. Cache expiry, current fingerprints, force refresh and model/goalie overrides cannot delay or replace this saved response. Do not admit, prepare, run an engine or queue work on a healthy saved read. The sole availability exception follows imports/NhlPlayerAvailability.yaml; an upcoming saved forecast with an unavailable participant queues its replacement and returns preparing, while retaining history. Independent later prediction runs remain separate. Without a saved success, past dates in America/Toronto return unavailable without work; today and future dates use the existing preparation/calculation pipeline. Explicit manual admin calculations remain unchanged.
  - Explicit market selectors and spread/total lines may replace only market_probabilities in the API response copy through NhlGamePredictionPayload::withRequestedMarkets. Reuse existing line-pricing equations with saved unrounded selection scores and existing legacy total normalization; only older payloads lacking unrounded scores may use their saved displayed scores. Keep existing moneyline rows intact and use stored winner probabilities when a custom forecast needs missing moneyline rows. Preserve model provenance from the saved payload, not current configuration. Missing usable scoring evidence is a market validation error, never permission to rebuild the forecast or invent goals. No selectors retain the saved publication's market list. Do not modify stored/cached payloads, revisions, scores, confidence, Matchup, horizons, source inputs or publication timestamps. Historical saved games support the same read-only pricing. Injury and unavailable-response gates remain earlier and unchanged; public confidence is mapped after pricing.
  - All builds use NhlCustomGamePrediction.yaml through the existing payload builder. No saved stack or legacy confidence qualification is a prerequisite.
  - Use a separately versioned response namespace for the default-engine transition so old calculated responses cannot satisfy new requests. Earlier immutable revisions remain readable.
  - Fingerprints include the selected eligible SAT model, current algorithm/configuration, source statistical content and completed derived-fact publications, game/starter state, current lineup structure, supported game-date availability and starting-goalie identity/status evidence. Polling timestamps and identical repeated observations cannot create a new revision. Retired stack weights do not choose or alter a new prediction. Verify the fingerprint before publication; changed inputs queue continuation and return HTTP 202 preparing with Retry-After 15.
  - A matching response is fresh for one minute and may be stale for at most three hours only while its deduplicated refresh is queued or already queued. A miss or expired response calculates only when prepared dependencies exist; otherwise return HTTP 202 preparing with Retry-After 15 and queue automatic continuation. The authenticated force-refresh option bypasses response reuse, not source evidence caches.
  - Synchronous, forced and queued builds share the existing game-level atomic lock and release it in finally. Contending requests and cold shared-input preparation are retryable, never fabricated predictions.
  - Fingerprints include the Toronto calculation date and, for future targets, committed latest-context source identity. A new calendar date or newly committed context refreshes the applicable prepared response; cache hits never recalculate a revision horizon. Today and explicit manual past-date calculations retain exact-context preparation; future requests skip target-context jobs under NhlCustomGamePrediction.yaml.
  - Every newly published calculation is recorded through NhlGamePredictionHistory before caching. Private custom input evidence is archived separately from the public payload. Cache hits retain their revision identity; manual run/game retries remain idempotent.
  - Refresh jobs retain the existing lineups queue. Manual admin game jobs and shared preparation retain projections. Missing pregame context is queued through the canonical orchestrator by the shared forecast boundary; no raw imports, season syncs or migrations are dispatched. Pending jobs retain admission across releases with a fixed deadline; terminal refresh failure clears admission for a later request.
  - Valid first-party and partner manual lineup saves independently queue an existing refresh after commit through refreshAfterLineupSave. Use only the game request input; the queued initial fingerprint is empty because the worker derives current evidence before building. No model/history calculation occurs during submission. Existing game admission, deduplication, retry and publication rules remain authoritative; an unchanged matching fresh response may be reused by the worker. A dispatch failure reports that the lineup is saved but prediction refresh could not be queued. Saved API reads still return existing successes without initiating work, and no outbound delivery is added.
  - Every new successful operational prediction includes a completed prior-date Matchup snapshot before revision publication. The shared public-game reader prepares season and L5 xGF/xGA on the existing default queue, keyed by game and frozen forecast source identity under a separate expiring cache and lock. Missing preparation returns the existing HTTP 202 dependency response and archives no revision. Entirely unavailable expected-goal windows or exhausted preparation failures expose a specific validation error rather than a successful incomplete prediction. Partial scored history keeps its adopted full-window denominator and true zero expectations remain valid. API cache hits return the saved Matchup unchanged; public-page invalidation or expiration cannot remove its values. Existing historical revisions remain immutable, and evidence-only responses may still append descriptive live-read form.
  - Partner response serialization exposes stored public_confidence_score as prediction.confidence_score and every market confidence_score, retaining the explicit prediction.public_confidence_score field. Omit the game confidence_inputs breakdown, team input_confidence_score and private game-confidence envelopes. Preserve separate player/goalie evidence-quality fields. Missing public confidence remains null without internal fallback. Apply this mapping after fresh/stale cache resolution or a saved API read without mutating cached payloads, revisions, formulas, picks or probabilities. Admin and engine paths retain internal confidence.
  - Newly prepared Matchup snapshots include descriptive Last 5 and Last 10 PP/PK percentages and current-season home/away scenario records under the shared public-game form contract. Response/preparation cache namespaces must not reuse older snapshot shapes that lack these fields. New calculations archive the current shape; prior revisions remain immutable and scoring equations are unchanged.
  - Saved successful API responses include the revision-bound player_pregame block governed by NhlGamePredictionHistory and the shared public-page selection rules. Source/context refreshes and post-puck-drop requests cannot replace its snapshot. Missing player history returns null fields or empty lists without preparation, provider calls or a new revision. Requested-market enrichment and public-confidence mapping preserve the block unchanged.
  - Preparing responses contain no forecast and append no revision. Multiple pending requests share preparation and continuation work. Independent calculation jobs still require current fingerprints and dependencies; force refresh at that calculation boundary bypasses cache reuse. The partner controller returns an existing healthy successful revision before reaching this boundary.
public_interface:
  - GET /api/nhl-game-predictions
  - NhlGamePredictionPayload::withRequestedMarkets
  - NhlGamePredictionResponseCache
  - RefreshNhlGamePredictionJob
example_usage: |
  A partner read returns the latest saved success and its original calculation timestamp.
  An explicit refresh calculates with the default pregame engine and appends a new revision.
