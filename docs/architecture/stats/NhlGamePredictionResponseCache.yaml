name: NHL Game Prediction Response Cache
type: Partner Prediction Cache And Refresh Boundary
location:
  - app/Services/NhlGamePredictionResponseCache.php
  - app/Jobs/RefreshNhlGamePredictionJob.php
  - app/Http/Controllers/Api/NhlGamePredictionsController.php
purpose: Publish immutable revisions and bounded cached responses from the single default pregame engine.
when_to_use:
  - Serving partner game predictions and explicit manual admin recalculations.
  - Refreshing a matching stale response through the existing lineup queue.
when_not_to_use:
  - Selecting a legacy stack engine or substituting old prediction math.
  - Rewriting a saved revision on a cache hit.
rules:
  - All builds use NhlCustomGamePrediction.yaml through the existing payload builder. No saved stack or legacy confidence qualification is a prerequisite.
  - Use a separately versioned response namespace for the default-engine transition so old calculated responses cannot satisfy new requests. Earlier immutable revisions remain readable.
  - Fingerprints include the selected eligible SAT model, current algorithm/configuration, source-game updates, game/starter state, current lineup evidence and starting-goalie observations. Retired stack weights do not choose or alter a new prediction. Verify the fingerprint before publication; changed inputs return a retryable response.
  - A matching response is fresh for one minute and may be stale for at most five minutes only while its deduplicated refresh is queued or already queued. A miss or expired response calculates synchronously. The authenticated force-refresh option bypasses response reuse, not source evidence caches.
  - Synchronous, forced and queued builds share the existing game-level atomic lock and release it in finally. Contending requests and cold shared-input preparation are retryable, never fabricated predictions.
  - Every newly published calculation is recorded through NhlGamePredictionHistory before caching. Private custom input evidence is archived separately from the public payload. Cache hits retain their revision identity; manual run/game retries remain idempotent.
  - Refresh jobs retain the existing lineups queue. Manual admin game jobs retain projections. No imports, migrations or context rebuilds are dispatched by this cache boundary.
public_interface:
  - GET /api/nhl-game-predictions
  - NhlGamePredictionResponseCache
  - RefreshNhlGamePredictionJob
example_usage: |
  A current cache hit returns its existing revision.
  An explicit refresh calculates with the default pregame engine and appends a new revision.
