name: NHL Game Prediction Response Cache
type: Partner Prediction Cache And Refresh Boundary
location:
  - app/Services/NhlGamePredictionResponseCache.php
  - app/Jobs/RefreshNhlGamePredictionJob.php
  - app/Http/Controllers/Api/NhlGamePredictionsController.php
purpose: Publish immutable revisions and bounded cached responses from the single default pregame engine.
when_to_use:
  - Serving partner game predictions and explicit manual admin recalculations.
  - Refreshing a matching stale response through the existing lineup queue.
when_not_to_use:
  - Selecting a legacy stack engine or substituting old prediction math.
  - Rewriting a saved revision on a cache hit.
rules:
  - All builds use NhlCustomGamePrediction.yaml through the existing payload builder. No saved stack or legacy confidence qualification is a prerequisite.
  - Use a separately versioned response namespace for the default-engine transition so old calculated responses cannot satisfy new requests. Earlier immutable revisions remain readable.
  - Fingerprints include the selected eligible SAT model, current algorithm/configuration, source statistical content and completed derived-fact publications, game/starter state, current lineup structure and starting-goalie identity/status evidence. Polling timestamps and identical repeated observations cannot create a new revision. Retired stack weights do not choose or alter a new prediction. Verify the fingerprint before publication; changed inputs queue continuation and return HTTP 202 preparing with Retry-After 15.
  - A matching response is fresh for one minute and may be stale for at most three hours only while its deduplicated refresh is queued or already queued. A miss or expired response calculates only when prepared dependencies exist; otherwise return HTTP 202 preparing with Retry-After 15 and queue automatic continuation. The authenticated force-refresh option bypasses response reuse, not source evidence caches.
  - Synchronous, forced and queued builds share the existing game-level atomic lock and release it in finally. Contending requests and cold shared-input preparation are retryable, never fabricated predictions.
  - Fingerprints include the Toronto calculation date and, for future targets, committed latest-context source identity. A new calendar date or newly committed context refreshes the applicable prepared response; cache hits never recalculate a revision horizon. Today and past-date requests retain exact-context preparation; future requests skip target-context jobs under NhlCustomGamePrediction.yaml.
  - Every newly published calculation is recorded through NhlGamePredictionHistory before caching. Private custom input evidence is archived separately from the public payload. Cache hits retain their revision identity; manual run/game retries remain idempotent.
  - Refresh jobs retain the existing lineups queue. Manual admin game jobs and shared preparation retain projections. Missing pregame context is queued through the canonical orchestrator by the shared forecast boundary; no raw imports, season syncs or migrations are dispatched. Pending jobs retain admission across releases with a fixed deadline; terminal refresh failure clears admission for a later request.
  - The authenticated API appends a descriptive Matchup block after resolving the prediction response cache, using the public game Matchup reader and its strict prior-date cutoff. Fresh/stale responses retain revision identity and scores; Matchup is not stored by rewriting an existing revision. Missing expected statistics remain null while eligible upcoming-game preparation runs outside the request. Existing HTTP 202 preparing responses are unchanged.
  - Preparing responses contain no forecast and append no revision. Multiple pending requests share preparation and continuation work. Existing revisions remain available as history but cannot satisfy an invalid current fingerprint. Force refresh bypasses response reuse and still waits for current dependencies.
public_interface:
  - GET /api/nhl-game-predictions
  - NhlGamePredictionResponseCache
  - RefreshNhlGamePredictionJob
example_usage: |
  A current cache hit returns its existing revision.
  An explicit refresh calculates with the default pregame engine and appends a new revision.
