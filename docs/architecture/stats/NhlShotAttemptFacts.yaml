name: NHL Shot Attempt Facts
type: Derived Analytics Fact Layer
location:
  - app/Http/Controllers/Admin/NhlGameImportController.php
  - app/Jobs/BuildNhlShotAttemptFactsJob.php
  - app/Services/NhlShotAttemptAnalysisBuckets.php
  - app/Services/BuildNhlShotAttemptFacts.php
  - database/migrations/2026_07_27_000000_create_nhl_shot_attempts_facts_table.php
  - database/migrations/2026_07_29_000002_add_handedness_fields_to_nhl_shot_attempts_facts_table.php
  - database/migrations/2026_07_30_000001_add_biometric_snapshot_fields_to_nhl_shot_attempts_facts_table.php
  - docs/architecture/stats/NhlShotAttemptFacts.yaml
purpose: Store deterministic, rebuildable NHL shot-attempt facts derived from imported play-by-play before any expected-goals probability model is applied.
when_to_use:
  - Building an analytical source table for shot attempts from play_by_plays.
  - Deriving stable shot context such as result, surface, geometry buckets, rebound flags, strength, score state, and net state.
  - Producing sanitized aggregate extracts for AI-assisted or statistical shot-quality exploration.
  - Producing single-factor admin analysis rows for raw fact labels, biometrics, handedness, and blocker context.
  - Feeding versioned expected-goals prediction and summary tables.
  - Queueing shots-only fact collection from an admin-selected game import run range.
when_not_to_use:
  - Storing expected-goals probabilities or high/medium/low danger labels.
  - Replacing raw play-by-play provider event rows.
  - Persisting model-specific coefficients, thresholds, or trained outputs.
  - Making betting or fantasy decisions directly from sparse bucket rates without validation.
rules:
  - The facts layer must be deterministic and rebuildable from imported NHL play-by-play plus stored game context.
  - Raw play-by-play remains the event source of truth; shot facts are a derived analytical projection.
  - Each shot fact row must link to exactly one source play_by_plays row.
  - Shootout attempts must be excluded or isolated from normal game shot-attempt analysis.
  - Penalty-shot attempts may be tracked as shot facts but must remain distinguishable from normal in-play attempts.
  - Shot geometry facts must reuse the canonical ShotGeometryService-derived distance and angle semantics.
  - Stored `abs_shot_angle` must be folded into a 0-90 goalie-facing angle where 0 is straight-on through the net center and 90 is goal-line/sharp angle.
  - Folded absolute angle values above 90 are invalid QA conditions and must not be presented as real angle categories.
  - Score snapshots and score-state buckets must represent the pre-event game state before the shot outcome changes the score, derived from the ordered goal timeline rather than trusting per-row provider score snapshots.
  - Rush context must distinguish direct rush attempts from same-team rebounds that inherit rush sequence context inside the rebound window.
  - Shooter handedness, goalie catches hand, goalie-perspective shot side, and goalie hand matchup may be snapshotted as analysis context from canonical player records.
  - Blocker handedness comparisons may be calculated at read time by joining blocking_player_id to canonical player records; they do not require a new shot fact field unless promoted into broader model inputs.
  - Shooter and goalie height, weight, and age-at-game may be snapshotted from canonical player records so historical facts do not drift when player records change.
  - Off-wing shot-attempt classification must use goalie-perspective side plus shooter handedness and remain nullable when side, handedness, or classified shot type is unavailable.
  - Bucket labels must remain deterministic feature labels and must not imply goal probability by themselves.
  - Predictive bucket analysis must exclude unknown shot type buckets by default while preserving unknown shot type rows in raw fact storage.
  - Analysis and expected-goals model buckets must use NhlShotAttemptAnalysisBuckets fallback levels instead of raw one-to-one fact bucket combinations.
  - Analysis and expected-goals model buckets must not expose or score sparse combinations below the approved sample floor; sparse attempts must resolve to broader parent buckets, then to league baseline when needed.
  - Strength state, shot side, and off-wing context may remain raw facts and filters, but must not fragment primary expected-goals fallback buckets until validated with enough sample size.
  - Expected-goals probabilities, danger labels, and model outputs belong in versioned expected-goals prediction tables.
  - Aggregate AI review must use sanitized exports or grouped facts and must remain advisory until validated against holdout data.
  - Sparse bucket combinations must fall back to broader groupings before they are used for probability estimates.
  - Shots-only admin processing must upsert shot facts from already imported play-by-play and must not fetch providers or run the full NHL import pipeline.
  - Shots-only admin runs must distinguish games selected for processing from games with at least one eligible shot-attempt source event so zero-attempt limited-scoring games do not look like failed or missing processing.
public_interface:
  - nhl_shot_attempts_facts
  - nhl_shot_attempt_predictions
  - nhl_expected_goals_models
  - play_by_plays.id
  - admin.nhl-game-imports.process-shots
  - BuildNhlShotAttemptFacts
  - BuildNhlShotAttemptFactsJob
  - NhlShotAttemptAnalysisBuckets
  - ShotGeometryService
  - NhlPbpEventNormalizer
example_usage: |
  SELECT distance_bucket, angle_bucket, COUNT(*) AS attempts, SUM(CASE WHEN is_goal THEN 1 ELSE 0 END) AS goals
  FROM nhl_shot_attempts_facts
  WHERE is_unblocked_attempt = true
  GROUP BY distance_bucket, angle_bucket;
