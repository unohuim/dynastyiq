name: NHL Prediction Input Services
type: Model And Historical Prediction Input Boundary
location:
  - app/Services/NhlSatModelPredictionService.php
  - app/Services/NhlHistoricalPredictionService.php
  - app/Services/NhlGameLineupProjectionBuilder.php
  - app/Services/NhlProjectedTeamMatchupSimulator.php
  - app/Services/NhlGoalieProjectionBuilder.php
purpose: Supply annual statistical projections and historical profile evidence for lineup display, goalie diagnostics and saved legacy analysis; current game scoring is owned by NhlCustomGamePrediction.yaml.
when_to_use:
  - Reading the latest finished SAT run for annual statistical evidence.
  - Combining a selected lineup's offense with compatible defensive and goalie history.
  - Building goalie projections pinned to a SAT run.
when_not_to_use:
  - Inventing defensive rate projection strategies before they are validated.
  - Treating held-out evaluation snapshots as historical prediction inputs.
  - Translating incompatible old bucket boundaries by guessing their distribution.
rules:
  - Identical inputs within one payload build may be reused under NhlPredictionInputContext.yaml. Model, roster, strength and version boundaries remain distinct; engine-specific simulation and qualification are always evaluated independently.
  - Current game outcomes use the sole calculator in NhlCustomGamePrediction.yaml. Saved engine weights and annual projection helpers never provide an alternate live/default scoring path.
  - Model prediction inputs require all valid player bucket SAT rates and positive standalone TOI/GP from the same run. Reject partial SAT rate sets and in-progress TOI rebuilds. Valid zero SAT rates remain zero predictions. Do not reduce model TOI for conversion calibration.
  - This service's annual projections are static estimates. Never incorporate current-season or preseason observations or held-out labels into those annual projection inputs; live game recency is owned separately by NhlCustomGamePrediction.yaml.
  - When the otherwise-selected player or goalie statistical input is absent and would emit empty or synthetic zero-valued API statistics, resolve an absence-only historical sample from completed NHL regular-season games: the most recent twenty games spanning the current and immediately preceding season, then five games, then one game. Preserve valid zero outcomes within a selected sample. No game history leaves the relevant statistical payload unavailable. This fallback does not replace a valid static annual input or act as a recent-form override.
  - Offensive xSAT equals projected_xsat_per_60 multiplied by same-run model TOI seconds/GP divided by 3600. xSOG equals those attempts times projected_xsog_per_60 divided by projected_xsat_per_60; xGF equals xSOG times projected_xg_per_60 divided by projected_xsog_per_60. Use personal historical training-bucket SOG/SAT or goals/SOG only when its corresponding projected ratio is unavailable, then pooled bucket averages, then trained bucket probabilities. Valid projected and observed zeros remain zero. The same rule applies to Other; missing matching personal Other history uses the existing bucket fallback rather than unrelated personal buckets.
  - Select the newest complete SAT run with a completed rate build and its goal model. Evaluation season does not restrict eligibility. Missing player pairs fall back individually instead of mixing model rates and historical minutes.
  - Historical fallback uses latest-training-season snapshots in the same bucket vocabulary when available, otherwise training profiles. Never consume held-out snapshots. Profiles are rebuilt through the existing SAT model profile workflow, outside prediction requests.
  - Game-lineup model inputs must be restricted to that lineup's resolved NHL player IDs; explicit unresolved NHL IDs must not fall back to internal DynastyIQ identities. An empty ID selection must not become an unrestricted model read.
  - A projected roster selects the same top twelve forwards and six defensemen by projected TOI as its displayed roster preview, excluding unavailable players, then passes those identities through the same game-lineup projection ladder as a stated lineup. It must not require historical boxscore rows merely to construct projected-game inputs.
  - Saved annual model rows retain their own source/target versions and provenance. New game forecasts use their selected model's own Train and rolling inputs under NhlCustomGamePrediction.yaml rather than mixing annual TOI into those rates.
  - Model-wide historical bucket averages must aggregate in SQL and return only bucket totals to PHP. The pool consists of regular-season, non-null entities present in the requested run and profile type's aggregate training rows. Latest-training-season snapshots replace aggregate rows per entity, never per missing bucket. Sum observed and expected counts per matched bucket; divide volume by the sum of each selected entity's maximum source TOI, counting exposure once even when an entity lacks a particular bucket. Preserve observed zeros and exclude held-out, older-snapshot-only, and snapshot-only entities. Do not average individual conversion percentages.
  - Defensive rates currently remain historical because model defensive rate projections do not exist. The EV lane composes selected skater chance-allowed profiles using paired model opportunity where available, otherwise historical-path opportunity, and the existing five-skater normalization. Dedicated PP and PK lanes use matching historical strength profiles until dedicated defensive models exist.
  - Missing personal defensive profiles or unusable opportunity replace both rates and TOI with training-only third-line averages. Rank active same-run defensive TOI rows within source team by latest-training-season TOI, taking forwards 7-9 or defensemen 5-6. Use the peers' average projected TOI and pooled defensive bucket counts divided by their total exposure, counting each peer's exposure once. Preserve valid zero outcomes. Expose third_line_average provenance and defensive_toi_seconds.
  - If the run lacks a complete third-line cohort, use available same-position peers; if they lack defensive profiles, use pooled training defensive profiles and the existing F3 or D3 line-estimate minutes. If the entire run lacks defensive evidence, add no defensive attempts rather than invent bucket rates; retain the configured offensive weight. Missing individual evidence must not silently remove that skater when training evidence is available.
  - Missing personal offensive volume uses pooled training-bucket rates scaled by fallback TOI. Only when no pooled evidence is available retain existing replacement estimates in Other. Preserve unresolved roster identities.
  - Historical profile composition retains its existing weighted bucket helpers for legacy statistical reports. Those helpers are not permitted as an alternate game prediction path; NhlCustomGamePrediction.yaml owns current offense/defense adjustment and conversion.
  - Annual skater and goalie projection builds retain matching-strength historical profile support for their statistical outputs. These builds do not choose new game EV/PP minutes or add a short-handed scoring lane to the current engine.
  - EV goalie skill uses the same-run, training-only EV GSAx adjustment when available. PP and PK goalie response is league average: projected GA equals projected xGA in those lanes. When the EV skill input is unavailable, use the existing per-bucket goalie calculation as the exclusive EV fallback. Never shrink a goalie adjustment twice. Final goals cannot exceed projected shots on goal.
  - The same model-bucket defensive environment supplies the season goalie contribution used by goalie edge. Its existing season-versus-matchup weighting remains unchanged.
  - Pinned model goalie builds store compatible full-game buckets and model provenance in existing projection metadata. They must not add a broad adjustment derived from a different historical xG model.
  - SAT-model confidence must use the selected run's evidence in both live and historical predictions. Skaters use stored rate-bucket confidence weighted by source SAT; historical fallback uses personal training-profile confidence with the same weighting. Absent personal evidence has zero personal-evidence confidence, even when a pooled performance estimate is supplied. Defensive rows expose personal defensive profile confidence, with zero for third-line replacements.
  - Goalie input confidence is the projected-attempt-weighted mean of the existing sample-shrunk exact-bucket skill confidences, including neutral missing buckets at zero. A goalie bucket reaches its stored-profile-confidence ceiling at one hundred historical SAT, matching the skater evidence scale. Do not use the internal post-shrink confidence of one as evidence confidence or borrow unrelated season confidence. This does not change goalie skill shrinkage.
  - The internal input-quality helper supplies current game/API confidence unchanged. Skater evidence comes from same-model stored rate-bucket confidence weighted by source SAT when the existing same-run TOI/rate publication gate is usable, otherwise personal Train profile confidence; absent personal evidence remains zero. Confidence-only reads must not rebuild annual performance projections. Known goalie evidence uses the existing exact EV bucket/sample-confidence formula weighted by opposing projected EV attempts; missing matching buckets contribute zero. A missing goalie identity remains an unavailable confidence input and uses the existing helper default. Current game scoring never consumes these confidence values.
  - Internal team confidence is seventy percent skater input confidence and thirty percent goalie input confidence. Skaters are weighted by their new engine projected goal contributions, including players until ninety-nine percent of team goal contribution is represented. Preserve the existing fifty-percent defaults for missing skater/goalie values or an empty goal-contribution denominator, then average the two teams, round and bound the game score to one through one hundred. This is not a win probability and needs no outcome calibration to be published. No legacy presentation boost or discovery-record blend applies to current custom forecasts.
  - An internal per-call SAT run override resolves the training horizon from that run, rejects incomplete runs or training seasons at or after the game season, and bypasses unrelated legacy projection versions. Default model selection is unchanged. Stored-boxscore evaluation takes only participant identities and recorded starters from the evaluated games, uses the normal build and simulator path, and must not fetch providers, import data, or persist live starter locks.
public_interface:
  - NhlSatModelPredictionService
  - NhlHistoricalPredictionService
  - NhlGoalieProjectionBuilder::buildModelGoalie
  - NhlGamePredictionPayload::confidenceScore
  - NhlSatModelPredictionService::confidenceScores
  - NhlSatModelPredictionService::goalieConfidenceBuckets
  - NhlGamePredictionPayload::teamInputConfidence
  - nhl:goalie-projections --sat-model
example_usage: |
  Bucket SAT/GP = projected_xsat_per_60 * projected_toi_per_game_seconds / 3600
  php artisan nhl:goalie-projections --source=20252026 --target=20262027 --goalie-workload-version=WORKLOAD_VERSION --toi-version=TOI_VERSION --version=NEW_GOALIE_VERSION --sat-model=latest
