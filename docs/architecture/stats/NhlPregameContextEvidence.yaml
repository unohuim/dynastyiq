  - POST /admin/nhl-sat-models/{run}/context/build
  - POST /admin/nhl-sat-models/{run}/context/pause
  - POST /admin/nhl-sat-models/{run}/context/resume
  - POST /admin/nhl-sat-models/{run}/context/stop
  - GET /admin/nhl-sat-models/{run}/context/progress
  - GET /admin/nhl-sat-models/context/effects
