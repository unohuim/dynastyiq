name: NHL Custom Game Prediction Evidence
type: Default Pregame Game Calculator And Immutable Prediction Evidence
location:
  - app/Services/NhlCustomGamePredictionEngine.php
  - app/Services/NhlCustomGamePredictionInputs.php
  - app/Services/NhlCustomGameForecast.php
  - app/Jobs/PrepareNhlGamePredictionJob.php
  - app/Exceptions/NhlGamePredictionPreparing.php
  - app/Services/NhlCustomGameDefense.php
  - app/Services/NhlCustomGamePredictionReplay.php
  - app/Services/NhlGamePredictionPayload.php
  - app/Console/Commands/ReplayNhlCustomGamePredictionsCommand.php
  - config/nhl-custom-prediction.php
purpose: Supply the single default EV/PP game calculation for API, admin, refresh, evaluation, simulator and command callers while retaining immutable source and outcome evidence.
when_to_use:
  - Predicting every scheduled game explicitly requested for a date in any state.
  - Publishing scores and probabilities through existing API and admin prediction interfaces.
  - Replaying or optionally saving a separately versioned chronological experiment.
when_not_to_use:
  - Rewriting earlier saved predictions or assigning their measured accuracy to a new algorithm.
  - Using target results, future training seasons or outcome-based error groups to choose inputs.
rules:
  - Every new game prediction uses this calculator. Legacy engine and stack containers cannot select a different calculation or apply their retired percentages, goal dilution, confidence boosts, gap gates or fallback math. Other annual player/goalie statistical builders retain their own purpose.
  - Default model selection prefers the configured SAT_V2 model. For earlier game seasons choose a complete eligible model whose Train ends strictly before that game season. Explicit model overrides retain that same temporal boundary. Freeze the selected model's own Train and retained level-one confidence-at-least-one-half bucket mapping; never widen to all attempts to fill missing data.
  - The completion target is one hundred percent after fallback, never an observed-history admission threshold. Missing personal rate/usage inputs use frozen Train league evidence at the same retained bucket and strength. Keep genuine observed zeros. Preserve observed coverage separately from effective completed inputs and confidence. No game is withheld because observed coverage is below ninety or one hundred percent.
  - Team opportunity shares fall back from team Train to pooled league Train. Missing L10 allowed opportunities leave the allocated baseline intact. Missing team L5 PP goals-against falls back to team Train and then league Train. Missing player L20 PP goals/game falls back to personal Train and then pooled league Train; record each chosen source. Team PK success without personal/team exposure uses the league reference.
  - No prediction requires target scores, shot facts or completed target clocks as statistical inputs. Finished games use actual participant identities; unfinished games resolve verified anticipated identities, then projected rosters and last-known prior lineups when needed. A finished game without actual participant evidence remains unavailable rather than substituting an anticipated roster. Do not invent player identities or turn a corrupt model/invalid numeric input into a successful forecast.
  - Build history from completed prior regular-season results. Personal recent appearances cross seasons and trades. Use the earlier of request time and scheduled start as the forecast cutoff, or request time when no scheduled time exists; keep the unknown scheduled time unknown in public game metadata. Target participant identities may identify the lineup after completion; target statistical results are never advanced into its own prediction history. Current-input forecasts on past dates are not historical lineup backtests.
  - Today and past-date operational predictions require saved same-model team, selected-player and selected-starter context with committed comparisons. Context history validity is independent of the selected lineup, line assignments and starter; it includes the model, target schedule and prior source-result identity. Unchanged history reuses committed team/player rows at their original common cutoff. Missing selected participants queue scoped work that adds only their context, links it to the existing teams and waits for its own committed comparisons. Corrected source results still invalidate history. Historical replay retains its existing same-model/cutoff validation.
  - Future-date operational requests use the Toronto calculation date to bypass target-context building. Reuse the newest committed same-model, same-version team and personal context available at calculation time. Keep original context identities, cutoffs and player-parent provenance in private revision inputs; a traded player retains personal history while the anticipated lineup supplies the upcoming team. Missing or previous-season personal snapshots use the existing chronological personal/Train/league fallback without pretending to have current-season saved aggregates. Match personal bucket history to each reused same-season snapshot cutoff. Do not advance unplayed results or alter historical Test replay validation.
  - Future targets bind both actual scheduled teams and current anticipated starters/lineups. Derive rest, density and travel from the target schedule, including intervening scheduled games; do not reuse another game's opponent history, venue-specific windows, rankings or schedule classifications. Calendar-day rollover and committed fallback-context changes invalidate future prepared/response inputs. Forecast source cutoffs and saved revision horizons remain frozen.
  - Only EV and PP contribute forecast goals. PK time is opposing PP time and is subtracted with own PP from regulation time to obtain EV. No short-handed goal lane is created.
  - Calculation order, frozen opportunity and duration references, normalized L10 player usage, equal Train/L10 SAT rates, player EV L20 and PP L5 SOG conversion, EV Train bucket reliability and PP season-to-date goal conversion, neutral goalie stage and final PP allocation follow the adopted rules in NhlNextGameEvaluation.yaml.
  - EV goal conversion uses the adopted personal Train SAT-per-bucket threshold and player/team/league Train blend, not personal SOG volume, overall player SAT or LSeason percentage. All three components use pooled goals divided by pooled SOG for the same retained EV bucket. Missing personal or team denominators use the matching league component; measured zeros remain supported. The team's frozen Train counts include all eligible historical skaters at their historical teams, independent of the anticipated lineup and selected personal-history subset. Accumulate these counts only while advancing Train history, with the same player/lane validity as the league pool; never count Train fitting twice or add target/Test results. Preserve this state through bounded preparation checkpoints and reset it with each new input build. Archive per-bucket Train SAT, threshold, component rates and weights privately. Version prepared inputs and algorithm provenance together so old cached inputs cannot bypass the adopted rule. Existing SOG and final team PP allocation remain separate calculations.
  - Count only retained model buckets and exclude empty nets and shootouts. SOG requires an actual shot-on-goal or goal event. Matching-strength exposure remains complete. Measured zero conversions remain zero; missing goal conversion uses matching Train league bucket and then matching-strength league evidence as documented.
  - Fit multiplicative bucket attacking/defending factors using only the chosen model's Train attempts and unioned strength-clock exposure, preserving the adopted neutral prior, bounded updates and coefficients. Upcoming defense is compared with the exposure- and rate-weighted defensive reference represented by each player's history. Never refit on requested target outcomes.
  - Defensive history resolves the intended recent team window, then team Train, then league Train. The PP defensive period starts at its adopted Train window. Incomplete/empty windows or absent exposure trigger fallback without replacing games in the requested window. Zero attempts with complete positive exposure retain the prior calculation. An unseen defensive bucket within a supported league strength has no evidenced departure from the neutral league factor; another strength is never substituted. Preserve selected allowance sources and reference source shares.
  - Frozen coefficients retain their documented reference Train seasons. Explicit requested-date predictions may transfer those agreed coefficients to another selected model, recording that transfer without claiming recalibration or inheriting an older measured win rate. The separately scoped original Test replay retains its documented coefficient-horizon validation.
  - The approved schedule layer remains exact fourth-in-seven plus B2B only, with separate forward/defenseman SAT multipliers and an additional probability delta only for the qualifying away team. Other travel/venue effects remain neutral. Numeric references remain owned by the adopted evaluation rules.
  - Apply the adopted L5 team-win-percentage factor to every EV player bucket in every quarter, including games whose teams are in different quarters. Read both saved team_metrics.last_5 samples; with positive game counts and finite win percentages in zero to one hundred, let d equal (home win percentage minus away win percentage) divided by one hundred and multiply home EV SAT by one plus one-half d and away EV SAT by one minus one-half d. Carry that volume through unchanged SOG/SAT and SH% conversions. Keep player usage, PP opportunities/time/goals, defense and the separate schedule rule unchanged. If either sample is missing or invalid, keep both multipliers neutral; observed zero win percentage is valid. This factor is independent of the schedule-enabled switch and requires no historical reads or quarter calculation. Archive its source rates, sample counts, availability, weight and multipliers in revision evidence.
  - The final conditional team PP split is scaled to the separate seventy-five/twenty-five game total and replaces intermediate bucket PP goals. Preserve relative bucket-goal weights, or SOG weights when necessary. Invalid allocations or impossible numeric/model evidence remain explicit errors; never silently switch to a legacy engine.
  - Winner probability uses independent Poisson regulation scores with an equal resolution of tied regulation scores, then the approved schedule delta and complementary opponent probability. Display scores round these team goals once with no legacy weight normalization. Moneyline API markets use these returned probabilities rather than recomputing a different tie rule.
  - Every successful calculation returns numeric internal input confidence using the unchanged NhlGamePredictionPayload confidenceScore/teamInputConfidence helpers and actual same-model stored confidence evidence under NhlPredictionInputServices rules. This is input quality, not win probability, outcome calibration or completed-input coverage. Reuse the existing seventy/thirty skater/goalie weights, ninety-nine-percent goal contribution selection, missing-value defaults, team averaging and integer bounds. Do not restore legacy presentation boosts or discovery-win blending. Compute confidence after scores/probabilities without altering them or qualification. Earlier revisions may retain null confidence. Successful non-tied predictions remain available without legacy qualification filters; exact equal winning probabilities retain no-clear-winner recommendations.
  - Public confidence is a separate presentation rating calculated by the existing payload helper under NhlGamePredictionHistory.yaml. It does not select winners, alter probabilities, adjust goals or qualify games. Persist it with each revision and retain it on later reads; never replace the unchanged stored internal confidence with it. The partner response-only alias is governed by NhlGamePredictionResponseCache.yaml.
  - NhlCustomGameForecast is the shared preparation/calculation boundary, not a second algorithm. Cold requests queue one shared preparation per model/date/roster variant and return preparing. PrepareNhlGamePredictionJob on projections checkpoints bounded Train collection, independent bucket fitting, prior-result pages and individual targets in the existing cache under an atomic lock. Preserve the exact existing equations. Publish per-game inputs before their small ready manifest; interrupted pages retry from the last committed checkpoint.
  - Preparation checkpoints use bounded independently checksummed cache parts and a small commit-last manifest, never a single serialized accumulated reader. Preserve allowlisted native DateTime and Carbon timestamps as typed scalar records, including their original class, instant, microseconds and named timezone; reconstruct only those explicit date classes, without enabling arbitrary-object deserialization. Keep numeric types, ordering, source fingerprints, accumulated Train/team/league counts, fit state and chronological cursors unchanged. Load only the selected target's saved context during target preparation; preserve other targets' immutable context parts without hydrating them on history pages. Renew retained part lifetimes alongside committed progress. Missing, corrupt or unsupported checkpoint data must fail explicitly rather than silently dropping counts. A failed write cannot advance the committed cursor; obsolete committed parts are removed only after replacement publication and abandoned uncommitted generations expire.
  - A matching legacy preparation checkpoint converts at its existing cursor before processing another page. Keep the existing preparation key, algorithm/configuration and queue identity so serialized pending jobs can resume; a changed source fingerprint still requires the existing clean rebuild. Diagnostic checkpoint metadata and bounded log entries include stage, cursor, part count/size, write duration, saved timestamp and process peak memory, never private bucket contents. No new tables, shared queue recovery changes, automatic worker restarts or production recovery operations are introduced by this storage change.
  - Where a matching same-season snapshot is available, operational preparation reads player strength-window games, exposure and total SAT/SOG/goals from that saved pregame snapshot rather than reaggregating those values. Preserve zero-strength appearances, usable Train samples and incomplete recent-window handling. Raw history still supplies unstored per-bucket counts, fitted defensive factors, historical opponent references and team special-teams/league references absent from the snapshot. Do not substitute unfiltered team totals for retained-bucket counts or silently reconstruct missing saved player aggregates. The separately scoped transient reader and historical replay retain their chronological aggregation.
  - Result freshness uses deterministic source game values and player-summary content, excluding creation/update and polling timestamps. Reuse per-game summary digests in the existing expiring cache and recalculate touched games in bounded pages. Database row revisions may invalidate an internal digest cache entry without changing the resulting statistical fingerprint. Successful derived-fact import publication and processed PBP revisions remain independent conservative invalidators because shot/strength corrections can leave summary totals unchanged.
  - Freeze source cutoffs and anticipated participants before queuing context. Fingerprints include model/configuration, completed source games/summaries/import publications, schedule, lineup and starter identities. Changed evidence restarts pending preparation; pending work and errors expire. Never publish an earlier fingerprint or replace missing identities with target outcomes. Terminal failures release admission and expose an error rather than leaving work preparing indefinitely.
  - Context history fingerprints exclude selected participants while prepared forecast fingerprints continue to include them. Older participant-bound context hashes may be verified using the owning run's frozen participants and the current historical source identity; absent or unverifiable provenance requires the normal rebuild. Do not assume stale history is current merely because rows exist. Prediction input admission and lineup-write exclusion are owned by NhlGamePredictionHistory.yaml.
  - API, admin and requested-date command use the same operational payload/cache boundary. Pending dependencies release jobs without spending the exception budget and retain a fixed one-day retry deadline. Successful dependency completion automatically continues prediction and revision publication. The explicit historical Test replay remains separately scoped.
  - The operational payload requires a source-bound ready Matchup snapshot under NhlGamePredictionResponseCache.yaml before a prediction can be published. NhlCustomGameForecast exposes its prepared source fingerprint for this dependency; source changes isolate old pending work. Historical replay and the calculator equations remain unchanged.
  - Operational API/manual output uses the existing response-cache and immutable revision tables. Archive full custom inputs and fitted/source metadata privately in revision evidence and remove that private envelope before returning/caching public responses. Earlier revisions are never overwritten. The standalone explicit-save replay retains its separate custom run tables.
  - Goalie Edge remains a diagnostic API section with the selected identities, available season evidence and the new opposing SOG/goal estimates. Missing components are labelled. It does not change the adopted neutral goalie scoring stage.
  - Goal accuracy uses pooled absolute summed prediction/actual difference divided by summed prediction, and strict individual prediction-denominator p10/p20. Preserve team/game units and zero-case handling. Winner comparisons use the actual returned predicted winner, including any approved probability adjustment, against official final winners including OT/SO.
public_interface:
  - NhlCustomGameForecast::predict
  - NhlCustomGameForecast::model
  - NhlCustomGamePredictionEngine::predict
  - NhlCustomGameForecast::advancePreparation
  - NhlCustomGameForecast::resultEvidence
  - NhlCustomGameForecast::reusableContextTeams
  - NhlCustomGamePredictionInputs::beginQueuedForecast
  - NhlCustomGamePredictionInputs::advanceQueuedForecast
  - NhlPregameContextBuilder::predictionScheduleEvidence
  - NhlCustomGamePredictionInputs::futureContextIdentity
  - NhlPregameContextBuilder::predictionTeamEvidence
  - NhlCustomGamePredictionReplay::run
  - nhl:custom-predict
example_usage: |
  Existing API and admin routes calculate through NhlCustomGameForecast.
  Use nhl:custom-predict --model=2 --date=2026-11-05 for an explicit date.
  Use the separate Test replay command with --save only when explicitly requested.
