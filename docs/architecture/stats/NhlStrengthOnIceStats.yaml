name: NHL Strength On-Ice Stats
type: Stats Aggregation Pattern
location:
  - app/Services/SumNhlGameStrengthUnits.php
  - app/Services/NhlStrengthStatsQuery.php
  - app/Models/NhlUnitGameStrengthSummary.php
  - app/Models/NhlPlayerGameStrengthSummary.php
  - app/Http/Controllers/StatsUnitsController.php
  - app/Services/NhlTeamLines.php
  - app/Http/Controllers/NhlLinesController.php
  - resources/js/pages/Tools/Lines.vue
  - database/migrations/2026_06_29_020001_create_nhl_strength_summaries_table.php
purpose: Persist strength-aware on-ice totals by game so stats requests can aggregate summaries instead of scanning raw play-by-play events.
when_to_use:
  - Building unit or player on-ice stats by season, range, game type, or strength.
  - Deriving per-game, per-60, percentages, or IPP from grouped totals.
  - Refactoring stats reads away from raw play-by-play event scans.
when_not_to_use:
  - Importing raw play-by-play events.
  - Replacing official boxscore validation.
  - Storing cheap rate variants that can be derived from totals.
rules:
  - Request-time stats must aggregate from persisted game-strength summaries, not raw play-by-play rows.
  - The line-combination report groups summaries by unit across selected games when Sum is checked, and by unit and game when unchecked; both modes combine all shifts within each unit-game.
  - Line-combination date filters use the stored NHL schedule date and combine with season, game type, team, unit type, and optional game constraints before aggregation.
  - Game choices must come from summaries in the selected scope; player choices must come from participating units within that scope and optional game, before applying the selected player or volume limits.
  - A player selection retains complete combinations containing that player and must not multiply their statistics through player joins.
  - Stale game and player selections outside the current scope must be cleared; clearing the date also clears the selected game in the UI.
  - Date, game, player, and per-game views must not inherit season-volume minimum defaults; explicit volume limits apply to the chosen grouping.
  - Strength values must remain aligned with docs/ENUMS.md.
  - Empty-net contexts remain EV unless a separate context flag is approved.
  - Per-game, per-60, percentages, and IPP must be derived from raw grouped totals before slice rounding. An IPP ratio must not change when presentation switches between totals, per-game and per-sixty.
  - Player on-ice GF and individual scoring participation use the same distinct game/player/goal/strength population from linked unit events. A goal counts once per player even across duplicate unit memberships or shift links. Participation counts at most one point per goal, with no shootout or opposing-team goals. Official individual scoring remains in boxscores and game summaries; off-ice assists do not become on-ice participation.
  - The ordinary stats ipp alias uses EV-only participation and EV on-ice goals while other on-ice aliases retain their existing populations. Explicit strength-summary queries retain their selected strength. Empty-net contexts follow the existing EV rule rather than silently narrowing EV to five-on-five.
  - Missing EV goals or inconsistent persisted point/goal populations produce an unavailable derived IPP. A bad individual game cannot be hidden by pooling it with other valid games. Display percentages are never repaired by capping them at one hundred; stored legacy zero-denominator ipp values do not imply a meaningful zero-percent result.
  - Legacy nhl_unit_game_summaries may remain during migration but must not be the target strength model.
  - The public Tools Lines page uses current-season schedule participants and each team's latest completed scheduled game independently. Do not substitute an older imported game when its latest game lacks summaries. Read prepared strength summaries and canonical memberships in batches without raw-event or shift scans, imports, predictions, or request-time writes.
  - Tools Lines combines shared TOI by identical complete player membership before ranking. EV accepts forward trios and defensive pairs. PP requires a complete stored five-skater PP unit; PK requires a complete stored three- or four-skater PK unit. Never split special-teams units into forward/defensive groups or combine different full rosters by a shared subgroup. Goalies cannot become skater combinations.
  - Tools Lines greedily selects combinations by descending shared TOI, breaking ties by stable unit ID. Each selected player is excluded from subsequent groups within that team and strength. EV permits up to four forward lines and three defensive pairs; PP and PK each permit up to two whole units. Reset player exclusion between strengths. Missing or overlapping evidence may produce fewer groups; never manufacture replacements.
  - Tools Lines positions are inferred for display and must never change unit selection, membership, or TOI. Use that game's prepared boxscore faceoffs won plus lost to prioritize the center, then maximize defensemen in back spots and listed wing/center eligibility with stable membership-ID ties. Missing faceoff data uses listed-position/stable-ID fallback. Extra forwards fill back spots when necessary; unknown listed positions do not discard an otherwise complete unit. Display first initial and surname while retaining the full name for hover. Display-slot values are canonical in docs/ENUMS.md.
public_interface:
  - SumNhlGameStrengthUnits::sum()
  - NhlStrengthStatsQuery::players()
  - NhlStrengthStatsQuery::units()
  - NhlUnitGameStrengthSummary
  - NhlPlayerGameStrengthSummary
  - NhlTeamLines::read()
  - GET /tools/lines named tools.lines
example_usage: |
  app()->make(SumNhlGameStrengthUnits::class, ['gameId' => $gameId])->sum();
