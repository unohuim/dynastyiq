name: Stats Page Renderer
type: Frontend UI Pattern
location:
  - resources/js/pages/Stats/Index.vue
  - resources/js/pages/Stats/Teams.vue
  - resources/js/pages/Stats/Table.vue
  - resources/js/pages/Stats/LeaderList.vue
  - resources/js/pages/Stats/LoadingState.vue
  - resources/js/pages/Stats/CategoryNav.vue
  - resources/js/pages/Stats/Mobile/PlayerCardList.vue
  - resources/js/pages/Stats/Mobile/PlayerCard.vue
  - resources/js/pages/Stats/Desktop/PlayerRows.vue
  - resources/js/pages/Stats/Desktop/PlayerRow.vue
  - resources/js/pages/Stats/Desktop/PlayerAvatar.vue
  - resources/js/pages/Stats/Desktop/LeagueOwnerRows.vue
  - resources/js/pages/Stats/Desktop/StatCellsRow.vue
  - resources/js/pages/Stats/Desktop/OwnerRow.vue
  - resources/js/pages/stats-page.js
  - resources/js/components/StatsPage/stats-page.js
  - resources/js/components/StatsPage/stats-desktop.js
  - resources/js/components/StatsPage/stats-mobile.js
  - resources/js/components/StatsPage/stats-utils.js
  - resources/js/components/StatsPage/ui/
purpose: Render desktop and mobile stats experiences from the stats payload while sharing utilities and UI primitives.
when_to_use:
  - Stats table rendering on /stats.
  - Stats card rendering on /stats.
  - Existing StatsPage module maintenance.
when_not_to_use:
  - Player-only stats pages.
  - Admin import UI.
  - Backend stat aggregation.
rules:
  - Stats/Teams.vue renders the compact team table, local search/team filtering and collapsible season/date/game-type/slice controls. Warm filter requests aggregate the prepared season game snapshot without querying source facts. Per-game/per-sixty slices change counting stats only; GP, W, standings PTS, percentages and GAA retain their meanings. Null metrics sort after numeric values.
  - Stats/Index.vue owns the /stats Leaders landing and category navigation; its dashboard contract is defined in NhlStatsDashboard.yaml. Stats/Table.vue retains the existing perspective-driven renderer for Skaters and Goalies.
  - The first Inertia migration pass may mount the existing StatsPage renderer for parity.
  - Vue mobile card components may own mobile player-card list rendering below the existing stats shell.
  - Vue desktop row components may own desktop row rendering below the existing stats shell.
  - StatsPage owns remaining Skaters and Goalies table rendering below Stats/Table.vue until migrated.
  - Stats/Table opts into the approved dashboard filter-bar design. The shell owns both filter rows; the desktop renderer supplies its existing local search/team controls to the shell without changing their state or filtering rules. Other stats consumers retain their existing controls.
  - Dashboard filter visibility is local shell state. Search and Position are the default quick controls; the full filters replace them through the persistent toggle without resetting filter selections or duplicating search state. Inactive controls are inert and aria-hidden.
  - The active Skaters or Goalies tab scopes the Report selector to matching visible perspectives. Canonical goalie report slugs contain the goalies segment, including prospects-goalies; filtering the selector does not replace backend perspective authorization or change other stats consumers.
  - CategoryNav reports navigation start/finish locally so loading feedback appears before the network response. Switching between loaded Skaters, Goalies and Prospects preserves the rendered page with a visible compact loading status while a partial visit resolves both leader facts and the target table, then swaps them together without an intermediate skeleton or layout collapse. Teams and other full transitions keep visible skeleton feedback. Other navigation and initial visits retain dark accessible skeleton and error/retry states. Independent rescued Deferred boundaries isolate leader facts and player-table failures on initial load; mounting the table waits for its own initialPayload only. Reduced-motion preferences suppress skeleton animation.
  - The public desktop dashboard table opts into graphite rows and factual rate bars. Mobile player lists follow the approved compact reference in docs/UI_DESIGN.md without extra rate-bar rows. Skater pts_pg is derived from matching point totals and games before any per-game or per-60 slicing; it is not divided again when the slice changes. Missing or zero-GP rates remain unavailable. Presentation scales never change numeric stats or prediction inputs.
  - Shared utilities should remain inside the StatsPage module unless they become intentionally generic.
  - New or materially touched rendering must comply with docs/UI_DESIGN.md where feasible.
public_interface:
  - Stats/Index.vue Inertia page
  - Stats/Mobile/PlayerCardList.vue
  - Stats/Mobile/PlayerCard.vue
  - Stats/Desktop/PlayerRows.vue
  - Stats/Desktop/PlayerRow.vue
  - Stats/Desktop/PlayerAvatar.vue
  - Stats/Desktop/LeagueOwnerRows.vue
  - Stats/Desktop/StatCellsRow.vue
  - Stats/Desktop/OwnerRow.vue
  - StatsPage JavaScript module
  - StatsController::payload()
example_usage: |
  The /stats page initializes the StatsPage renderer with server-provided payload data.
