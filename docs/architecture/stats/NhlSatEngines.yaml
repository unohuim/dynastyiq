name: NHL SAT Engines
type: Saved Prediction Settings And Historical Discovery
location:
  - app/Models/NhlSatEngine.php
  - app/Models/NhlSatEngineRun.php
  - app/Services/NhlSatEngineSettings.php
  - app/Services/NhlSatEngineEvaluator.php
  - app/Http/Controllers/Admin/NhlSatEngineController.php
  - app/Jobs/EvaluateNhlSatEngineGameJob.php
  - app/Jobs/RankNhlSatEngineCandidatesJob.php
  - resources/js/pages/Admin/SatEngines/
purpose: Save model-dependent engine settings, select the default engine for ordinary game predictions, and discover candidate settings against explicitly selected historical games.
when_to_use:
  - Creating, editing, building or deleting saved SAT engines.
  - Searching independent offensive and matching-defensive weights, confidence intervals and score gaps for desired observed win percentage and minimum coverage.
when_not_to_use:
  - Training or rebuilding SAT model outputs.
  - Claiming discovered sample accuracy is a calibrated future win probability.
rules:
  - Engine management is protected by the existing authenticated super-admin and admin-lifecycle middleware. Pages and page interactions are Vue/Inertia; reuse the application shell without introducing page Blade, Alpine or Livewire behavior.
  - Engine definitions link independently selected Test Model and Production Model SAT runs to independent offense and defense percentages, inclusive confidence bounds and a strictly exceeded absolute score-gap threshold. Both selectors list every SAT model. Exactly zero or one engine is default. The first engine is automatically default; switching defaults is explicit. Deleting a default promotes the newest remaining engine. Saving, applying a candidate or changing the default must never start evaluation as a hidden side effect.
  - Historical engine discovery and testing use the engine's Test Model. Ordinary game predictions use the default engine's Production Model, independent weights, confidence bounds and strictly exceeded goal-gap threshold. Never normalize weights or introduce defense-only keys. The partner API does not accept an engine-selection parameter.
  - A run snapshots its model identity and update timestamp, selected game IDs, scope, target tolerances and candidate settings. Editing an engine must not rewrite prior runs. Model updates during execution invalidate the run rather than mixing input generations.
  - Evaluations require a completed SAT model, complete rate and TOI builds with corresponding outputs and goal evaluation, and a model test season strictly after its training seasons. A projection-only model may be saved on an engine but cannot be evaluated without a test season.
  - Scope uses completed regular-season games in the selected model test season. Apply optional start/end dates and either-team filters first, then select the first, last or random N games or distinct matching dates. First is the default; same-date game order uses NHL game ID. Selecting dates includes all matching games on those dates. Selected teams form a union; games are never counted twice. A count applies to the union, not independently to each team. If fewer units exist than requested, select all available units. Explicit IDs outside scope are rejected; entire-season and explicit-ID modes do not sample.
  - Random selection uses a fresh server-generated seed to rank eligible game IDs or distinct dates without replacement. Persist that seed and the resolved game IDs before queuing. Every split, retry and ranking stage reads the same frozen IDs; do not resample in workers. Return selected games in chronological order for presentation. Selection may materialize at most 3000 game identifiers/dates, not boxscores or prediction inputs.
  - Historical predictions reuse the normal payload with a pinned SAT run and stored boxscore identities and starters. Never use observed TOI, outcomes or held-out profiles as prediction inputs; never fetch providers or import historical inputs during evaluation.
  - Discovery accepts model, game scope and win/coverage targets, never manual offense/defense, confidence or gap search ranges. Build retains explicit saved settings. Stale client ranges must not restrict new discovery. Discovery settings are results that can be adopted into an engine.
  - Automatic weight search covers independent 0–200 percentages at 25-point intervals, then refines at most three distinct promising pairs within 25 points at five-point intervals and within five points at one-point intervals. Never normalize weights. Rank refinement centers by meeting both targets, then smallest summed percentage-point shortfall, then win rate, coverage and stable ID. Reuse previously evaluated pairs. This is a bounded staged search, not a guarantee of the global optimum over all weight pairs. Retain earlier-stage results.
  - One queued job handles one game and weight pair. New automatic discovery uses at most four sequential lanes per run; after a pair's last game its lane continues with the next unevaluated pair. Persist results and completion counters atomically and idempotently; cancelled and failed runs cannot be completed by stale workers. Ranking starts only after all expected results exist. One pair per automatic ranking job loads at most 3000 scalar game results, never model-wide PHP datasets. Legacy confidence-only discovery uses at most 101 aggregated confidence rows per weight/gap unit; configured builds and older explicit-range runs retain bounded ten-candidate pages.
  - A run supports at most 3000 selected games. Automatic search is bounded by 81 broad pairs plus at most 363 pairs per refinement, with duplicates removed. For each tested pair, evaluate all distinct strictly-exceeded gap selections within 0–10 goals at persisted gap precision and all inclusive integer confidence intervals within 0–100. Equivalent intervals tighten to observed confidence bounds. Retain the best win-rate/coverage frontier across gaps and confidence for that pair, with lower gaps preferred on tied records. A discarded qualification alternative is no better in either measure. Targets do not prune useful below-target alternatives. Explicit builds retain all configured settings.
  - Snapshot automatic search strategy and stage in the run definition alongside confidence_search. Each newly evaluated weight pair counts once for ranking progress, independent of retained qualification candidates. Append refinement pairs and increase work totals atomically with the prior stage's last receipt; freeze model, games and targets throughout. Persist variants and receipts atomically so duplicate delivery cannot add rows, counts or stages twice. Runs without the automatic strategy retain their original weight/gap semantics and limits. No migration or rewrite of previous results is required.
  - Missing stored prediction evidence, final boxscore totals or either team's SAT facts produces a visible excluded game. Unexpected execution errors fail the run. All-game totals use all eligible games, regardless of qualification. Qualified record and win percentage use only qualifying non-tied predictions; coverage divides qualified picks by eligible games. Always expose selected and excluded counts. No qualifying picks yields null win percentage and never meets targets.
  - Predicted goals and gaps use the existing per-game summary precision before display rounding. Confidence is the engine's returned game confidence. Actual goals and SOG use final boxscore totals; SAT counts distinct shot-attempt play IDs including unknown types and excluding shootout attempts. Final winner includes OT/shootout; actual goals follow the official final score convention.
  - Rank the main candidate list by meeting both targets, then observed win percentage, coverage and stable ID. Independently surface candidates meeting desired win percentage but below minimum coverage, ordered by closest coverage then highest win percentage, with separate pagination and an explicit percentage-point shortfall. There is no hidden near-miss cutoff. These alternatives remain selectable and are never marked as meeting both targets. Applying an evaluated candidate explicitly copies its persisted model and settings into a chosen or new engine without modifying the source model or API defaults.
  - Evaluated result rows in both tables expose direct engine creation with a name prompt and exact settings preview. Discovery copies only settings to an engine: an existing engine retains its production model, and a new engine uses the selected production model. The clicked candidate stays fixed across polling updates. Creation requires persisted candidate metrics and a run that is active or complete; pending candidates and failed/cancelled runs are rejected. The full discovery need not finish first. Saving never starts another build, changes discovery progress or applies client-supplied prediction settings. Candidate IDs remain scoped to their run and existing super-admin authorization remains required.
  - The engine index separates saved Engines from persisted Discoveries without changing engine or run routes. Run candidate tables use server-owned URL query parameters for sorting, filtering and pagination. Every meaningful displayed candidate metric is sortable; filters may narrow persisted candidate rows by target status, coverage, win rate, offense, defense, confidence bounds, gap, and eligible or excluded counts. Active-run polling preserves the selected candidate query state.
  - Deleting an engine with active runs is rejected. Cancel cooperatively first. Completed run evidence survives engine deletion. Rebuild or rediscover creates a fresh run after failure; do not certify a partial run.
public_interface:
  - /admin/nhl-sat-engines
  - /admin/nhl-sat-engines/discover
  - /admin/nhl-sat-engines/{engine}/default
  - /admin/nhl-sat-engines/runs/{run}
  - NhlSatEngineSettings
  - NhlSatEngineEvaluator
example_usage: |
  Select Sep2026, the first five matching game days, all teams,
  desired win percentage 60 and minimum coverage 40.
  Discovery automatically searches offense/defense weights, score gaps and confidence ranges.
  Inspect target-meeting candidates, below-coverage alternatives and actual totals,
  then create an engine from one candidate.
