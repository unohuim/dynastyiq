name: NHL SAT Engines
type: Saved Prediction Settings And Historical Discovery
location:
  - app/Models/NhlSatEngine.php
  - app/Models/NhlSatEngineCandidate.php
  - app/Models/NhlSatEngineRun.php
  - app/Services/NhlSatEngineSettings.php
  - app/Services/NhlSatEngineEvaluator.php
  - app/Http/Controllers/Admin/NhlSatEngineController.php
  - app/Jobs/EvaluateNhlSatEngineGameJob.php
  - app/Jobs/DispatchNhlSatEngineGamesJob.php
  - app/Jobs/RankNhlSatEngineCandidatesJob.php
  - resources/js/pages/Admin/SatEngines/
purpose: Save model-dependent engine settings and discover candidate settings against explicitly selected historical games.
when_to_use:
  - Creating, editing, building or deleting saved SAT engines.
  - Searching independent offensive and matching-defensive weights, confidence intervals and score gaps for desired observed win percentage and minimum coverage.
when_not_to_use:
  - Training or rebuilding SAT model outputs.
  - Claiming discovered sample accuracy is a calibrated future win probability.
rules:
  - Discovery start, stage advancement, and evaluation resume queue one projections dispatcher after commit, never a stage-sized web-request dispatch loop. The dispatcher publishes pages of at most 100 game/split coordinates and schedules its continuation without waiting for game completion. Horizon owns evaluation concurrency; the page size is not a running-worker cap. Ranking retains up to sixteen independent split lanes.
  - Persist dispatch token, next_offset and complete in the existing run definition. Serialize pages with the run row lock; enqueue game jobs before committing the cursor so a partial enqueue can retry safely using idempotent evaluation results. Continuations retain the queue connection. A continuation enqueue failure retries from the committed cursor. Stage tokens and work generations fence stale dispatchers. Exhausted dispatch retries pause the run with a resumable diagnostic and preserve committed results; Resume rebuilds dispatch from missing coordinates. No migration is required.
  - Committed results do not prove delivery of follow-up work. Evaluation redelivery at the ranking barrier restores pending ranking lanes; a committed ranking lane restores its pending successor; ranking redelivery after stage advancement restores the existing unfinished dispatcher token and cursor without appending the stage again. All these handoffs retain the delivering worker's connection and projections queue. Recovery is fenced by active status and work generation, and repeated deliveries must not duplicate results, variants or completion counters. Exhausted ranking retries must report failure even when their prior attempt already advanced the run into evaluation. Recovery relies on queue redelivery; it is not a periodic watchdog for lost queue messages.
  - Engine management is protected by the existing authenticated super-admin and admin-lifecycle middleware. Pages and page interactions are Vue/Inertia; reuse the application shell without introducing page Blade, Alpine or Livewire behavior.
  - Engine definitions link independently selected Test Model and Production Model SAT runs to independent offense and defense percentages, inclusive confidence bounds and a strict spread threshold with persisted units and direction. Missing unit and operator metadata retains legacy absolute-goal greater-than behavior. Both selectors list every SAT model. Engines are never defaultable; saving or applying a candidate must never start evaluation as a hidden side effect.
  - An engine applied from a discovery candidate records nullable source run and candidate provenance plus frozen observed win and coverage metrics. A manually created engine has no discovery provenance or observed metrics. Frozen metrics describe only that candidate's historical sample and are never recalculated from later run changes.
  - Historical engine discovery and testing use the engine's Test Model. Ordinary predictions use the selected default stack under NhlSatEngineStacks.yaml. If no default stack is available, retain the legacy prediction path with no selected engine/model weights and the existing 67–70 confidence, strictly-positive-gap qualification fallback. Never normalize weights or introduce defense-only keys. The partner API does not accept an engine-selection parameter.
  - A run snapshots its model identity and update timestamp, selected game IDs, scope, target tolerances and candidate settings. Editing an engine must not rewrite prior runs. Model updates during execution invalidate the run rather than mixing input generations.
  - Evaluations require a completed SAT model, complete rate and TOI builds with corresponding outputs and goal evaluation, and a model test season strictly after its training seasons. A projection-only model may be saved on an engine but cannot be evaluated without a test season.
  - Scope uses completed regular-season games in the selected model test season. Apply optional start/end dates and either-team filters first, then select the first, last or random N games or distinct matching dates. First is the default; same-date game order uses NHL game ID. Selecting dates includes all matching games on those dates. Selected teams form a union; games are never counted twice. A count applies to the union, not independently to each team. If fewer units exist than requested, select all available units. Explicit IDs outside scope are rejected; entire-season and explicit-ID modes do not sample.
  - Random selection uses a fresh server-generated seed to rank eligible game IDs or distinct dates without replacement. Persist that seed and the resolved game IDs before queuing. Every split, retry and ranking stage reads the same frozen IDs; do not resample in workers. Return selected games in chronological order for presentation. Selection may materialize at most 3000 game identifiers/dates, not boxscores or prediction inputs.
  - Historical predictions reuse the normal payload with a pinned SAT run and stored boxscore identities and starters. Separate skater, TOI and goalie season-projection versions are not prerequisites for stored-boxscore evaluation; use the pinned SAT inputs and their existing fallbacks without selecting unrelated season versions. Ordinary live prediction prerequisites remain unchanged. Never use observed TOI, outcomes or held-out profiles as prediction inputs; never fetch providers or import historical inputs during evaluation.
  - Discovery accepts an optional display name, model, game scope, win/coverage targets and independently optional fixed offense/defense, confidence bounds and fixed percentage spread with strict comparison direction. Blank numeric fields impose no constraint; explicit zero must survive. A supplied confidence bound limits every candidate, including refinements, while narrower intervals are allowed. A supplied spread is never varied. Legacy manual range payloads remain ignored. Build retains explicit saved settings. A selected team produces separate home and away evidence-only variants; team and venue do not select or override ordinary engines.
  - New discovery first predicts games at 100 offense and 50 defense, replacing either starting weight with its explicit constraint. Stage two searches confidence and percentage spread from those saved predictions without repeating simulations. Only stage three varies blank weights using the bounded broad/refinement passes. Entered weights remain fixed in every pass. If both weights are fixed, no weight search is necessary. Persist constraints and strategy before dispatch; existing runs retain their frozen strategy and goal-based result units.
  - Automatic weight search covers independent 0–200 percentages at 25-point intervals, then refines at most three distinct promising pairs within 25 points at five-point intervals and within five points at one-point intervals. Never normalize weights. Rank refinement centers by meeting both targets, then smallest summed percentage-point shortfall, then win rate, coverage and stable ID. Reuse previously evaluated pairs. This is a bounded staged search, not a guarantee of the global optimum over all weight pairs. Retain earlier-stage results.
  - One queued job handles one game and weight pair. New stage_games_v1 runs submit current-stage games through resumable background pages and never enqueue successor games on completion. A worker finishing a pair publishes that pair's candidates through the shared ranking logic outside the progress lock, within its existing evaluation-job budget, without waiting behind the remaining game-job backlog. Publish only after all selected games for that pair have saved results. The run may remain running with ranked candidates visible. The final evaluation barrier queues pending ranking work across up to sixteen lanes. Later stages and terminal completion require both all predictions and all pair rankings. Persist results and completion counters atomically and idempotently; cancelled and failed runs cannot be completed by stale workers. One pair ranking loads at most 3000 scalar game results, never model-wide PHP datasets. Legacy game_lanes_v1 and split-chain deliveries retain compatibility until pause/resume. Configured builds retain their existing scheduling.
  - An administrator may pause a queued, running or ranking run without discarding its frozen definition or persisted results. Pausing records the current phase and advances a work generation, making older queued jobs inert. Resuming restores that phase and dispatches only missing evaluation lanes or pending ranking work. Paused runs may be cancelled but never completed by stale work.
  - A run supports at most 3000 selected games. Automatic weight search is bounded by the starting pair plus 81 broad pairs and at most 363 pairs per refinement, with duplicates removed. For each tested pair, evaluate distinct strictly-exceeded thresholds within 0–100 percent for new discovery or 0–10 goals for legacy discovery, unless an exact spread constraint and comparison were supplied. Confidence intervals span at most three integer scores and stay within supplied bounds. Equivalent intervals tighten to observed scores. Retain the best win-rate/coverage frontier, with lower automatic gaps preferred on tied records. Targets do not prune useful below-target alternatives. Explicit builds retain configured settings.
  - Snapshot automatic search strategy and stage in the run definition alongside confidence_search. Each newly evaluated weight pair counts once for ranking progress, independent of retained qualification candidates. Append refinement pairs and increase work totals atomically with the prior stage's last receipt; freeze model, games and targets throughout. Persist variants and receipts atomically so duplicate delivery cannot add rows, counts or stages twice. Runs without the automatic strategy retain their original weight/gap semantics and limits. No migration or rewrite of previous results is required.
  - Missing stored prediction evidence, final boxscore totals or either team's SAT facts produces a visible excluded game. Unexpected execution errors fail the run. Ranking fails a fully evaluated run with no eligible games before refinement, preserving its exclusion evidence and reporting that a new run is required after correcting inputs. One all-excluded pair must not fail a run while other pairs still have unevaluated games. Eligible games with no qualifying picks are not an all-excluded failure. All-game totals use all eligible games, regardless of qualification. Qualified record and win percentage use only qualifying non-tied predictions; coverage divides qualified picks by eligible games. Always expose selected and excluded counts. No qualifying picks yields null win percentage and never meets targets.
  - Predicted goals and gaps use the existing per-game summary precision before display rounding. Confidence is the engine's returned game confidence. Actual goals and SOG use final boxscore totals; SAT counts distinct shot-attempt play IDs including unknown types and excluding shootout attempts. Final winner includes OT/shootout; actual goals follow the official final score convention.
  - Rank the main candidate list by meeting both targets, then observed win percentage, coverage and stable ID. All candidates remain in that filterable list, including those below either target; target status distinguishes met, not met and pending. Applying an evaluated candidate explicitly copies its persisted model and settings into a chosen or new engine without modifying the source model or API defaults.
  - Evaluated result rows in both tables expose direct engine creation with a name prompt and exact settings preview. Discovery copies only settings to an engine: an existing engine retains its production model, and a new engine uses the selected production model. The clicked candidate stays fixed across polling updates. Creation requires persisted candidate metrics and a run that is active or complete; pending candidates and failed/cancelled runs are rejected. The full discovery need not finish first. Saving never starts another build, changes discovery progress or applies client-supplied prediction settings. Candidate IDs remain scoped to their run and existing super-admin authorization remains required.
  - The engine index separates saved Engines from persisted Discoveries without changing engine or run routes. Run candidate tables use server-owned URL query parameters for sorting, filtering and pagination. Every meaningful displayed candidate metric is sortable; filters may narrow persisted candidate rows by target status, coverage, win rate, offense, defense, confidence bounds, gap, and eligible or excluded counts. Active-run polling preserves the selected candidate query state. Manual candidate stacks and saved engine stacks have no fixed member limit.
  - Deleting an engine with active runs is rejected. Cancel cooperatively first. Completed run evidence survives engine deletion. Rebuild or rediscover creates a fresh run after failure; do not certify a partial run.
public_interface:
  - /admin/nhl-sat-engines
  - /admin/nhl-sat-engines/discover
  - /admin/nhl-sat-engines/runs/{run}
  - NhlSatEngineSettings
  - NhlSatEngineEvaluator
example_usage: |
  Select Sep2026, the first five matching game days, all teams,
  desired win percentage 60 and minimum coverage 40.
  Discovery automatically searches offense/defense weights, score gaps and confidence ranges.
  Inspect candidates, filter by target status, review analysis-only stack recommendations and actual totals,
  then create an engine from one candidate.
