name: NHL SAT Engine Stack Analysis
type: Read-Only Discovery Candidate Combination Analysis
location:
  - app/Services/NhlSatEngineStackAnalyzer.php
  - app/Http/Controllers/Admin/NhlSatEngineController.php
  - resources/js/pages/Admin/SatEngines/Run.vue
purpose: Recommend ordered combinations of persisted discovery candidates that expand coverage through distinct qualification rules while preserving observed win quality.
when_to_use:
  - Inspecting analysis-only stack recommendations from an engine discovery run.
when_not_to_use:
  - Selecting the default engine, creating an engine, or changing ordinary prediction/API behavior.
  - Dispatching or modifying historical evaluation work.
rules:
  - Stack analysis reads only the current run's persisted completed candidates and per-game result rows, constrained by the run page's active candidate filters.
  - An automatic stack has exactly one foundation: the completed candidate with the highest observed win percentage that meets the run's minimum coverage target; win-rate ties use higher offense percentage, then higher coverage, then stable ID. It may be followed by at most four lower-priority supplementary candidates. For each game, the first qualifying candidate in that order supplies the pick; later candidates may only supply a pick when every earlier candidate did not qualify. A manual stack chooses its own foundation by order.
  - Eligible games are the union of completed evidence across stack candidates. Selected games outside that union are excluded. Combined win percentage uses selected stack picks; combined coverage divides those picks by combined eligible games. Stack headers expose the calculated foundation record/win/coverage, the unique added-pick record and count, then the combined stack record/win/coverage. Member rows expose each candidate's unique contributed games after prior precedence alongside its individual candidate metrics.
  - Each automatic supplement must use a confidence-minimum/confidence-maximum/gap combination distinct from every earlier stack member and must add at least one previously uncovered pick. Its unique newly added picks at that priority position must meet the discovery run's desired win percentage. It must not itself qualify every earlier stack pick; that would make it a replacement candidate rather than a contributing stack member. Before the automatic candidate bound, exclude candidates that add no picks beyond the foundation. For each remaining qualification combination, retain the candidate with the highest observed win percentage on its newly added picks, then newly added pick count. Do not choose a high-coverage candidate merely for standalone coverage.
  - A recommendation must improve coverage over its foundation. Rank returned recommendations by combined observed win percentage, then combined coverage, fewer engines, then stable candidate IDs. It is analysis-only: it never queues work, persists a stack, creates or selects an engine, or changes prediction/API behavior.
  - A user may manually compose an ordered stack of up to five completed candidates. The URL preserves that order; candidates may be removed or added from the current candidate table. Manual analysis uses the same first-qualifying-candidate precedence as recommendations.
  - Inspect every filtered completed candidate for foundation-relative contribution, then bound the automatic supplement pool to forty-nine qualifying candidates plus the foundation. Retain a deterministic ten-state beam for the automatic foundation at each depth through five engines. Collapse recommendations with identical final game/pick outcomes before display. When viable, surface three-or-more-engine recommendations before two-engine alternatives, then retain ranking by combined win percentage, coverage, fewer engines and stable candidate IDs.
public_interface:
  - NhlSatEngineStackAnalyzer
  - /admin/nhl-sat-engines/runs/{run}?stack=1
example_usage: |
  Open Stack on a discovery run. A 66% foundation that covers 40% of eligible games can be followed by a distinct confidence/gap rule whose newly added picks have the strongest observed win rate, increasing coverage without allowing standalone coverage to drive selection.
