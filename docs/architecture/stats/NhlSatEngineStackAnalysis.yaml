name: NHL SAT Engine Stack Analysis
type: Read-Only Discovery Candidate Combination Analysis
location:
  - app/Services/NhlSatEngineStackAnalyzer.php
  - app/Http/Controllers/Admin/NhlSatEngineController.php
  - resources/js/pages/Admin/SatEngines/Run.vue
purpose: Surface non-dominated, ordered discovery-candidate stacks across observed win quality and coverage.
when_to_use:
  - Inspecting analysis-only stack recommendations from an engine discovery run.
when_not_to_use:
  - Persisting engines or a saved stack; NhlSatEngineStacks owns that explicit mutation.
  - Selecting the default stack or changing ordinary prediction/API behavior.
  - Dispatching or modifying historical evaluation work.
rules:
  - Stack analysis reads only the current run's persisted completed candidates and per-game result rows, constrained by the run page's active candidate filters.
  - Automatic analysis starts each completed candidate on the standalone observed win/coverage Pareto frontier as a possible foundation. For each foundation, it repeatedly adds the remaining candidate with the best positive record on previously uncovered games, breaking ties by standalone win percentage, added games, offense, defense, then stable ID. It stops only when no positive-record addition remains. For each game, the first qualifying candidate in that order supplies the pick; later candidates only supply a pick when every earlier candidate did not qualify. A manual stack chooses its own foundation by order.
  - Eligible games are the union of completed evidence across stack candidates. Selected games outside that union are excluded. Combined win percentage uses selected stack picks; combined coverage divides those picks by combined eligible games. Stack headers expose the calculated foundation record/win/coverage, the unique added-pick record and count, then the combined stack record/win/coverage. Member rows expose each candidate's unique contributed games after prior precedence alongside its individual candidate metrics.
  - Each automatic supplement must add at least one previously uncovered pick. Equivalent full settings are never added twice; equivalent settings producing different qualifying games are an invariant violation.
  - An automatic result is on the observed win/coverage Pareto frontier only when no other result has both equal-or-higher win percentage and equal-or-higher coverage, with one strictly higher. Results with identical game/pick outcomes collapse to the shorter stack. Display frontier results by win percentage, coverage, fewer engines, then stable IDs. It is analysis-only: it never queues work, persists a stack, creates or selects an engine, or changes prediction/API behavior.
  - A user may manually compose an ordered stack of completed candidates. The URL preserves that order; candidates may be removed or added from the current candidate table. Manual analysis uses the same first-qualifying-candidate precedence as recommendations.
  - For bounded deterministic analysis, begin with every individual candidate on the standalone observed win/coverage Pareto frontier; a candidate beaten by another on both metrics cannot enter automatic analysis. The candidate frontier bounds exploration; stack length is never capped.
public_interface:
  - NhlSatEngineStackAnalyzer
  - /admin/nhl-sat-engines/runs/{run}?stack=1
example_usage: |
  Open Stack on a discovery run. Compare a 85%-win, 35%-coverage stack with a 80%-win, 65%-coverage stack without asking for thresholds first; hide any stack that another stack beats on both metrics.
