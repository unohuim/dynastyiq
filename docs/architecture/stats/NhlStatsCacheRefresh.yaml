name: NHL Public Stats Cache Refresh
type: Committed Season Event And Queued Public Read Model Refresh
location:
  - app/Events/NhlSeasonStatsSynced.php
  - app/Events/NhlStatsSourceUpdated.php
  - app/Console/Commands/RefreshNhlStatsCacheCommand.php
  - app/Support/Stats/StatsPayloadBuilder.php
  - app/Listeners/QueueNhlStatsDashboardRefresh.php
  - app/Jobs/RefreshNhlStatsDashboardJob.php
  - app/Services/SumNhlSeasonStats.php
  - app/Services/NhlStatsDashboardPayload.php
  - app/Services/NhlDashboardPayload.php
  - app/Services/ImportNhlBoxscore.php
  - app/Services/NhlRightRailService.php
  - app/Jobs/ScoreNhlPredictionGameSatJob.php
  - app/Providers/AppServiceProvider.php
purpose: Prepare complete public season dashboards and guest-visible report snapshots after source processing, serving warm snapshots immediately and recovering missing snapshots on demand.
when_to_use:
  - Completing season-summary aggregation from admin, automatic or command-line entrypoints.
  - Completing prediction-season SAT scoring that changes public xGF and GSAx facts.
when_not_to_use:
  - Sharing private perspectives, league ownership or user-specific report data.
  - Caching custom date ranges, private reports, draft contexts or availability and fantasy ownership scopes.
  - Replacing canonical raw facts or changing calculation semantics.
rules:
  - SumNhlSeasonStats emits NhlSeasonStatsSynced independently of optional admin run identity. The event carries the affected season, upsert count and optional originating admin run ID, including zero for an empty successful source selection.
  - Season summary chunks commit atomically in stable player/type order. The event is delivered only after the outermost application transaction commits; rolled-back or failed writes cannot trigger publication.
  - The queued listener and refresh jobs use projections. The listener queues bounded jobs per dashboard view/season and per guest-visible perspective/season/game type, plus a highlights publisher. Each table publisher prepares all supported slices off-request and atomically publishes its complete bundle, keyed by perspective settings and game type. A changed previous season also refreshes the following season when it has positive regular-season summaries, preserving player and team comparisons.
  - Pending season/view jobs coalesce. Publishers serialize per season/view, while a source update during active work may queue a follow-up refresh. Source processing never waits for dashboard calculation. Independent cache publishers allow failures so one failed report cannot cancel unrelated trend or dashboard preparation; the originating sync still reports failure.
  - Refresh computes public facts before replacing the existing cache value. Failed refreshes retain the previous successful value. Complete snapshots remain until replaced or the shared cache is cleared. Teams snapshots with unavailable PP source inputs have a short retry lifetime so provider gaps cannot become permanent cached values. Web and queue processes must share their configured cache store and prefix.
  - NhlStatsSourceUpdated connects committed SAT ratings and imported player histories to the same preparation pathway. Prediction-season scoring emits it only after both rating targets commit. Full unscoped season SAT scoring also emits it. Ratings and source syncs never delete published snapshots.
  - Public dashboard and guest-visible season report HTTP reads reuse prepared snapshots. An absent snapshot is calculated synchronously, published and returned in that same request. The narrowly scoped Teams PP source exception below applies; other views perform no imports or training. A shared cache build lock and second cache check prevent duplicate simultaneous cold builds. Existing cached snapshots remain available while source-triggered jobs refresh them. Missing default-season metadata is repaired from stored source seasons on demand. Private reports, draft contexts, availability scopes and custom date ranges retain their existing authorized pipeline.
  - Teams preparation first fills missing actual PP goals/opportunities for completed scored games in the requested season using the Boxscore importer source parser. The same method runs after season sync and on a Teams cache miss, before aggregation and publication. It fetches only missing inputs, preserves existing non-null totals atomically, and never invokes player boxscore imports or Refs and Staff. A per-season source lock prevents duplicate concurrent filling, with missing work rechecked after acquisition.
  - Missing Teams PP source requests run in bounded parallel groups with request timeouts and a bounded preparation budget. Each successful game's totals persist immediately, so later attempts reuse completed work. Provider failures, malformed pairs and unattempted remainder stay unknown. Other team statistics remain usable in a temporarily cached snapshot and missing sources are retried automatically on a later cache miss or sync; complete snapshots remain retained.
  - Successful Leaders publication also republishes default-season metadata before the publisher completes, independently of the coordinator. The ordinary /stats route must resolve prepared data without visitors supplying a season query parameter; metadata failure fails publication visibly rather than reporting a usable page.
  - Leaders highlights have a retained trend snapshot prepared by the post-sync highlights publisher and on demand when absent. It reads recent games and boxscores and calculates Player Trends and Team Trends directly, without homepage performers, goalie expectations, line combinations, transactions, injuries or editorial requests. The homepage retains its existing fact builder and presentation.
  - Admin season-sync runs remain running until source aggregation and every preparation batch task succeed. Batch identity and preparation status live in the existing run payload; progress includes report counts, and coordinator or publisher failures are visible. Row-locked payload merges preserve concurrent rollup and batch updates. Failed refreshes retain previously published data.
  - The nhl:stats-cache command requires either an explicit season or --all, queues preparation for existing data, including the narrowly scoped Teams PP source exception, and supports deployment preparation. Deployments must restart long-lived workers onto the same release as the web app, share cache store/prefix, and use the command to prewarm current snapshots after a cache schema change. Visitors can also recover missing snapshots through the on-demand build path.
  - Existing stats definitions, scored-model selection, coverage requirements, perspective authorization and response shapes are preserved. Cache preparation performs no model training, player imports, predictions or database migrations; its only provider retrieval is the approved Teams PP source exception.
public_interface:
  - NhlSeasonStatsSynced
  - NhlStatsSourceUpdated
  - nhl:stats-cache --season=20262027 or --all
  - StatsPayloadBuilder::readPreparedSeasonPayload
  - StatsPayloadBuilder::refreshPreparedSeasonPayload
  - QueueNhlStatsDashboardRefresh
  - RefreshNhlStatsDashboardJob
  - NhlStatsDashboardPayload::refreshCachedFacts
  - NhlDashboardPayload::refreshStatsHighlights
example_usage: |
  NhlSeasonStatsSynced::dispatch($seasonId, $rowsUpserted);
  // After commit, projections workers prepare public views and publish complete replacements.
