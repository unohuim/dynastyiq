example_usage: |
  Create a SAT model with train_season_ids ["20232024", "20242025"]
  and test season "20252026", then Eval SAT to store training-season SAT-to-SOG probabilities
  or Eval SOG to store training-season SOG-to-goal probabilities only. After Eval SAT,
  Build Profiles to persist skater, goalie, team, staff offense/defense, and official entity profile rows
  for training seasons and, when present, the held-out test season in a separate table. Then Build TOI
  to persist skater opportunity assumptions for the same SAT model without reading the held-out test season.
  Build /60 and Compare /60 currently operate only on skater-offense entities, and aggregate compare rows
  carry summary-derived train/test SAT, HDSAT, SOG, goals, TOI/GP, and GP/season fields for signal analysis.
