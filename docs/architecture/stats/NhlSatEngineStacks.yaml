name: NHL SAT Engine Stacks
type: Persistent Saved Engine Collection And Historical Discovery Container
location:
  - app/Models/NhlSatEngineStack.php
  - app/Models/NhlSatEngineStackMember.php
  - app/Services/NhlSatEngineStackCreator.php
  - app/Http/Controllers/Admin/NhlSatEngineController.php
  - resources/js/pages/Admin/SatEngines/Index.vue
  - resources/js/pages/Admin/SatEngines/Run.vue
purpose: Preserve saved engine/stack organization and historical records while new predictions use the single default pregame engine.
when_to_use:
  - Managing reviewed engine collections and their historical discovery provenance.
  - Opening existing member or stack prediction previews.
when_not_to_use:
  - Choosing a different game calculation from saved legacy percentages or confidence bounds.
  - Copying an old engine's measured record or presentation confidence onto the new algorithm.
rules:
  - Current calculation is governed by NhlCustomGamePrediction.yaml. Ordinary API/manual predictions use that default directly and require no saved stack. Stack/member previews use the same calculator with an explicitly selected production-model override when supplied. Empty stack containers do not block prediction.
  - Legacy member weights, confidence ranges, percentage-gap tolerances, priority delegation and presentation boosts/penalties no longer modify newly calculated scores, probabilities, confidence or prediction availability. Saved definitions and completed records remain unchanged historical evidence.
  - Stack-level and member admin endpoints retain existing authorization, membership validation and date scope. Changing a preview's model never changes the application's default model or rewrites a saved engine. Current previews expose nullable confidence rather than inventing a calibrated score.
  - Stack membership remains ordered, distinct and contiguous when created; reordering includes every current member exactly once. Removing membership or deleting a stack does not delete its engines. Engines with memberships cannot be deleted.
  - Stack creation from reviewed candidates retains frozen candidate provenance and does not start evaluation. At most one saved nonempty stack retains the legacy default designation for configuration compatibility; that designation does not select the live calculator.
  - Earlier frozen engine records retain their original methods and outcome labels. New algorithm provenance must remain explicit and must not inherit those historical win percentages or confidence qualifications. Redesigning automatic context-based discovery is separate work.
public_interface:
  - GET /admin/nhl-sat-engines/stacks/{stack}
  - POST /admin/nhl-sat-engines/stacks/{stack}/predictions/{game}
  - POST /admin/nhl-sat-engines/stacks/{stack}/members/{member}/predictions/{game}
  - NhlGamePredictionPayload::previewStack
  - NhlGamePredictionPayload::previewEngine
  - NhlSatEngineStackCreator
example_usage: |
  Open a saved stack and request a game preview.
  Its selected production model may override the model for that preview;
  every score is calculated by the shared pregame engine.
