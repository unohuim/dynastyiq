name: NHL SAT Engine Stacks
type: Persistent Ordered Saved Engine Collection
location:
  - app/Models/NhlSatEngineStack.php
  - app/Models/NhlSatEngineStackMember.php
  - app/Services/NhlSatEngineStackCreator.php
  - app/Http/Controllers/Admin/NhlSatEngineController.php
  - resources/js/pages/Admin/SatEngines/Index.vue
  - resources/js/pages/Admin/SatEngines/Run.vue
purpose: Persist reviewed discovery recommendations as independently usable engines in an explicit precedence order and select the one stack used for ordinary predictions.
when_to_use:
  - Saving a reviewed manual or automatic discovery recommendation.
  - Managing the name, membership, or priority of a saved engine stack.
when_not_to_use:
  - Calculating discovery recommendations; NhlSatEngineStackAnalysis owns that read-only work.
  - Deleting or mutating an engine merely because its stack membership changes.
rules:
  - Saved Engine runtime qualification allows one percentage point above the configured maximum confidence, capped at 100. The minimum confidence and strict gap remain unchanged. Do not rewrite Engine definitions or frozen discovery records. The no-Engine legacy range is unchanged. Predict today displays the defined range without adding the tolerance to the displayed maximum, explains the tolerance separately, and captures it in private snapshots; older snapshots retain their original bounds.
  - Ordinary qualification and forecasting both use the stack Production Model override or the Engine Production Model, applying the unchanged Engine confidence bounds and unrounded gap rule. The Test Model is not evaluated or required on the live stack path. inputs.qualification_model_run_id records the effective forecast model. Predict today applies this rule to its Production row; Test/Train independently evaluates its model and qualification for comparison only. Model winner disagreement does not reject Production. No date-based or spread-only forced-pick exception exists.
  - Predict today displays Production rows only, in one accordion per Engine. The member action creates or replaces that Engine's independent diagnostic accordion. The stack action evaluates each game through the same delegation method as ordinary predictions, using the viewed stack rather than selecting the default. Stop evaluating members at the first qualified pick. Every accordion still lists every game; evaluated engines show their actual attempts, while later engines show only the picking Engine's name with no fabricated prediction values. Both actions resolve the saved stack Production Model before the Engine model. Diagnostic skater and goalie confidence are two-team averages from raw simulation inputs before internal weighting and presentation conversion; these fields are admin-only.
  - Stack-level admin requests validate today's America/Toronto game date and reject an empty stack. They bypass the partner response cache without changing the default stack. Games run sequentially, one stack request per game, without queue dispatch. Capture compact admin-only attempt diagnostics during the ordinary traversal; never rerun an engine to populate the display. Earlier declined attempts receive no whole-stack presentation penalty when a later Engine picks. If all engines decline, retain the ordinary foundation fallback and apply the presentation penalty once, including once to each available diagnostic attempt. The UI shows each Engine's own result, not copies of the fallback. Failures and unavailable predictions must not be represented as false picks. Raw internal confidence is separate from presentation confidence; partner responses never include attempt diagnostics.
  - Stack detail offers Predict today per member. Admin-only requests validate membership and today's America/Toronto game date, evaluate that Engine alone through NhlGamePredictionPayload with the saved stack production-model override, and never change defaults. The UI requests one game at a time without queue dispatch and shows away/home scores, absolute spread, internal and presentation confidence, and pick qualification. Unavailable or failed predictions are not represented as false picks. These diagnostic responses bypass the partner response cache; internal confidence remains admin-only. Normal source-resolution behavior, including official starter locks or preseason lineup imports, is unchanged.
  - A newly saved stack contains one or more distinct saved engines with contiguous one-based priority; lower priority numbers take precedence. Later membership removal may leave a stack empty. Stack length has no fixed cap.
  - Saving a recommendation validates every ordered candidate against its source run, creates one saved engine for each candidate, and records discovery provenance without starting evaluation or changing the default stack.
  - Created engine names derive from the approved stack name and their Foundation or Supplement priority; saved stack names remain independently editable. Stack members display each Engine's frozen candidate test record, win and coverage metrics, never an Engine-default state. When all members retain completed candidate provenance from one run, detail also displays each member's unique contribution and cumulative stack impact in priority order; mixed or manually created memberships display unavailable impact rather than inferred values.
  - Adding an existing engine appends it at the final priority. Reordering must include every current member exactly once.
  - Removing a member and deleting a stack remove memberships only. Engines survive and may be reused elsewhere.
  - An engine with stack memberships cannot be deleted until those memberships are removed.
  - At most one non-empty stack is default. A default stack may not lose its final member. For an ordinary prediction, members may be evaluated in priority order, but only the first Engine whose internal confidence bounds and score-gap rule qualify the game is selected to make a stack prediction. No second Engine prediction may be returned for that game. If none qualifies, inputs.engine_id is null and pick_qualified is false even when the broader matchup payload is available. A missing default stack uses the documented legacy fallback.
  - A stack may select one completed SAT Production Model. When present, that model supplies every member's qualification and forecast at ordinary prediction time, ahead of the member Engine's own saved Production Model. It is a runtime override scoped to that stack: it never rewrites an Engine definition and an Engine may therefore retain a different model in another stack or outside a stack.
  - Partner-facing prediction and market confidence is presentation confidence, calculated only after internal qualification as `min(95, max(70, blend(internal + 5, observed_win_pct, coverage^(1/5)) + 7))`, with frozen discovery percentages normalized to 0–1. Missing frozen metrics use internal confidence plus five and the seven-point presentation lift within the same 70–95 range. A normal unqualified response subtracts 20 percentage points from presentation confidence, floored at zero. Internal confidence is never changed or exposed as the partner confidence score.
public_interface:
  - GET /admin/nhl-sat-engines/stacks/{stack}/predictions/today
  - POST /admin/nhl-sat-engines/stacks/{stack}/predictions/{game}
  - NhlGamePredictionPayload::previewStack
  - GET /admin/nhl-sat-engines/stacks/{stack}/members/{member}/predictions/today
  - POST /admin/nhl-sat-engines/stacks/{stack}/members/{member}/predictions/{game}
  - GET /admin/nhl-sat-engines/stacks/{stack}
  - POST /admin/nhl-sat-engines/runs/{run}/stacks
  - PATCH /admin/nhl-sat-engines/stacks/{stack}
  - POST /admin/nhl-sat-engines/stacks/{stack}/members
  - PUT /admin/nhl-sat-engines/stacks/{stack}/members/order
  - DELETE /admin/nhl-sat-engines/stacks/{stack}/members/{member}
  - DELETE /admin/nhl-sat-engines/stacks/{stack}
  - POST /admin/nhl-sat-engines/stacks/{stack}/default
  - NhlSatEngineStackCreator
example_usage: |
  Save a three-engine recommendation named "High-confidence coverage". The service creates
  "High-confidence coverage — Foundation" followed by two Supplement engines, then records
  their one, two, and three priorities in the saved stack.
