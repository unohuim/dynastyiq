name: NHL Statistics Leaders Dashboard
type: Public Statistics Read Model
location:
  - app/Services/NhlStatsDashboardPayload.php
  - app/Http/Controllers/StatsController.php
  - resources/js/pages/Stats/Index.vue
  - resources/js/pages/Stats/LeaderList.vue
  - resources/js/pages/Stats/LeaderCardRow.vue
  - resources/js/pages/Stats/Table.vue
  - resources/js/pages/Stats/LoadingState.vue
  - resources/js/pages/Stats/CategoryNav.vue
  - docs/designs/stats-leaders-design.png
  - docs/designs/teams-by-goals-section.png
purpose: Present factual season leaders and completed-night comparisons without replacing the existing perspective-driven stats pipeline.
when_to_use:
  - Rendering the public /stats landing and its category views.
  - Ranking stored NHL season statistics and team results for the Leaders dashboard.
when_not_to_use:
  - Calculating game predictions or importing statistics beyond the approved Teams PP source exception in NhlStatsCacheRefresh.yaml.
  - Replacing partner stats APIs, perspective permissions or private fantasy scopes.
rules:
  - The Teams view prepares season-scoped per-game team facts once and serves date/game-type selections from that retained snapshot. Historical game team identity is used instead of current player rosters. Raw game facts remain server-side. It does not invoke unused player leader or expected-goals calculation paths.
  - Teams PTS means regular-season standings points, distinct from summed player scoring points used by existing Leaders panels. W% is wins divided by games. Teams GAA is goals allowed per actual game elapsed sixty minutes, excluding the shootout deciding goal. OT time requires a terminal PBP clock; absent timing stays unavailable.
  - Team PP% and PK% pool actual PP goals and opportunities from imported right-rail game totals, never inferred penalty counts or averaged per-game percentages. Zero denominators and incomplete selected-game metric coverage remain unavailable. Team Corsi% uses EV attempts excluding empty nets and shootouts; SAT and HDSAT come from shooter game summaries.
  - The default /stats view is Leaders. Explicit Skaters and Goalies views retain the existing stats renderer, filters, permissions, perspective-driven payload and API. Existing explicit perspective links open their table view. Teams shows sortable actual team-season statistics. Category changes use Inertia navigation and preserve the existing stats.index route. Browser URLs retain the active view when table filters change.
  - Initial page requests resolve only page configuration and selected season. Leader facts and Skaters/Goalies initialPayload use separate rescued Inertia deferred groups, so either can render without waiting for the other. Leaders and Teams do not build the unused player table. Immediate navigation skeletons, independent loading placeholders and retryable errors belong to the page, not shared global state. Completed payloads preserve their existing shape and perspective authorization.
  - View values are documented in docs/ENUMS.md. Invalid explicit view values are rejected through normal request validation.
  - The UI references in docs/UI_DESIGN.md govern this surface. The homepage is unchanged. Replace the reference Top Performers area with the two team-goals panels; do not add a Top Performers panel to /stats.
  - Category navigation includes Prospects, linking to the existing Skaters table with perspective=prospects and the selected season. That perspective marks the Prospects tab active without adding a new backend view. Skaters, Goalies and Prospects retain the full existing mobile player lists and controls. Teams uses all existing sorted team rows in a compact mobile list with local sort controls; its desktop table remains unchanged. Horizontal metric cards render only on Leaders.
  - Mobile Leaders consumes four prepared mobile_leaders rows headed All Skaters, All Goalies, All Teams and All Prospects. Each metric selects its own highest available entity, with stable tie breaking. Missing values remain unavailable and do not become zero. Desktop panels retain their existing data and presentation.
  - Mobile Skaters cards are G, A, PPP, SOG, Blocks and Hits. Goalies cards are W, EVSV%, QS, GSAx, SVs and QS%; quality-start count and percentage rank independently, and existing positive-GP and scoring-coverage rules apply without added workload thresholds.
  - Mobile Teams cards are W%, G, Corsi%, GAx and GSAx. Win percentage uses completed team results. Corsi percentage uses matching EV attempt-for and attempt-against totals. GAx is actual eligible goals scored minus xGF; GSAx is xGA minus actual eligible goals allowed. Expectations use the same scored goal model and target semantics as the existing advanced stats, exclude empty nets and shootouts from both actual and expected counts, retain historical game-team identity, require every counted team game and attempt covered, and require goalie identity for every GSAx attempt. Incomplete expectations stay unavailable. Never sum player on-ice xGF to calculate team expectations.
  - Mobile Prospects cards are G, A, PTS, G/GP and PTS/GP from the existing non-NHL Prospects report population in stats, with is_prospect true, regular-season rows, the selected season and skaters only. Keep each player/league grouping separate and derive rates from summed counts divided by summed GP. NHL rookie eligibility does not define this row. All Prospects links to the existing prospects perspective.
  - Mobile card rows are compact additions to the shared public season cache and are refreshed through NhlStatsCacheRefresh.yaml. The cache schema version changes when introducing these rows so previously retained payloads cannot hide the new fields. Card rendering formats stored values only; it does not calculate hockey metrics.
  - Read regular-season nhl_season_stats with positive games played and canonical player identities. Default to the newest stored season with positive games; an explicit season selects that season. Distinguish skaters and goalies, and never invent missing rows or rates.
  - The hero is the points leader. The Category Leaders grid displays goals, assists, power-play points (PPP), SOG, hits and blocks, in that order. The season strip retains points, goals, assists, SOG, points per game and hits. Rank each metric independently, with points and NHL identity breaking ties. Hero ranks count strictly better values and therefore preserve tied ranks.
  - The Goalies view has its own three category cards, ranked independently by season Quality Starts, GSAx and EVSV%. Rank only goalies with a non-null metric, breaking ties by games played and NHL identity. EVSV% uses EV saves divided by EV shots faced. GSAx uses the same season goal model as xGF and equals scored goalie-facing xGA minus actual season goals allowed; require every faced attempt scored, every counted game covered and the fact goal total equal to season GA. Exclude empty nets and shootouts. Incomplete GSAx is unavailable, never zero-filled or estimated.
  - The Goalies hero follows the Quality Starts card's leader, using that goalie's actual image, identity, team and latest stored sweater number. Show QS%, GSAx, EVSV% and Saves with goalie-only tied ranks; QS% is quality starts divided by starts, and missing or zero starts have no rate or rank. Saves is the stored total. Hero selection remains based on Quality Starts count. If no goalie is eligible, show the empty hero state rather than a skater fallback. Other views retain the points-leader hero.
  - Compute rates from totals and their matching denominators. Goalie GAA is GA times 3600 divided by TOI seconds; save percentage is saves divided by shots faced. Missing or zero denominators remain unavailable. Positive GP is the only workload eligibility threshold; no unapproved additional minimum is imposed.
  - Compare category production per game with the same player's previous-season production per game. Missing or zero previous rates have no percentage comparison. Miniature histories use the actual last five imported boxscore appearances for that metric; never draw fabricated trend bars.
  - Team GF, GA, GP and wins use each team's own completed game results, once per game, separately from opponent totals and player sums. Goal-rate differences compare against the previous season. Team points, assists, SOG, hits and PP goals use actual team-game boxscore aggregates and remain unavailable until every counted team game has boxscore coverage. Player trades cannot transfer historical team production through current-roster sums.
  - Advanced Corsi uses stored EV on-ice summaries. xGF and GSAx select the most recently trained goal model that actually has non-null scored goal expectations for completed regular-season games in the displayed season. Its training season may differ, and its status need not be draft. Prefer nhl_shot_attempt_model_scores for each model/attempt, with legacy nhl_shot_attempt_predictions used only when no current score row exists. Preserve target semantics when aggregating; SOG-trained goal expectations count actual SOG, matching existing Train/Test profiles, while SAT-trained expectations count eligible SAT. Do not select an unscored model simply because its training season matches. Deduplicate player-attempt links, exclude shootouts and empty nets, and withhold incomplete scoring coverage; never score or backfill attempts during a page read. Missing GSAx exposes a factual reason distinguishing absent scored season data, absent goalie attempts, incomplete attempt scores, appearance coverage and goal-total mismatches.
  - Rookie Leaders uses ProspectEligibilityService with for_drafting false, evaluated in bulk for the season skater candidates. This is the simplified DynastyIQ definition, not Calder Trophy eligibility. The service owns draft evidence, age, career NHL GP and evaluation-window requirements; do not copy those rules into the dashboard or infer eligibility from players.is_prospect. Rank eligible skaters by their displayed season totals using the existing points, goals, assists and SOG tabs. An empty eligible set has an explicit empty state.
  - Smash Potatoes replaces the old Last Night's Top Lines panel on Leaders. It reuses LeaderList with season skater SOG, hits, blocks and PIM totals, displaying Player, GP and the selected metric with independent ranking tabs. Append the stored position after each player name, separated by a comma; omit the suffix when the position is unavailable. It does not use last-night line combinations or restrict candidates to a particular game day. Reuse existing player comparisons through statsHighlights without requesting editorial feeds.
  - Shared public leader facts are keyed by season and view. Source-triggered refresh and retained publication follow NhlStatsCacheRefresh.yaml; cold-cache visits calculate and retain the missing data while displaying the approved loading message. Skaters skips goalie xG, advanced on-ice/xGF, team totals and unused highlight work. Goalies skips advanced skater on-ice/xGF and team totals. Table-view leader payloads omit duplicate player lists, which arrive in the prepared initialPayload. Do not cache private perspectives, league ownership or user-specific payloads in that cache. Cold reads may write prepared cache entries and fill missing Teams PP inputs through the exception defined in NhlStatsCacheRefresh.yaml; they never import player facts, train models, dispatch predictions or create database tables.
public_interface:
  - GET /stats named stats.index
  - Existing /api/stats payload contract
  - NhlStatsDashboardPayload::advancedPlayerExpectations
  - NhlStatsDashboardPayload::build
  - NhlDashboardPayload::statsHighlights
  - Stats/Index and Stats/Table Inertia components
example_usage: |
  return Inertia::render('Stats/Index', [
      ...$existingPerspectiveProps,
      'view' => 'leaders',
      'leaders' => app(NhlStatsDashboardPayload::class)->build(),
  ]);
