example_usage: |
  Agreed Rule 1 (not yet implemented): CHI lineup LSeason = 195.37 SAT/60;
  exploratory league LSeason reference = 220.21 SAT/60.
  Opening-three-game prediction = (195.37 + 220.21) / 2 = 207.79 SAT/60.
  The same rule uses the updated lineup for that team's second and third games.

  Rule 2 evidence: B2B plus the third game in seven days averaged 207.9 lineup
  SAT/60 across 66 observations, versus 207.7 without B2B at the same game count.
  B2B plus the fourth game averaged 201.1 across 327 observations, versus 203.8
  without B2B at the same count. The two B2B groups had similar historical
  lineup expectations. These are observed totals, not adjustment coefficients.
  A fourth-game B2B belongs only to the combined group; a third-game B2B is
  excluded from the standalone B2B group and receives no B2B-specific adjustment.

  Rule 3 evidence: on 41,242 matched player-game observations after five prior
  team games, normalized TOI Share mean absolute percentage errors were L5
  12.22%, L10 11.97%, L20 12.03%, equal L5/L10 shares 11.88%, and the equal
  LSeason/L20 minutes blend 12.48%. The recent share blend had 53.51% of player
  observations below 10% error and 83.11% below 20%. The ordering persisted
  across both season halves, but this was exploratory, not untouched validation.
  In the separately examined opening five games, the LSeason/L20 minutes blend
  had 12.63% TOI Share error versus 12.86% for L20, 13.03% for L10 and about 13.4%
  for L5. These matched-coverage figures are not raw display-cohort errors.

  Rule 4 evidence: full-quarter L20 SAT/60 errors were 15.71%, 15.77%, 15.87%
  and 16.28% for Q1-Q4; the equal LSeason/L20 blend had 15.67%, 15.44%, 15.55%
  and 16.04%. During games 6-20, removing prior-season appearances from L20
  worsened SAT/60 error from 15.62% to 16.11%, while matched TOI Share error
  improved slightly from 12.63% to 12.48%. Keep the two metrics' window choices
  distinct and preserve Rule 1 until a replacement is explicitly agreed.

  Rule 5 evidence, using L20 after five prior team games: team xGF/60 mean absolute
  relative error was 22.14%, with 28.21%/53.33% of team-game observations below
  10%/20%; team xGA/60 was 22.35%, with 29.06%/51.58%. Shooter xGF/60 was 96.09%,
  with 6.47%/12.73% of 43,949 valid player-game comparisons below 10%/20%.
  On-ice xGA/60 was 43.15%, with 14.96%/29.64% of 27,430 comparisons below those
  thresholds. These are separate coverage summaries, not matched-method rankings.
  Errors use the estimate as denominator and strictly below thresholds. About
  32.4% of all target player appearances had zero retained shooter xGF; small
  estimates make percentage errors volatile. Also track absolute rate error:
  0.445 xGF/60 for shooters and 1.064 on-ice xGA/60 for the L20 comparisons.

  Fourth-game B2Bs (327 team observations) averaged 2.504 xGF/60 and 2.694 xGA/60,
  versus 2.584 and 2.586 in 1,118 fourth games without B2B. Their L20 expectations
  were nearly identical. The xGF difference disappeared in the second half;
  the adverse team xGA direction appeared in both halves. This supports tracking
  the combined context, not treating these differences as calibrated deductions.
  Home averaged 2.638 xGF/60 and 2.545 xGA/60; away averaged 2.542 and 2.637.
  Road sequences of 10+ days averaged 2.433 xGF/60 and 2.781 xGA/60, versus
  2.590 and 2.607 in days 1-2; the long-road sample contained only 50 observations.

  Rule 7 evidence: 2022-23 through 2024-25 Train, compared with all 32 teams in
  2025-26 Test. Train-derived QuarterFactors were 1.1042789886, 0.9781537917,
  0.9685621002 and 0.9532086949 for Q1-Q4. These correspond to +10.43%, -2.18%,
  -3.14% and -4.68% relative to the full-season baseline. The mean team Base
  was 3.575 penalties/game versus 3.558 Actual, with 0.49% overall err% and
  78.13%/96.88% of teams below 10%/20% error. Adjusted quarter mean predictions
  were 3.948, 3.497, 3.463 and 3.408, versus 3.641, 3.577, 3.461 and 3.554 Actual.
  Quarter err% was 8.45%, 2.22%, 0.06% and 4.11%; team p10/p20 was respectively
  31.25%/81.25%, 50.00%/84.38%, 53.13%/90.63% and 62.50%/84.38%.
  The research used attributed skater penalties from stored play-by-play and
  positive-TOI skater appearances, and explicitly combined Arizona/Utah history.
  Stored 2022-23 player summaries covered 1,122 of 1,312 games; preserve that
  coverage limitation when reproducing this exploratory evidence.

  Open SAT Models > Analysis > Game Evaluations. Name an evaluation and select a
  model with completed projections and pregame context. Open it to follow preparation until Ready,
  then inspect saved quarter and season estimates by metric and strength.
  Open Games, choose a date, strength and quarter reference, then Predict game.
  After all predictions are saved, automatic comparison adds measured rates and errors without changing the forecast.
  After deploying the reliable-bucket correction, restart long-running queue workers.
  Open an older forecast to refresh just that game, or select an inclusive end date
  and press Simulate to refresh stale saved games and process remaining games sequentially.
  This uses the projections queue; no new evaluation, Build Pregame, model rebuild,
  or database migration is needed. Saved Proj values remain unchanged.
  Historical evaluations retain their existing View results links.
