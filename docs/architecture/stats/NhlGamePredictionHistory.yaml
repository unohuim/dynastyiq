name: Operational NHL Game Prediction History
type: Durable Prediction Revisions And Operational Activity
location:
  - database/migrations/2026_10_22_000001_create_nhl_game_prediction_history_tables.php
  - app/Services/NhlGamePredictionHistory.php
  - app/Services/NhlGamePredictionResponseCache.php
  - app/Models/NhlGame.php
  - app/Http/Controllers/Admin/NhlGamePredictionController.php
  - app/Jobs/RunNhlGamePredictionJob.php
  - resources/js/pages/Admin/GamePredictions.vue
  - app/Events/NhlGamePredictionStatusUpdated.php
  - database/migrations/2026_11_25_000003_add_activity_tracking_to_nhl_game_prediction_runs.php
purpose: Preserve every published game calculation and track every operational trigger while super admins request the shared default engine for schedule dates.
when_to_use:
  - Publishing API and manual admin forecasts with immutable source and algorithm evidence.
  - Viewing the latest successful canonical result and prior revisions.
when_not_to_use:
  - Updating earlier prediction payloads or merging old engine records into a new measured record.
  - Treating current lineup evidence on a past date as a historical point-in-time backtest.
rules:
  - All partner API requests first read the latest successful revision for the requested game by descending revision ID, independent of request overrides and current cache fingerprints. Preserve the stored payload and horizon without recalculation; apply the existing partner public-confidence presentation and requested-market response pricing under NhlGamePredictionResponseCache.yaml. Pricing requested lines does not publish a revision or change its timestamp, source evidence, scores or existing moneyline probabilities. Later failed or unavailable attempts do not obscure a success. Healthy saved reads return the original meta.predicted_at and revision ID without starting prediction work. Upcoming lineup/injury conflicts retain HTTP 200 with refresh_pending, current lineups and frozen prediction_lineups; request replacement after responding under imports/NhlPlayerAvailability.yaml. No success on a past date returns unavailable without work; today/future requests without a success retain preparation. Explicit manual calculations remain separate.
  - Newly saved anticipated_lineups are the compact calculated participant/starter snapshot. When an earlier revision's presentation roster/starter differs from its own calculated identities, read-side serialization reconstructs that presentation only from the same immutable revision, without writing it or consulting a current lineup. Scores, probabilities, confidence and calculation timestamps remain unchanged.
  - Each real calculation appends a revision before response-cache publication. Cache hits retain its identity. Operational manual run/game retries reuse an already committed revision.
  - Each new revision stores days_away as the signed calendar game-date horizon plus nonnegative age of the actual reused context date in America/Toronto for today/future forecasts. Fresh context today is zero; using yesterday's context today is one, and a game two days ahead using context one day old is three. Historical signed horizons remain unchanged; legacy payloads without a source date retain calendar-only values. Cache hits and later history reads retain the original stored value. Earlier rows remain null without a historical backfill. Store public_confidence_score separately using the shared payload calculation with winner probability on the percentage scale P, internal confidence I and horizon D. The approved rating is 50 plus 1.1 times P minus 50, plus 0.2 times I minus 55, minus two times nonnegative D; round only the final score to two decimals. Apply no artificial ceiling or floor. Past-date requests receive no timing bonus. Missing required evidence remains null; internal confidence and win probability keep their independent meanings. Include both fields in successful prediction payloads and compact summaries, preserving unavailable prediction envelopes.
  - New completed revisions freeze the fully prepared Matchup snapshot in the existing payload JSON, including both teams' numeric season and L5 xGF/xGA. Calculation completion waits for that dependency. Cache/history reads do not replace the snapshot with current public-page data or modify earlier revisions. Expected-goal preparation remains descriptive and never changes goals, probabilities, confidence or qualification.
  - Revision evidence records the actual algorithm definition, selected model/Train, lineup/starter provenance and exact custom input/fit metadata. Archive the private input envelope in evidence and remove it from public payloads. Never attribute new outcomes to a legacy stack or reuse its prior win record.
  - New successful publications freeze the shared public-page curated player analysis in evidence.player_pregame_analysis and its public player_pregame projection in payload. Only matching model/game/team/opponent/parent/cutoff committed context and the calculated roster qualify. Preserve publication-time identities, actual Train season IDs, source cutoff, personal L10 comparisons and selected descriptive player insights. Bind response revision ID/timestamp to the enclosing revision without rewriting it. Player details never alter scoring or block an otherwise valid prediction when context is absent. Legacy reads use only their own archived projections/history, with unknown personal fields and empty insights rather than current context substitution. No additional table or migration is required.
  - Existing payload, evidence and summary JSON columns support the default-engine transition without a migration. The legacy requested-stack run field now freezes the requested algorithm/model definition. Earlier rows and their original evidence retain their historical meaning.
  - Manual and approved automatic admission share NhlGamePredictionHistory::queueRun, normal durable work items and the default engine. Trigger policy and automatic scope are owned by application/ScheduledProcessManager.yaml. Queue publication happens after commit; settings edits do not calculate predictions.
  - Manual admission validates the existing inclusive date/range rules and known default model, then includes every stored scheduled game type/state in scope. A saved default stack is not required. One game work item runs on projections through the same payload/cache boundary as the API.
  - API, lineup and injury prediction refreshes use projections through the same durable per-game worker as manual and automatic runs; lineup acquisition remains on lineups. Missing model-owned pregame dependencies queue on projections through the shared forecast boundary. No schedule imports, season syncs or migrations are started as a prediction side effect. Pending manual work returns to queued and does not archive placeholders; successful continuation records a real revision through the existing idempotent boundary.
  - Reject manual/partner and automated lineup or pregame starter writes for a game while its manual prediction item is queued/running or API prediction activity is pending. Return HTTP 409 with the actionable in-progress message before accepting observations or promoting current evidence; other games remain editable. Targeted lineup refresh admission obeys the same rule. Official started-game starter locks and live NHL presentation retain their existing authority.
  - Prediction admission and lineup/goalie persistence serialize on the same short nhl_games row lock. Admin admission locks its games in stable identity order before inserting queued work. API and background attempts are admitted into the existing run/game tables before expensive preparation. API cache-only reads are not new calculation attempts. Worker ownership and recovery are fenced per game and generation; releases cannot clear another owner’s protection. Short synchronous cache leases remain compatible while durable items protect queued and running work. Preserve refresh admission across preparing releases and clear it on success or terminal failure. Recover abandoned tracked deliveries from saved checkpoints without waiting for the shared Redis retry_after. Clear terminal ownership so lineups become editable. No database row lock is held throughout prediction calculation or provider requests.
  - Preserve existing latest-successful canonical selection, explicit request-variant ownership, full-game market-only canonical requests, status transitions, retry idempotency and parent-run reconciliation. Failed or unavailable later work never deletes an earlier success.
  - All operational endpoints keep their existing authenticated super-admin and lifecycle middleware. Date navigation and read endpoints do not calculate predictions.
  - Every admin/API/lineup/injury/automatic calculation exposes durable trigger, phase, cursor, sample total where available, first start, heartbeat, deliveries, exceptions and recovery count. Background admission is lightweight, deduplicated by game/request and committed before dispatch. Distinct request variants remain distinct and serialize only for their own game. No unrelated game's preparation or failure is a dependency.
  - Claims use the same short game-row admission lock as lineup writes, followed by parent run and work item locks in a consistent order. Persist a delivery generation and expiring ownership token. Obsolete deliveries cannot publish, terminate or overwrite progress for a replacement. Verify ownership while locking the work item at revision publication. Successful retries reuse a committed revision.
  - A minute scheduler revisits abandoned work after five minutes without a heartbeat, fences the old generation, and dispatches a replacement on projections while preserving the prepared checkpoint and original start time. Recovery admission is idempotent under locks. After three abandoned recoveries expose a terminal actionable failure rather than holding lineup admission indefinitely. Timeout failure hooks immediately record terminal status; this change does not increase the shared Redis retry_after or restart workers.
  - Admin game rows show the latest attempt across all triggers independently of the selected historical parent run. Show its admission time separately from the immutable last successful prediction timestamp. Keep older successful scores visible during replacements and later failures; never relabel an old revision as newly predicted. Derived engine_time_seconds measures wall time from this latest item's admission through its finish, including queue, preparation and retries; absent or unrecorded terminal timing stays unavailable.
  - In the admin display, Queued labels both an existing game awaiting its first prediction and an admitted job waiting for a worker. Running work shows its current stage. Show Saved with a timestamp only when a saved revision timestamp exists; never render Saved followed by an unavailable marker. This presentation label does not enqueue work or alter stored lifecycle states.
  - Reverb sends identifiers only on the authorized private admin.predictions channel. The component coalesces invalidations into compact reads, retains quiet polling, unregisters its listener on unmount and keeps existing table rows mounted. Background refresh failures do not insert a banner or erase available results. No page-global state or import-stream event is introduced.
  - Admin game rows label stored internal confidence as Internal Conf, replace the former Qualified column with Public Conf, and add Days Away from the selected revision. Display both confidences and the frozen horizon in revision history, showing unavailable markers for missing historical fields and preserving zero-day horizons. Partner serialization follows NhlGamePredictionResponseCache.yaml; stored and admin confidence semantics remain internal.
  - Current summaries expose the actual new algorithm version, scores, winner and winning probability. Confidence remains distinct and nullable under the current engine contract.
public_interface:
  - GET /admin/game-predictions
  - POST /admin/game-predictions/runs
  - GET /admin/game-predictions/games/{game}/revisions
  - GET /admin/game-predictions/revisions/{revision}
  - NhlGamePredictionHistory
  - NhlGame::lockForLineupChange
  - NhlGame::predictionActivity
example_usage: |
  An admin requests a date without selecting a legacy stack.
  Each scheduled game gets a work item using the shared pregame engine.
  Recalculations append revisions while prior predictions remain unchanged.
