name: Operational NHL Game Prediction History
type: Durable Prediction Revisions And Manual Runs
location:
  - database/migrations/2026_10_22_000001_create_nhl_game_prediction_history_tables.php
  - app/Services/NhlGamePredictionHistory.php
  - app/Services/NhlGamePredictionResponseCache.php
  - app/Models/NhlGame.php
  - app/Http/Controllers/Admin/NhlGamePredictionController.php
  - app/Jobs/RunNhlGamePredictionJob.php
  - resources/js/pages/Admin/GamePredictions.vue
purpose: Preserve every published game calculation and let super admins request the shared default engine for schedule dates.
when_to_use:
  - Publishing API and manual admin forecasts with immutable source and algorithm evidence.
  - Viewing the latest successful canonical result and prior revisions.
when_not_to_use:
  - Updating earlier prediction payloads or merging old engine records into a new measured record.
  - Treating current lineup evidence on a past date as a historical point-in-time backtest.
rules:
  - Past-date partner API requests read the latest successful revision for the requested game by descending revision ID, independent of request overrides and current cache fingerprints. Preserve the saved payload and horizon without recalculation; apply the existing partner public-confidence presentation only. Later failed or unavailable attempts do not obscure a success. No success returns unavailable without creating work. Explicit manual historical runs remain separate.
  - Each real calculation appends a revision before response-cache publication. Cache hits retain its identity. Operational manual run/game retries reuse an already committed revision.
  - Each new revision stores signed calendar days_away as game date minus publication date in America/Toronto. Today is zero; prior dates may be negative. Cache hits and later history reads retain the original stored value. Earlier rows remain null without a historical backfill. Store public_confidence_score separately using the shared payload calculation with winner probability on the percentage scale P, internal confidence I and horizon D. The approved rating is 50 plus 1.1 times P minus 50, plus 0.2 times I minus 55, minus two times nonnegative D; round only the final score to two decimals. Apply no artificial ceiling or floor. Past-date requests receive no timing bonus. Missing required evidence remains null; internal confidence and win probability keep their independent meanings. Include both fields in successful prediction payloads and compact summaries, preserving unavailable prediction envelopes.
  - New completed revisions freeze the fully prepared Matchup snapshot in the existing payload JSON, including both teams' numeric season and L5 xGF/xGA. Calculation completion waits for that dependency. Cache/history reads do not replace the snapshot with current public-page data or modify earlier revisions. Expected-goal preparation remains descriptive and never changes goals, probabilities, confidence or qualification.
  - Revision evidence records the actual algorithm definition, selected model/Train, lineup/starter provenance and exact custom input/fit metadata. Archive the private input envelope in evidence and remove it from public payloads. Never attribute new outcomes to a legacy stack or reuse its prior win record.
  - Existing payload, evidence and summary JSON columns support the default-engine transition without a migration. The legacy requested-stack run field now freezes the requested algorithm/model definition. Earlier rows and their original evidence retain their historical meaning.
  - Manual admission validates the existing inclusive date/range rules and known default model, then includes every stored scheduled game type/state in scope. A saved default stack is not required. One game work item runs on projections through the same payload/cache boundary as the API.
  - API source refresh remains on lineups. Missing model-owned pregame dependencies queue on projections through the shared forecast boundary. No schedule imports, season syncs or migrations are started as a prediction side effect. Pending manual work returns to queued and does not archive placeholders; successful continuation records a real revision through the existing idempotent boundary.
  - Reject manual/partner and automated lineup or pregame starter writes for a game while its manual prediction item is queued/running or API prediction activity is pending. Return HTTP 409 with the actionable in-progress message before accepting observations or promoting current evidence; other games remain editable. Targeted lineup refresh admission obeys the same rule. Official started-game starter locks and live NHL presentation retain their existing authority.
  - Prediction admission and lineup/goalie persistence serialize on the same short nhl_games row lock. Admin admission locks its games in stable identity order before inserting queued work. API synchronous owners and deduplicated refresh variants use independent expiring owners in the existing shared cache; releases cannot clear another owner's protection. Preserve refresh admission across preparing releases and clear it on success or terminal failure. Expire abandoned owners within the existing one-day job deadline. No database row lock is held throughout prediction calculation or provider requests.
  - Preserve existing latest-successful canonical selection, explicit request-variant ownership, full-game market-only canonical requests, status transitions, retry idempotency and parent-run reconciliation. Failed or unavailable later work never deletes an earlier success.
  - All operational endpoints keep their existing authenticated super-admin and lifecycle middleware. Date navigation and read endpoints do not calculate predictions.
  - Admin game rows expose derived engine_time_seconds for the selected run. Measure total wall-clock seconds from run admission until that game work finishes, including queue waits, preparation, retries and persistence; it is not CPU time. Running and queued work use the server measurement time, terminal work freezes at finished_at, and absent work or missing terminal timestamps remain unavailable. Preserve the first worker started_at across retries. No new timing column is stored in the database.
  - The Engine Time table column uses compact seconds/minutes formatting and existing polling. Keep historical/latest prediction selection independent from selected-run timing, identify that scope in the cell explanation, and show an unavailable marker instead of inferring time from a revision publication timestamp. No additional browser timer or global state is required.
  - Admin game rows label stored internal confidence as Internal Conf, replace the former Qualified column with Public Conf, and add Days Away from the selected revision. Display both confidences and the frozen horizon in revision history, showing unavailable markers for missing historical fields and preserving zero-day horizons. Partner serialization follows NhlGamePredictionResponseCache.yaml; stored and admin confidence semantics remain internal.
  - Current summaries expose the actual new algorithm version, scores, winner and winning probability. Confidence remains distinct and nullable under the current engine contract.
public_interface:
  - GET /admin/game-predictions
  - POST /admin/game-predictions/runs
  - GET /admin/game-predictions/games/{game}/revisions
  - GET /admin/game-predictions/revisions/{revision}
  - NhlGamePredictionHistory
  - NhlGame::lockForLineupChange
  - NhlGame::predictionActivity
example_usage: |
  An admin requests a date without selecting a legacy stack.
  Each scheduled game gets a work item using the shared pregame engine.
  Recalculations append revisions while prior predictions remain unchanged.
