name: NHL Public Game Live Context
type: Cached Provider Game State Projection
location:
  - app/Services/NhlGameLiveContext.php
  - app/Services/NhlStartingGoalieSelector.php
  - app/Services/NhlAnticipatedLineupPayload.php
  - resources/js/pages/Games/GameCard.vue
  - resources/js/pages/Games/Show.vue
  - resources/js/layouts/MobileScoreboard.vue
purpose: Enrich today's public NHL game cards with short-lived official state, current scores, and canonical starting-goalie selection.
when_to_use:
  - Rendering a UTC-today or UTC-yesterday NHL game that remains unfinished.
  - Repairing missing final scoreboard scores for older scheduled games from cached final provider evidence.
  - Selecting the same starting-goalie identity for public game cards and partner predictions.
when_not_to_use:
  - Replacing completed historical boxscore imports.
  - Polling NHL gamecenter for future dates or repeatedly fetching historical games with complete stored final scores.
  - Treating projected goalie selection as confirmed evidence.
rules:
  - The Vue games index sorts live games first, pregame or unknown-state games next, and FINAL games last, with ascending puck-drop time within each group. Ordering recomputes after AJAX payload updates without mutating provider payload order; unavailable live games retain live priority.
  - Public live reads use the shared producer in NhlLiveGameFeed.yaml and never initiate provider requests. Legacy scheduled/internal consumers retain their existing fifteen-second source cache.
  - Live presentation uses NHL boxscore JSON exclusively. The sole local enrichment is goalie avatar lookup by provider playerId. Database names, scores, team metadata, projected starters, and anticipated lineups must not fill missing live fields.
  - Provider failure must not prevent the page from rendering; known-live games display unavailable rather than stored game details. Shared provider snapshots retain explicit observed times and freshness under NhlLiveGameFeed.yaml.
  - Public index/detail refreshes and scheduled boxscore sync include UTC yesterday's unfinished games so midnight cannot strand games in progress. Stored FINAL games do not refresh; recent final scores remain visible without waiting for the historical import pipeline. Older index/detail games retain the existing historical import checks; the compact scoreboard uses the separate final-score rules below.
  - FUT renders as Pregame and PRE renders as Starting soon.
  - Every non-empty provider state other than FUT, PRE, and FINAL is treated as live and renders current provider scores; FINAL renders final provider scores.
  - Live and FINAL provider state, scores, and team shots on goal are persisted to existing nhl_games fields. Missing provider SOG fields preserve stored counts rather than inventing zero.
  - The compact mobile scoreboard reads bounded date ranges without lineup or prediction assembly. The shared live reader offers compact mode, which reuses its boxscore cache and persistence while omitting goalie selection and roster assembly. Live identity and scores remain provider-owned and unavailable live evidence never falls back to database team facts. Completed OFF and FINAL games use nhl_games scores without requiring player-boxscore imports. Missing final scores or stale older schedule states may use the cached gamecenter fallback; only matching game IDs, final states and both nonnegative integer scores may repair nhl_games. This repair does not select or lock goalies, assemble rosters or update import progress. Failed fallback requests are cached for fifteen seconds; unavailable scores remain unknown. Complete stored finals never trigger provider calls. Future zero score columns remain hidden. Compact live facts expose the provider clock, intermission flag and period number/type without deriving elapsed time. The header displays time remaining followed by a separator and period (including OT/SO), or the completed-period intermission label, in green. Missing clock evidence remains a generic Live status rather than an invented countdown. This browser endpoint does not change partner API contracts.
  - Upcoming FUT/PRE header-scoreboard tiles read each team’s saved full-game moneyline probability from the latest successful canonical operational revision, matched to that side and team. Display one decimal percentage in the score position; no saved valid probability remains blank. Live/FINAL/OFF retain actual scores, including zero. A batched JSON projection reads only market rows, never private saved inputs, confidence, lineups or full revision payloads; missing history storage is treated as no saved prediction. This read never calculates or queues predictions.
  - Live Vue game cards replace team lineup badges and observation timestamps with team scores and SOG counts. Missing values display a dash; pregame and FINAL presentation is unchanged. Public game payloads expose each team's nullable sog alongside score.
  - Pregame cards select goalies in order from official boxscore starter, confirmed or expected observation, season projection, then workload projection.
  - Pregame public and prediction consumers use NhlStartingGoalieSelector; live presentation must bypass that selector and its projected-player fallbacks entirely.
  - Confirmed and expected evidence retains its evidence label; projection fallbacks must be labeled Projected.
  - Pregame team rows present the selected goalie as a right-aligned identity with player name, evidence-status badge, and canonical player headshot when available.
  - Live team rows show every boxscore goalie with participation evidence (starter flag, nonzero TOI, shots against, saves, or goals against), retaining provider names and local avatars when available. Missing starter flags must not trigger prediction selection. Unused backups are omitted; no claim is made that any listed participant is currently on ice.
  - Each live goalie's GA and Saves use their own provider row. Saves prefer saves, then a valid saveShotsAgainst numerator, then nonnegative shotsAgainst minus goalsAgainst. Never use team totals or another goalie; missing statistics render a dash and zero remains zero.
  - The public game-detail route additionally follows ui/NhlPublicGamePage.yaml for preview/recap modes, prepared payloads and provider scoring timelines. These changes do not alter index or partner payload contracts.
  - Live payloads set live_mode and expose per-team goalies arrays; starting_goalie and lineup remain null. Live index and detail views suppress anticipated-lineup UI. Internal database game ids may identify routes, but displayed game identity and metadata come from the provider.
public_interface:
  - GET /games
  - GET /games/payload
  - GET /games/scoreboard
  - NhlGameLiveContext::forGame
  - NhlGameLiveContext::refreshFinalScore
  - NhlStartingGoalieSelector::select
example_usage: |
  $context = app(NhlGameLiveContext::class)->forGame($game);
