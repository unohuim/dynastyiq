name: NHL Anticipated Lineups
type: Public Evidence Observation And Consensus Projection
location:
  - app/Services/XNhlLineupDiscovery.php
  - app/Services/NhlLineupImageOcr.php
  - scripts/lineup-ocr.mjs
  - config/lineup_ocr.php
  - app/Services/NhlOfficialGameRosterDiscovery.php
  - app/Services/NhlLineupTextParser.php
  - app/Services/NhlLineupPlayerResolver.php
  - app/Services/NhlAnticipatedLineupImporter.php
  - app/Services/NhlAnticipatedLineupPayload.php
  - app/Models/NhlCurrentLineupComponent.php
  - app/Jobs/ImportNhlAnticipatedLineupTeamJob.php
  - app/Console/Commands/ImportNhlAnticipatedLineupsCommand.php
  - app/Http/Controllers/NhlGamesController.php
  - resources/views/games/
  - docs/integrations/X_NHL_LINEUPS.md
  - database/migrations/2026_09_19_000001_create_public_evidence_and_nhl_lineup_tables.php
  - database/migrations/2026_09_20_000002_add_x_user_ids_and_seed_nhl_lineup_sources.php
  - database/migrations/2026_09_20_000003_add_is_active_to_source_scopes.php
  - database/migrations/2026_09_20_000004_create_nhl_current_lineup_components_table.php
purpose: Discover text-based public NHL lineup reports, preserve immutable observations, and expose a recency-aware current consensus to predictions and partner APIs.
when_to_use:
  - Searching for anticipated lineups for NHL teams playing today or tomorrow.
  - Resolving public lineup reports to canonical players and game-specific current truth.
  - Selecting a corroborated game roster for prediction inputs.
when_not_to_use:
  - Approving image text without canonical player and slot verification.
  - Replacing an official NHL game roster or boxscore lineup.
  - Treating multiple posts from the same publisher as independent corroboration.
rules:
  - Authorized POST /api/nhl-lineups submissions and direct UI manual submissions temporarily have equal lineup and goalie authority. Both require the same complete-roster validation; the latest accepted server-written manual observation wins, with observation id breaking timestamp ties. External publication timestamps and claimed user/source identities cannot affect this order. No voting or moderation workflow is introduced.
  - Partner submissions use platform manual with a stable api-client-{id} source handle and submitted_by_api_client_id in raw evidence; UI submissions retain their user identity. OCR runs before acquiring the game lock, and game/team validation and promotion occur under the same game lock used by UI submissions. Invalid submissions preserve all current lineup and goalie evidence. Submitted uploads are temporary, never fetched from arbitrary URLs.
  - Targeted /games lineup refreshes expose a super-admin-only Vue review modal. Each evaluated X post is added to the run's review feedback before processing the next post, retaining full text, source and publication time, decision and reason, attachment/OCR context, and player matches. The existing authenticated status endpoint returns this feedback incrementally through polling. Closing the modal does not cancel queued work or polling; it can be reopened while the card remains mounted. No reviewed-post content is broadcast to public consumers.
  - Super admins may request one missing game/team lineup from the public games card through POST /games/{nhlGameId}/lineup/refresh. Authorization and target membership are enforced server-side. The existing today/tomorrow team job runs on lineups with one ImportRun tracking its outcome; concurrent targeted requests reuse the working attempt. The Vue card polls the authenticated game-scoped status endpoint, patches returned lineup state without navigation, and stops timers and requests on unmount. Reported lineups are not refreshed through this action.
  - Automated preseason X lineup candidates must identify game-specific context anywhere in the complete caption or extracted lineup text, including after the roster. Accept tonight or a matching explicit game date and opponent, including morning-skate reports; generic practice groups without that context are declined with an audit reason. This discovery restriction does not apply to manual submissions, official NHL rosters, or regular-season and playoff games; existing date, game identity, and player verification checks still apply.
  - Grouped roster text uses the first four forward lines and first three defense pairs. Ignore surplus forward lines, surplus defense pairs, and standalone extras without using them to fill required grouped slots. Individually listed rosters remain supported; an explicit defense heading separates surplus individually listed forwards from defense. Ignored skater extras after a complete roster must not invalidate it or become goalie evidence. The selected eighteen still pass all identity, position, uniqueness, and depth-exception checks.
  - Roster separators accept spaced, unspaced, and one-sided-spaced hyphens, including mixed styles in one line. In-name hyphens in otherwise separated names must be preserved; tight separator expansion must produce the expected group size before names are resolved.
  - Roster rows also accept slash, pipe, comma, semicolon, tab, multiple-space, bullet, middle-dot, plus, ampersand, and colon separators while preserving punctuation within names. Slash-separated alternatives inside an otherwise complete three-forward or two-defense group occupy one slot; resolve each alternative for review, retain both names with a slash and null selected identity, and apply existing season-specific same-group peer eligibility. Slash-only rows may delimit distinct slots when they produce the expected group size. Empty alternatives and incomplete groups must not fabricate slots. Persistence and reconciliation must never silently choose an alternative.
  - Non-live game detail displays each team's Lineup and Prediction tabs independently, defaulting to Lineup. Verified evidence remains authoritative; otherwise a separate display-only projected lineup is shown, with current injury statuses below it and shared unavailable-player exclusions applied before selecting the projected roster. Questionable and suspected statuses retain the existing availability rules.
  - The Prediction tab displays the same selected skaters with SAT, SOG and goals per sixty minutes and per game, including projected-roster previews. Browser tab changes do not reload the page. Live details retain the NHL-only presentation contract.
  - Super admins may submit pasted text, an uploaded or clipboard-pasted JPEG/PNG image, or both for an unreported participating game/team through POST /games/{nhlGameId}/lineup. Authorization and game/team membership are server-enforced; validated submissions may replace an already reported lineup.
  - Manual images are limited to 10 MiB and use the same bounded OCR runner as X photos without provider calls. OCR runs outside the database lock; target membership is rechecked under lock before writing. Uploaded bytes remain temporary; accepted evidence retains the content hash, MIME type, size, OCR output and submitting user.
  - POST /games/{nhlGameId}/lineup/preview is super-admin-only and returns editable OCR rows without creating observations. All recognized words are shown regardless of confidence; spatial gaps separate player cells with hyphens. The modal requires review before Submit, sends image_reviewed with the edited text, and reviewed submissions must validate that text without falling back to OCR. Automated X image confidence handling is unchanged.
  - Manual submissions use NhlLineupTextParser, NhlLineupPlayerResolver verification, and NhlAnticipatedLineupImporter persistence without provider calls. A complete verified roster is required, including the game-type-specific peer fallback; invalid submissions create no evidence. The Vue modal previews/removes selected images, uses multipart AJAX for images and JSON for text-only input, and retains input on validation errors.
  - Manual evidence preserves the submitted text, submission timestamp, user id, game, and team under a manual source identity scoped to the submitting user. It must not masquerade as X evidence or enter X timeline discovery.
  - The public games page exposes manual entry only to super admins through either a reported or unreported team badge. A Vue modal submits via AJAX and patches the matching game/team lineup without navigation.
  - The parent command queues one job per team and NHL game scheduled today or tomorrow without reading current lineups or contacting providers. Team jobs evaluate the requested timing window and existing coverage when they execute, recording ineligible work as skipped.
  - Anticipated-lineup team jobs must use the dedicated lineups queue.
  - Default and outside-two-hours discovery include future games scheduled today and tomorrow in America/Toronto; within-two-hours discovery remains limited to today's games.
  - Discovery may accept a lineup post published on the game date or the immediately preceding calendar date when the post identifies the targeted game lineup.
  - Relative X wording is anchored to the publication calendar date in America/Toronto, never import time. Tonight and today mean that publication date; tomorrow means the next date. Each relative date present must match the target game, and relative wording without a publication timestamp is ineligible. Explicit matching date/opponent reports may still be published the preceding day. The same check applies to stored observations on reads, current-truth selection, and discovery skip decisions; manual overrides and official evidence are exempt, and rejected historical evidence is not deleted.
  - The evidence window begins at 00:00 America/Toronto on the calendar day immediately preceding the game; older observations must be declined and must not satisfy scheduler coverage, current-lineup selection, public/API payloads, or prediction inputs.
  - Date-eligible X photo attachments may supply lineup text through local Tesseract.js when the caption lacks a verified full roster. The engine and English language data are production npm dependencies, with no Python runtime, system OCR executable, or model downloads during imports. OCR output passes the existing text parser and canonical player verification; OCR never directly grants reported status.
  - Image extraction preserves original captions separately from parsing text and records photo URLs, extracted rows, confidence, and failures in raw evidence and local audits. Multiple images from one post remain one publisher observation.
  - OCR downloads allow only HTTPS pbs.twimg.com media URLs without redirects, have byte and pixel limits, use temporary files removed after processing, and run a bounded CPU subprocess without shell interpolation. Successful extraction is cached; errors are briefly cached and must remain visible in audits rather than fabricate players or abort valid caption processing.
  - Low-confidence OCR text is withheld as a whole rather than dropping individual names and shifting lineup slots. Spatial row reconstruction is heuristic and never bypasses resolver or split-squad checks.
  - Observations retain source, post URL, post text, publication and observation times, engagement, game, team, normalized slots, and unresolved names.
  - Canonical team identity uses nhl_teams.nhl_id and also retains team abbreviation.
  - Each normalized observation-player row repeats canonical team id and abbreviation so direct table inspection remains understandable without a parent join.
  - Split-squad evidence is keyed by NHL game id and must not collapse by team and date.
  - When one team has multiple games on the same date, extracted team players and opponent context must identify the targeted game; ambiguous evidence must not be attached arbitrarily.
  - Twelve ordered forwards map sequentially into four groups of three and six ordered defensemen map into three pairs.
  - A reportable lineup contains twelve forwards and six defensemen in unique valid slots, with verified canonical identities and compatible positions or the game-type-specific peer fallback. Duplicated NHL identities and goalies placed in skater slots prohibit reported status. Goalies and scratches are optional supplemental evidence.
  - Public or manual evidence must contain one roster-shaped block of twelve forward names followed by six defense names in the same post before canonical name resolution begins. Headings may separate groups; goalies and scratches cannot supply missing skater slots. Separate component posts remain audit-only.
  - Current lineup truth selects one eligible full observation for both forwards and defense. Historical projections whose representative components refer to different observations are not reported and must not suppress discovery or supply anticipated prediction rosters.
  - NhlLineupPlayerResolver owns the shared identity-and-slot validation used by discovery acceptance, current-lineup promotion, public/API reporting, job skip decisions, and anticipated-roster prediction eligibility. The scheduled game type governs the same-group unresolved-skater exception at every gate.
  - A newer verified full observation replaces the entire current roster; partial updates do not replace either group.
  - One distinct source is reported, two are corroborated, and three or more are strongly corroborated.
  - Consensus compares normalized player slots and only time-relevant matching observations.
  - Newer evidence may supersede current truth without deleting older observations.
  - A team job skips provider discovery only for a date-eligible lineup passing shared player verification, regardless of source count. Legacy rows labelled reported without verified core players must not appear in payloads or suppress correction searches.
  - Predictions may use a reported lineup whose skaters pass shared verification, including permitted game-type-specific unresolved peer fallbacks; corroboration remains higher-confidence evidence rather than a prediction prerequisite.
  - Prediction assembly must apply the same game-specific NHL, NHLe, and replacement-level projection ladder to all eighteen resolved skaters regardless of whether lineup authority is public evidence or the official NHL boxscore; official authority must not bypass rookie projection fallbacks.
  - In preseason only, an unresolved skater on any forward line or defense pair remains eligible when that same group contains at least one resolved player. Regular-season and playoff exceptions remain limited to F4/D3. A group with no resolved peer is never eligible; duplicate known identities, invalid positions, and missing slots remain invalid for every game type.
  - Eligible unresolved skaters retain their reported name and null NHL player id, use projection_source line_peer_average, and receive mean projected TOI, goals, assists, SOG, and available SAT and per-sixty rates from resolved players in the exact same group. Unknown players never supply averages for one another and missing SAT inputs stay null.
  - A validated manual submission records manual_override in immutable raw evidence and takes precedence for subsequent prediction roster selection. Each submission has a distinct identity, including resubmissions of older text. The newest eligible manual override wins; automated evidence cannot replace it or trigger paid X discovery. It retains manual attribution rather than claiming NHL boxscore authority. Live game presentation remains NHL-owned.
  - Official NHL lineup evidence remains authoritative over automated anticipated public evidence when no manual override exists.
  - Each eligible team job checks the NHL gamecenter boxscore before X; twelve official forwards and six official defensemen become current official truth and suppress X discovery for that game/team.
  - An NHL boxscore without a complete team roster falls through to X discovery.
  - A preseason partner prediction with unresolved roster evidence must run the same official boxscore discovery for each missing team, persist complete official observations, and reload current lineups before withholding output.
  - An explicitly ordered first goalie is also recorded as expected starting-goalie evidence; the second goalie remains backup context and does not become a starting candidate.
  - Valid manual overrides from UI or API with ordered goalies supply manual G1 expected starter evidence and G2 dressed-backup context. The latest accepted manual goalie decision, including an explicit goalie-picker selection, wins for that game/team over provider evidence; API request-specific goalie overrides remain first. Lineup-derived starter reads reject superseded or date-ineligible linked observations. Partner dressed rosters include both listed goalies without requiring a backup performance model or including G2 in starter simulation; live NHL presentation is unchanged.
  - The public game index includes every scheduled game for the selected date even when one or both teams have no current lineup projection.
  - The public game index may display historical stored team scores only when both scores are present on nhl_games, the boxscore import stage is completed, and nhl_boxscores contains rows for both participating teams; UTC-today LIVE, CRIT, and FINAL scores may be supplied by the cached official gamecenter context.
  - Public matchup status is team-specific and game detail renders the current representative lineup while retaining links to its supporting observations and remaining extensible for broader game details.
  - Generic X keyword search is prohibited; lineup discovery reads only reusable X accounts explicitly scoped to the target NHL team.
  - Lineup discovery must use only source-team scopes whose is_active flag is true.
  - Discovery reads five posts from each stored source in round-robin order, with at most six pages (thirty posts) per account per discovery attempt. A source is exhausted at that cap, when pagination ends or repeats, or at the start-of-day boundary immediately preceding the target game. Other sources continue until complete lineup coverage is accepted or every source is exhausted.
  - Provider account ids are resolved once and cached; every timeline page is evaluated without keyword filtering.
  - Every returned post is read in full and evaluated locally; search-term presence does not determine whether the post contains lineup evidence.
  - In the local Laravel environment only, every returned X post must write a Markdown audit under docs/troubleshooting/lineups/{TEAM_ABBREV}/x_post_{X_POST_ID}.md before candidate filtering, including its approval or decline reason, complete text, player matches, parsed slots, game context, and raw provider post.
  - Before writing a local lineup import audit, all generated Markdown beneath docs/troubleshooting/lineups is deleted recursively while README.md and directories are preserved; the import then creates a timestamped import_{date}_{time}.md manifest and fresh search.md for each eligible team, and each X request appends its exact query, game context, result count, complete returned posts, and decisions, including explicit zero-result searches.
  - X posts are charged and logged by resources returned; persisted post URLs prevent duplicate observations when searches return the same posts again.
  - Every account supplying accepted lineup evidence is stored as a reusable X source and scoped to that NHL team without assigning an official or trusted designation.
  - NhlLineupPlayerResolver is the single canonical identity-matching path for both lineup text extraction and observation persistence; lineup consumers must not implement independent player-name matching.
  - NhlLineupPlayerResolver must use PlayerIdentityNormalizer and canonical players, prefer an unambiguous target-team match, and may accept a unique league-wide match when canonical team assignment is stale.
  - Text lineup extraction identifies a complete ordered name-shaped roster block before calling NhlLineupPlayerResolver. Multiple complete blocks are rejected as ambiguous. The existing normalizer handles apostrophe variants, initials, acronyms, surname prefixes, and sweater numbers; recognized mentions in prose must not fill skater slots.
  - Reprocessing a game and team must re-evaluate unresolved observation-player identity fields through NhlLineupPlayerResolver while preserving the originally reported player name and source evidence.
  - When same-team players share a surname, a reported first initial must select the matching player; an explicit conflicting initial must not fall back to another same-surname player and create a duplicate canonical id.
  - A post is approved and persisted only when its twelve forwards and six defensemen together pass shared verification. Corroborating sources must match both groups in the same full observation.
  - Search priority follows the earliest scheduled puck drop and searches only teams that do not already have complete current lineup coverage.
  - A same-day game remains eligible after puck drop when either team still lacks a reportable lineup; started games with missing coverage take priority over later games.
  - Team discovery jobs may check NHL boxscores concurrently, but paid X requests must share one overlap lock, respect provider Retry-After guidance for temporary rate limits, and retry without recording the released attempt as a failed team search.
  - A successful team-search count requires at least one newly persisted full lineup observation; partial, empty, or duplicate-only responses are skipped rather than reported as lineups found.
  - Every dispatched team job must record one terminal successful, skipped, or failed result; queue-level timeouts and exhausted attempts must mark the parent import run so it cannot remain working indefinitely.
  - Live lineups terminal and Admin output emits only the team abbreviation, source handle, and five-post timeline range for each request; detailed post decisions, player counts, URLs, and reasons remain in local troubleshooting Markdown.
  - Scheduler eligibility is evaluated every second for enabled schedules, while configured lane intervals control when searches become due.
  - X searches persist the query and returned-post count in integration usage logs without an application-owned daily search ceiling.
  - Each admin-triggered lineup run atomically accumulates its returned X posts and dedicated import_runs estimated cost using the configured current X rates; usage from other runs must not affect its progress display.
public_interface:
  - GET /api/nhl/lineups
  - NhlAnticipatedLineupPayload::schedule
  - POST /api/nhl-lineups
  - POST /games/{nhlGameId}/lineup/refresh
  - GET /games/{nhlGameId}/lineup/refresh/{run}
  - POST /games/{nhlGameId}/lineup/preview
  - POST /games/{nhlGameId}/lineup
  - nhl:import-anticipated-lineups
  - GET /api/nhl-anticipated-lineups
  - GET /games
  - GET /games/payload
  - GET /games/{nhlGameId}
  - NhlAnticipatedLineupPayload::forGameTeam
  - nhl_current_lineup_components
example_usage: |
  php artisan nhl:import-anticipated-lineups --window=within-two-hours
