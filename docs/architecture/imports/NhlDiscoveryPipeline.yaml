name: NHL Discovery Pipeline
type: Import Discovery Pattern
location:
  - app/Support/NhlImportStages.php
  - app/Services/NhlDiscoverGames.php
  - app/Services/NhlDiscovery.php
  - app/Events/GamesDiscovered.php
  - app/Listeners/StartDiscoveredGameProcessing.php
  - app/Services/DiscoveredGameProcessing.php
  - app/Console/Commands/NhlDiscoverCommand.php
  - app/Jobs/NhlDiscoveryJob.php
  - app/Jobs/NhlDiscoverDayJob.php
purpose: Discover NHL games for a date or season and seed downstream import progress rows.
when_to_use:
  - Finding NHL games before running staged imports.
  - Seeding import progress rows for discovered games.
  - Scheduling discovery jobs.
when_not_to_use:
  - Importing play-by-play.
  - Importing shifts or boxscores.
  - Summarizing already discovered games.
rules:
  - Discovery prepares work for the staged import pipeline.
  - Discovery must not perform downstream stage transformations.
  - Discovery output must remain compatible with NhlImportOrchestrator.
  - Discovery must seed import progress rows from NhlImportStages instead of maintaining its own stage list.
  - Command-line discovery must record an admin-visible nhl_game_import_runs row before dispatching so CLI and UI discovery share the same orchestration ledger.
  - Discovery jobs must write nhl_import_progress.run_id when an admin-visible run created the discovery work.
  - The final distinct resolved discovery date emits GamesDiscovered after its transaction commits. Duplicate date delivery must not emit readiness twice or reopen a processing-completed run. Failed discovery runs must not be revived by later date completions.
  - A queued default-queue listener delegates readiness to DiscoveredGameProcessing, which verifies complete discovery and pending run-owned work before asking NhlImportOrchestrator to fill its existing game slots. Repeated events do not reset stages or duplicate completed processing.
  - Discovery job failures mark active discovery parents failed so automatic scheduling does not remain blocked indefinitely by an abandoned running parent.
public_interface:
  - NhlDiscoverCommand
  - NhlDiscoveryJob
  - NhlDiscoverDayJob
  - NhlDiscoverGames
  - NhlDiscovery
example_usage: |
  php artisan nhl:discover --date=2026-01-15
