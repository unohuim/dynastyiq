name: NHL Player Availability
type: Provider Observation And Current State Projection
location:
  - app/Services/NhlInjuryImporter.php
  - app/Services/NhlStartingGoalieImporter.php
  - app/Services/NhlAvailabilityPayload.php
  - resources/views/starting-goalies/index.blade.php
  - resources/js/pages/starting-goalies.js
  - database/migrations/2026_09_18_000001_create_nhl_availability_tables.php
purpose: Preserve provider observations while exposing normalized current NHL injury and starting-goalie evidence to public pages, partner APIs, and predictions.
when_to_use:
  - Importing NHL injury reporting from CBS Sports or RotoWire.
  - Importing RotoWire projected or confirmed starting goalies.
  - Resolving current player availability or game-specific goalie evidence.
when_not_to_use:
  - Publishing projected full starting lineups.
  - Treating a single inferred report as confirmed official availability.
  - Scheduling provider imports automatically without separate approval.
rules:
  - Injury observations are game independent and append only when normalized meaning changes.
  - Current injury state must be an upserted projection of the latest provider observations.
  - Current injury rows must retain last-seen time, anticipated-return evidence, and contributing sources.
  - RotoWire-only inferred injuries are suspected; explicit CBS reporting is reported; time-relevant agreement is corroborated.
  - Predictions exclude only out players with reported, corroborated, or confirmed-unavailable evidence.
  - Questionable, unknown, and suspected players remain eligible for projected rosters.
  - Starting-goalie observations are append only and latest evidence drives reads.
  - Starting-goalie provider rows must resolve against the complete scheduled team matchup, not either team in isolation.
  - When provider matchup orientation conflicts with a resolved NHL game, the NHL schedule is authoritative for home and away assignment.
  - Duplicate or inverse representations of the same provider matchup must produce at most one observation per game and team within an import run.
  - Starting-goalie reads preserve the existing flat observation collection and may additionally group those observations by NHL game for matchup-oriented consumers.
  - Canonical game start timestamps remain UTC in server payloads; browser presentation converts them to the user's local timezone and includes a timezone abbreviation.
  - Starting-goalie cards use regular-season goalie summaries for GAA, save percentage, and games played.
  - Preseason cards use the previous season's regular-season goalie summaries; regular-season and playoff cards use the game's current season regular-season summaries.
  - Missing qualifying goalie summaries must render as unavailable and must not be replaced with fabricated zero values.
  - Starting-goalie import defaults to today and tomorrow only when no explicit command dates are supplied.
  - Provider player names that cannot be resolved must be retained as unresolved observations.
  - Provider imports are manually initiated through Player Imports until scheduling is separately approved.
public_interface:
  - nhl:import-injuries
  - nhl:import-starting-goalies
  - GET /injuries
  - GET /starting-goalies
  - GET /api/nhl-injuries
  - GET /api/nhl-starting-goalies
example_usage: |
  php artisan nhl:import-starting-goalies --date=2026-09-18
