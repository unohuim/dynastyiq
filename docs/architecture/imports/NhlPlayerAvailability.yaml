name: NHL Player Availability
type: Provider Observation And Current State Projection
location:
  - app/Services/NhlLineupAvailability.php
  - app/Services/NhlInjuryImporter.php
  - app/Services/NhlStartingGoalieImporter.php
  - app/Services/NhlAvailabilityPayload.php
  - app/Services/NhlStartingGoalieSelector.php
  - resources/views/starting-goalies/index.blade.php
  - resources/js/pages/starting-goalies.js
  - database/migrations/2026_09_18_000001_create_nhl_availability_tables.php
purpose: Preserve provider observations while exposing normalized current NHL injury and starting-goalie evidence to public pages, partner APIs, and predictions.
when_to_use:
  - Importing NHL injury reporting from CBS Sports or RotoWire.
  - Importing RotoWire projected or confirmed starting goalies.
  - Importing expected starting-goalie evidence from an ordered public lineup report.
  - Resolving current player availability or game-specific goalie evidence.
when_not_to_use:
  - Publishing projected full starting lineups.
  - Treating a single inferred report as confirmed official availability.
  - Scheduling provider imports automatically without separate approval.
rules:
  - Manual starter selection and provider starter observation writes obey the active-prediction game-write exclusion in stats/NhlGamePredictionHistory.yaml. Conflicts reject the targeted update without changing saved observations. This does not prevent official NHL started-game starter locks or alter live presentation.
  - Started-game selection persists the first resolved NHL starter separately for each game side in nhl_games away_starter_lock/home_starter_lock. Prefer a unique explicit starter flag; when absent, use the only goalie with nonzero recorded TOI. If multiple goalies played, use the earliest ordered NHL play identifying one of those team goalies through goalieInNetId. Missing or conflicting evidence remains unavailable; never use roster order or projected workload to guess a live starter. Event reads validate game/team identity, use bounded timeouts and a 60-second cache, and share the current prediction input context. A nonempty NHL state other than FUT/PRE, exact game id and matching team are required. Atomic null-only writes preserve the first identity across concurrent requests, later provider corrections, relief appearances, cache expiration and manual/request overrides. Predictions and starter APIs prefer the durable lock. Existing observations are not rewritten or backfilled. Missing personal projections use the labelled league-average prediction fallback.
  - Super admins may list all team-associated goalie players, regardless of league or NHL-id availability, through GET /games/{nhlGameId}/goalies and select a starter through POST /games/{nhlGameId}/starting-goalie. Both endpoints enforce authorization and game/team scope; writes also verify the selected player belongs to the team and is identified by is_goalie or a G position field. Selection appends an attributed manual expected observation; it competes with other valid game/team starter reports by server observation time and id, without permanent manual priority. Request-specific API overrides remain first before puck drop. Missing canonical NHL identity or a usable goalie model must not trigger substitution in predictions. Live game presentation remains NHL-owned.
  - The super-admin Vue goalie picker opens from the non-live game card avatar/status, includes search, loading/error feedback and keyboard dismissal, saves immediately through AJAX, and patches the card without navigation. Public visitors cannot see or invoke editing controls. Dropdowns must not be clipped by card shells.
  - Injury observations are game independent and append only when normalized meaning changes.
  - Current injury state must be an upserted projection of the latest provider observations.
  - Current injury rows must retain last-seen time, anticipated-return evidence, and contributing sources.
  - RotoWire-only inferred injuries are suspected; explicit CBS reporting is reported; time-relevant agreement is corroborated.
  - Predictions exclude only out players with reported, corroborated, or confirmed-unavailable evidence.
  - NhlLineupAvailability is the shared game-date eligibility boundary for UI/API manual submissions, automated candidate admission, current anticipated-lineup reads, projected/last-known prediction rosters, pregame starter selection and saved-forecast safety. Reject unavailable dressed identities with named validation reasons before manual writes; scratches are not dressed participants. Preserve canonical identity, team-membership, slot/count, duplicate and unknown-player verification. Injury conflicts cannot be bypassed by manual source priority or client-supplied lineup evidence.
  - Eligibility uses supported current out evidence known by the earlier request/target start cutoff, with target calendar end only when scheduled time is unknown. An estimated return date does not establish clearance. Started and finished games retain their actual NHL roster/starter authority and must not lose historical participants because of current injuries.
  - New predictions must resolve a complete eligible anticipated, projected or prior-lineup roster; never silently remove an injured skater and publish a shortened roster. Explicit incompatible roster/starter overrides fail validation. Filter unavailable goalies before provider deduplication and projection/workload selection, retaining the existing recency and split-squad rules for remaining candidates.
  - Current eligibility identity is a stable, batched per-date projection of excluded NHL IDs, independent of polling/last-seen timestamps. Include it in prepared and response fingerprints and version away old prepared shapes. Reuse committed history; changed participants request only their missing context through the existing prediction preparation pathway.
  - After a completed injury reconciliation changes supported-out membership, queue the existing deduplicated lineups refresh only for affected today/future unstarted games with an existing successful canonical forecast, and invalidate their public detail. Healthy saved reads remain immediate. An upcoming saved forecast containing an unavailable calculated participant/starter returns preparing with refresh rather than being served as current. Preserve its immutable revision/history and historical read behavior; no source imports or new season/model builds are started.
  - Questionable, unknown, and suspected players remain eligible for projected rosters.
  - Starting-goalie observations are append only. Before puck drop, select the newest eligible confirmed or expected report by server-recorded fetched_at descending and observation id descending, regardless of manual, public-lineup, RotoWire or NHL observation provider. Confirmed status and manual origin do not outrank a newer valid report. Retain each provider's latest valid report per game/team; unknown reports remain displayable when no valid report exists for that provider and cannot hide earlier valid starter evidence. External publication timestamps cannot control recency. Durable NHL starter locks remain authoritative after puck drop.
  - A RotoWire goalie assigned to multiple NHL game ids for the same team and date is ambiguous and must be excluded from current starter selection, including historical observations already stored. Conflict detection spans the full date even when the consumer requests one game, uses canonical or provider identity and shared normalized names, and does not discard the raw observations.
  - Public starting-goalie payloads and prediction starter selection share the same observation ranking and split-squad conflict rules. Without eligible game-specific starter evidence, a team playing multiple games on the date has no selected starter; team-level season or workload guesses must not assign the same default starter to both squads.
  - An anticipated-lineup G1 may create an expected public_lineup starting-goalie observation with the source post and publication timestamp; G2 remains backup context.
  - Linked public_lineup and manual starter evidence must belong to the currently selected verified, date-eligible game/team observation. Superseded and wrong-date observations remain historical only. Accepted UI/API manual lineup G1 and explicit goalie-picker decisions use the same recency ordering as provider reports; explicit prediction request overrides remain first before puck drop. G1 evidence retains submitter and lineup observation attribution, while G2 remains dressed backup context. Legacy public_lineup rows attributed to a current manual override retain equivalent attribution without permanent priority.
  - An NHL boxscore goalie with `starter: true` creates confirmed nhl_boxscore starting-goalie evidence; another listed goalie remains backup context.
  - Starting-goalie provider rows must resolve against the complete scheduled team matchup, not either team in isolation.
  - Provider home and away orientation must resolve an exact NHL game before any inverse fallback; inverse fallback is allowed only when the date and team pair identify exactly one NHL game so split-squad games retain distinct NHL game ids.
  - When provider matchup orientation conflicts with a resolved NHL game, the NHL schedule is authoritative for home and away assignment.
  - Duplicate or inverse representations of the same provider matchup must produce at most one observation per game and team within an import run.
  - Starting-goalie reads preserve the existing flat observation collection and may additionally group those observations by NHL game for matchup-oriented consumers.
  - Starting-goalie identity selection is shared by public game cards and predictions. A durable NHL starter lock is first. Before puck drop, request-specific overrides precede the newest eligible confirmed/expected observation; without one, use a stored official starter, then season projection and workload projection. Never substitute projected workload for an unresolved started-game starter.
  - Canonical game start timestamps remain UTC in server payloads; browser presentation converts them to the user's local timezone and includes a timezone abbreviation.
  - Starting-goalie cards use regular-season goalie summaries for GAA, save percentage, and games played.
  - Preseason cards use the previous season's regular-season goalie summaries; regular-season and playoff cards use the game's current season regular-season summaries.
  - Missing qualifying goalie summaries must render as unavailable and must not be replaced with fabricated zero values.
  - Starting-goalie import defaults to today and tomorrow only when no explicit command dates are supplied.
  - Provider player names that cannot be resolved must be retained as unresolved observations.
  - Goalie identity resolution must accept canonical NHL players identified by either players.is_goalie or a G value in players.position or players.pos_type.
  - Starting-goalie identity resolution may resolve a team-matched canonical player with an NHL id regardless of current league assignment because NHL-owned preseason goalies may currently be assigned outside the NHL.
  - Provider imports may be manually initiated through Player Imports or dispatched by an explicitly enabled AdminImportSchedule.
  - Scheduled starting-goalie imports refresh today independently from the bounded future-date scan; scheduled injuries refresh current game-independent state.
public_interface:
  - GET /games/{nhlGameId}/goalies
  - POST /games/{nhlGameId}/starting-goalie
  - nhl:import-injuries
  - nhl:import-starting-goalies
  - GET /injuries
  - GET /starting-goalies
  - GET /api/nhl-injuries
  - GET /api/nhl-starting-goalies
example_usage: |
  php artisan nhl:import-starting-goalies --date=2026-09-18
