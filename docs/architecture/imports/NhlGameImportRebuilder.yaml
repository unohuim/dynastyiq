name: NHL Game Import Rebuilder
type: Operational Import Repair Service
location:
  - app/Jobs/RebuildNhlOnIceStatsJob.php
  - app/Jobs/RebuildNhlGameImportJob.php
  - app/Jobs/PreflightNhlGameImportRebuildJob.php
  - app/Jobs/ClearNhlGameImportJob.php
  - app/Jobs/SeedNhlGameImportProgressJob.php
  - app/Jobs/DispatchNhlGameImportPipelineJob.php
  - app/Services/NhlGameImportRebuilder.php
  - app/Http/Controllers/Admin/NhlGameValidationController.php
  - app/Http/Controllers/Admin/NhlGameImportController.php
purpose: Provide explicit admin full-game repair and targeted derived on-ice rebuild paths while preserving each approved source boundary.
when_to_use:
  - Reprocessing a game after parser semantics changed and stale rows may remain.
  - Repairing validation failures that cannot be fixed by upserting one import stage.
  - Rebuilding raw and derived game-scoped data while preserving reusable global records.
when_not_to_use:
  - Routine provider refreshes where natural-key upserts are sufficient.
  - Clearing all NHL games or player identities.
  - Automatically deleting data from validation checks without explicit admin action.
rules:
  - Game rebuilds must be explicit admin-triggered operations.
  - Admin HTTP endpoints dispatch the appropriate queued rebuild job and never delete or transform game graphs inline. Full rebuilds use RebuildNhlGameImportJob; targeted on-ice rebuilds use RebuildNhlOnIceStatsJob.
  - RebuildNhlGameImportJob must be unique by game id so repeated clicks do not enqueue competing rebuild setup jobs for the same game.
  - Full rebuild setup must run as separate queued jobs for source preflight, game-scoped cleanup, progress reseeding, and PBP pipeline dispatch.
  - Full rebuild setup phases must share an active game lock from preflight through pipeline dispatch so repeated clicks cannot start a second rebuild while a previous rebuild phase is still running.
  - Full-rebuild source preflight must complete before game-scoped data is deleted.
  - Rebuilds must delete dependent game-scoped rows before deleting raw game-scoped rows.
  - Full rebuilds must delete play-by-play rows for the game so parser changes that reduce row counts remove stale records.
  - Full rebuilds must reseed all canonical import progress stages for the game.
  - Full rebuilds must dispatch the pipeline from the PBP stage.
  - Rebuilds must not delete nhl_games rows or global NHL unit composition rows.
  - Targeted on-ice rebuilding validates stored PBP, boxscore and raw-shift coverage before cleanup, preserves those raw sources and SAT facts, and shares the canonical per-game import lock. Derived cleanup and replacement commit atomically under the run cancellation fence.
  - The targeted transformation order is shift units, event-unit links, HTML PBP verification, unit/player strength summaries, then summary validation. Global player identities and unit compositions are retained. Failed validation rolls back the replacement graph.
  - A scoped on-ice run checkpoints successful games. Only after all selected games commit does an active, unsignalled run finalize once and queue one separately tracked Season Sync per affected season; cache publication remains owned by the normal season-sync event flow. Paused finalization waits for Resume; cancelled work cannot dispatch follow-up syncs.
public_interface:
  - RebuildNhlGameImportJob
  - PreflightNhlGameImportRebuildJob
  - ClearNhlGameImportJob
  - SeedNhlGameImportProgressJob
  - DispatchNhlGameImportPipelineJob
  - NhlGameImportRebuilder::rebuildOnIce()
  - NhlGameImportRebuilder::finishOnIceRun()
  - NhlGameImportRebuilder::rebuild()
  - admin.nhl-game-imports.games.rerun
  - admin.nhl-validations.rebuild-game
example_usage: |
  RebuildNhlGameImportJob::dispatch($gameId, $runId);
