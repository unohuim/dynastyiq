name: NHL Public Game Page
type: Cached Public Preview And Recap
location:
  - app/Services/NhlPublicGamePage.php
  - app/Jobs/RefreshNhlPublicGamePageJob.php
  - app/Http/Controllers/NhlGamesController.php
  - resources/js/pages/Games/Show.vue
  - resources/js/pages/Games/GameSectionState.vue
  - resources/js/pages/Games/GameLiveDetails.vue
  - resources/js/pages/Games/game-panels.js
  - resources/js/layouts/MobileScoreboard.vue
purpose: Present fast public game previews, live detail and recaps, sharing descriptive Matchup statistics with partner responses.
when_to_use:
  - Opening a game from the shared header scoreboard or previous meetings.
  - Preparing public game detail after committed imports, lineup evidence or canonical predictions change.
when_not_to_use:
  - Calculating or changing engine predictions.
  - Replacing partner API payloads or private prediction evidence.
rules:
  - Live and recap presentation follows the public game reference in UI_DESIGN.md. Local Summary, Boxscore, Play-by-play, Shot map and Game flow tabs reuse the same deferred/shared payload; changing tabs never fetches NHL. Rink filters preserve recorded coordinates and period/team/type evidence. Game flow counts recorded non-shootout attempts by elapsed game time, including attempts without rink coordinates, and never extends into unplayed time. Desktop summary fits the remaining shared-shell viewport with internally scrolling lists; mobile retains ordinary vertical scrolling and all panels without horizontal document overflow.
  - Live SAT counts goals, saved shots, misses and blocked attempts belonging to each shooting team from the shared play-by-play, independent of coordinates; shootouts are excluded and missing evidence remains unknown. Goalie saves may derive from known provider shotsAgainst minus goalsAgainst. Goalie SA and SV% require known denominators; zero shots against displays an unavailable rate. These are public presentation calculations, not import or prediction changes.
  - The layout scoreboard marks only the current Games/Show game with aria-current page, a blue bottom underline and subtle highlight. Selection follows Inertia page props and survives live updates independently of scoreboard date navigation. Other pages have no selected game.
  - Public timeline fields are projected once from shared provider plays for live games, or batched imported plays and participant names for stored recaps. Scoring goals and rink shots exclude shootouts; a shootout-deciding goal is represented in its period line only. Omit unlocated or unknown-team shot markers. Missing or score-inconsistent period evidence remains unknown instead of fabricated zeros. Detailed plays, shot markers and period scores are never part of the compact broadcast or first-paint payload.
  - Initial game responses contain only lightweight schedule facts, saved public odds and the compact shared live overview. They must not build player projections, select projected rosters, aggregate team form, load previous meetings or assemble recap boxscores.
  - Deferred sections have independent requests, loading placeholders, timeout/error feedback and per-section Retry. Matchup and meeting reads do not wait for player preparation. Cold player/recap payload misses queue the existing one-game preparation job and return a preparing response; queue and browser consumers never run concurrent preparation for one game.
  - Deferred section fields are explicitly allowlisted on server and browser. They cannot overwrite score, clock, team identity, game state, probabilities or other overview fields. Navigation, authoritative full live updates and mode transitions cancel obsolete section work.
  - Preserve the existing numeric game URLs, public access and lineup mutation authorization. View modes are canonical in docs/ENUMS.md.
  - Upcoming pages show saved canonical prediction outputs only; never expose raw request inputs/private evidence or run an engine on a public read. Moneyline rows must match the scheduled side and team identity. Missing predictions stay unavailable. The deferred factors section exposes curated preview_analysis from saved prediction totals/history and committed same-model context; Matchup contains a separate curated prediction_drivers summary of actual saved inputs and effects.
  - Preview navigation defaults to Matchup and includes Lineups, Head-to-head and Factors. Each tab has independently deferred data, loading/error feedback and retry. Request only the selected preview tab; switching tabs cancels obsolete requests without reloading the page. Preserve separate live/recap behavior. Matchup driver and Factor requests pin prediction_revision_id to the displayed same-game successful canonical revision, never a different game or invalid explicit revision.
  - Matchup reports season-to-date record, last-five record, head-to-head record over the last ten completed meetings across seasons of the same game type, GF/GP, GA/GP, PP%, PK%, PP opportunities/GP and PP opportunities allowed/GP from completed prior game totals of the same season and game type (except the explicitly cross-season head-to-head window). Display one centered comparison table with adjacent away/home value columns and one shared metric column. Sum goals and opportunities before dividing; missing goals do not hide otherwise-known opportunity averages. Zero opportunities have an unknown success percentage. The four scoring rows GF/GP, GA/GP, xGF/GP and xGA/GP display the last five completed team games (continuing into the previous season when needed), followed by relative percentage change versus that team's norm: current-season average once ten completed games exist, otherwise previous-season average. Read matching committed model-owned context for GF/GA when available, with lightweight stored-score compatibility when context is absent or sample counts differ. Expected values use available scored xG totals divided by full window GP; missing ratings do not blank a partial total, but entirely unrated data remains unknown. A zero/unknown norm leaves relative change unavailable. Label each team's norm period and GP. Prepare per-game xG once per season through the statistics reader in the existing background job, then select exact L5/norm game memberships in memory. Keep legacy form rate fields season-scoped for API compatibility and expose scoring_trend for the new presentation. Cache window metadata and reject outdated cached comparisons after membership counts/period change. Cold public reads queue/coalesce existing one-game preparation, show basic statistics immediately and poll Matchup boundedly for expected rates; they never scan shot facts themselves. The separate Head-to-head tab retains previous-game detail.
  - Matchup's What drives this prediction table reads only the same-game displayed successful canonical revision and small archived input/summary fields. Show saved L5 wins/sample, the EV recent-form volume change and EV goals before/after that change, lineup L20 PP goals/GP, team L5 PP goals allowed/GP, the selected PP history source, projected EV/PP goals, SOG and total goals. Show schedule attempt/probability effects only when the frozen forecast applied the exact fourth-in-seven B2B rule. Derive display effects from frozen settings and saved samples, never current settings, raw results or a fresh engine run. Do not expose equations, blend weights, bucket trees or raw evidence. Missing/legacy inputs remain unknown; invalid or cross-game pinned revisions never fall back to another revision. Historical Matchup form remains descriptive and distinct from the saved driver values. Prediction-driver projections remain distinct from descriptive L5 scoring trends; neither display changes the engine. Public API form adds last-five fields while retaining last-ten fields for compatibility.
  - Factors shows team scoring summaries first and compact player rows separately below, headed Last 10 Games. Include the union of each team's top three positive projected goal contributors and top three known personal L10 points-per-game leaders, deduplicated, with points leaders first (descending points/GP, stable player ID ties). Only the saved forecast roster is eligible. Personal context must match model, game, team, parent, opponent and cutoff. Show L10 EV SAT/60, EV SAT/GP, EV SH% and PP G/GP regardless of their influence on the engine. Committed personal strength windows supply these rates; saved personal input history is the compatibility source when strength context is absent. Sum matching totals and exposure or GP before dividing; never substitute pooled rates. Show the L10 value and relative percentage change from personal Train, green up/red down with arrows and accessible direction text. Do not show the Train value or formulas in player rows. A zero/unknown baseline leaves change unavailable; preserve real recent zeros. Name the actual frozen training horizon in the comparison caption. Player points/GP comes only from committed personal L10 totals and GP; unavailable evidence cannot enter the points ranking.
  - The public matchup reader supplies prior-date form without inspecting live snapshots, running an engine or calling providers. Public preview reads retain optional cached expected rates and queue ordinary preparation only for upcoming games. Operational predictions instead require a source-bound ready Matchup snapshot under stats/NhlGamePredictionResponseCache.yaml. The existing public-game job accepts an optional prediction source identity to prepare only historical expected values in any target game state, independently of public-page refresh deduplication and cache invalidation. Its ordinary constructor behavior remains unchanged. Saved partner Matchup data is read from the completed revision rather than replaced at response time.
  - Matchup insights are descriptive context rather than causal explanations or adjustments. Use only committed same-model/team/game context for the displayed forecast roster, with a source cutoff no later than request time or scheduled start. Compare saved L5/L10/L20/LSeason and opponent windows with Train; require at least five games in both samples, a positive Train baseline and at least twenty-five percent relative departure. Compute per-game metrics from saved totals and games, preserve true zeros, and omit unknown/invalid values. Opponent windows identify the actual opponent team and the last meetings against it.
  - Rank insights by absolute relative departure, then sample size and stable identity. Deduplicate the same entity/metric across windows, limit one fact per player and two per team entity, and select up to three facts per side. Show both values, units, period, sample sizes, direction and the context timestamp; do not manufacture facts to fill six slots. Include player PP goal/shot rates only when saved strength evidence supports them. Missing team special-teams windows are not reconstructed from raw results.
  - Preview analysis remains out of first paint and is shared for five minutes by canonical revision and committed context update/run/count tokens. PostgreSQL projects small roster and history totals inside the database; public reads never decode full private bucket trees, replay history, fit models, call providers for these facts, queue predictions or create revisions. Expected-rate preparation shares the existing background game lock/cache invalidation and a short admission marker to avoid duplicate deliveries during public polling. Explicit preview refresh observes new revisions/context; preview statistics do not periodically reload the page. Deferred section allowlisting, errors/retry and live-mode cancellation remain authoritative.
  - Team form and previous meetings use completed results strictly before the selected game date, with team form scoped to its season and game type. Do not include the selected game's result in its pregame form.
  - Displayed season, last-ten and head-to-head W-L-OTL records classify a loss from the actual recorded ending, preferring game_outcome.lastPeriodType then game_outcome.periodType then period_type when recognized. The same ending selects the prepared and first-paint final label. Overtime/shootout-enabled schedule flags never identify an actual ending. Without recognized ending evidence, retain generic Final and the standard-loss fallback rather than inventing an overtime loss. Version public presentation caches when correcting cached labels; this classification never changes saved context win percentages or prediction calculations.
  - Imported completed games use local final scores, boxscores and scoring events. Missing statistics stay unknown, including when imports are incomplete. Recap text is a deterministic summary of the stored score.
  - Recent unfinished detail consumes the shared five-second producer governed by imports/NhlLiveGameFeed.yaml, without making browser-driven NHL requests. Live identity, scores, rosters and events come exclusively from matching provider JSON; local goalie avatars retain their existing exception. An initial live read with no usable evidence displays its unavailable state without substituting database results. Background feed recovery follows Silent background updates in UI_DESIGN.md and preserves already-rendered content.
  - A provider final snapshot may bridge the interval before completed imports; subsequent import preparation replaces it with stored facts.
  - Prepared public payloads are shared, but authorization props are computed per request outside the cache. Preview payloads expire after five minutes and stored recaps after six hours; schedule state/timestamp changes use a new cache identity.
  - Committed boxscore and shot imports, current-lineup or starter-observation writes, and successful canonical prediction revisions invalidate and queue one-game preparation on default, coalescing pending refreshes by game. Versioned invalidation fences in-flight builds from publishing over newer source changes. Background preparation builds and caches missing detail; public section reads queue that work rather than performing heavy calculations. Versioned invalidation remains in effect; no migration, import or prediction calculation is triggered.
  - Scoreboard game links use Inertia navigation with short-lived hover prefetching for previews and recaps. Live tiles disable prefetch reuse and live detail responses use no-store. Live facts arrive through Reverb with shared-snapshot reads for initial load, reconnect and full-detail updates. Previews do not periodically reload Inertia or blank statistics. Explicit lineup actions may refresh; bounded deferred expected-rate preparation retains visible basic statistics. Live state transitions continue through the shared feed; finished pages stop polling. Timers and requests are disposed on unmount.
public_interface:
  - GET /games/{nhlGameId}
  - GET /games/{nhlGameId}/details?section={section}
  - NhlPublicGamePage::predictionMatchup
  - NhlPublicGamePage::preparePredictionMatchup
  - NhlPublicGamePage::predictionMatchupFailed
  - NhlPublicGamePage::matchup
  - NhlPublicGamePage::overview
  - NhlPublicGamePage::panel
  - NhlPublicGamePage::prepare
  - NhlPublicGamePage::payload
  - NhlPublicGamePage::forget
  - NhlPublicGamePage::refreshAfterCommit
  - RefreshNhlPublicGamePageJob
example_usage: |
  Return Inertia::render('Games/Show', $pages->overview($nhlGameId)).
  The browser reads each section afterward through the details endpoint.
