name: Inertia Application Shell
type: Shared Vue Layout
location:
  - app/Http/Middleware/HandleInertiaRequests.php
  - resources/views/app.blade.php
  - resources/js/inertia.js
  - resources/js/layouts/AppLayout.vue
  - resources/js/layouts/MobileScoreboard.vue
  - resources/js/layouts/scoreboard.js
  - resources/js/layouts/AccountPanel.vue
  - resources/js/layouts/ShellDisclosure.vue
  - resources/js/layouts/shell-realtime.js
purpose: Keep navigation, account controls and notifications Vue-owned without loading legacy UI runtimes on Inertia pages.
when_to_use:
  - New Inertia pages and approved page migrations.
  - Shared desktop/mobile navigation, account settings and toast feedback.
when_not_to_use:
  - Replacing layouts or scripts on unmigrated Blade pages.
  - Changing provider authentication or backend authorization policy.
rules:
  - The Inertia root document contains metadata, asset loading and the mount only. It must not include interactive Blade navigation, Livewire components, Alpine state or executable inline bootstrap scripts.
  - Inertia has a dedicated Vite entry point and shared Vue layout. Legacy app.js remains available only to legacy pages.
  - Navigation eligibility and route URLs are backend-owned shared props. Home/logo navigation points to the public root URI for both guests and members, with active state on both root and dashboard routes. Desktop omits the separate Home text link because the logo supplies that action. Existing admin access predicates, community navigation gates and FantasyIntegrationState readiness remain unchanged. Hiding a link is not authorization.
  - Mobile and desktop Inertia layouts share one compact game scoreboard. Mobile retains dark bottom icon navigation without a separate logo/search/account header. Desktop places a dark navigation row above the scoreboard with the complete home-linked DynastyIQ logo, eligible menu links and News, notification settings through the existing account drawer, and the account avatar or guest sign-in at the right. The header has no search bar. Full-logo rendering preserves the shield and wordmark and removes the dark raster background through SVG alpha filtering.
  - Mobile places date controls and the Games link above the full-width chronological strip. Desktop places date controls on the left, the flexible game strip in the middle and Games on the right of one band. Games uses the same right chevron as date navigation. Date labels use weekday, abbreviated month and day, substituting Yesterday, Today or Tomorrow relative to the Eastern calendar day. The visible day updates both the date controls and the Games link date. Browsing prepends/appends seven-day ranges while preserving the visible position, with directional loading feedback and retry for the failed range. Stored schedule bounds do not block calendar browsing; dates without stored games remain explicit. Game tiles link to existing game-detail routes.
  - Loaded date ranges and game tiles remain in component-owned memory across scrolling, date jumps and the daily rollover. Returning to a loaded date reuses its cached range without a request, including empty dates. Periodic freshness requests are limited to UTC today and yesterday; cached older and future slates do not poll. Loading guards prevent duplicate edge requests. The cache is disposed with the layout rather than shared globally.
  - The default scoreboard date is yesterday before 11 a.m. America/Toronto and today from 11 a.m., observing daylight saving. A mounted layout updates at rollover and on foreground return; explicit date browsing is retained. Timers, requests, visibility listeners and scroll callbacks are disposed with the component. One scoreboard instance serves both viewport sizes without breakpoint-specific duplicate requests.
  - Scoreboard data comes from the bounded public browser endpoint, separately from lineup and prediction assembly. Recent live evidence shares the existing cached NHL source. Completed games use stored final scores independently of player-boxscore imports, with a cached NHL fallback to repair missing historical finals. Missing provider evidence must not invent scores. No predictions or probabilities are invented for compact tiles.
  - Account controls call existing scoped endpoints. Provider credentials must never be included in shared props or prefilled from storage. CSRF protection and Discord OAuth remain unchanged.
  - Links to unmigrated pages use document navigation, not Inertia requests expecting incompatible responses.
  - Drawer, disclosure, toast and websocket state belong to the mounted shell. Timers, event listeners and subscriptions are disposed on unmount. Application code must not publish or rely on global clients or state. The Pusher library may expose its constructor; the shell owns its connection instance locally.
  - Successful settings mutations refresh backend-owned shell props. Failed writes retain an actionable error and reconcile control values; buttons prevent simultaneous writes.
  - User and organization broadcasts remain scoped to the authenticated user's channel and selected member organization. Guests do not subscribe to private channels.
  - Toast feedback supports shared flash messages, component notification callbacks and the existing toast DOM event; shell toasts must not steal input focus.
public_interface:
  - Inertia shared shell props
  - AppLayout default Inertia layout
  - GET /games/scoreboard?start=YYYY-MM-DD&end=YYYY-MM-DD (at most 31 inclusive days)
  - Inertia shared shell.scoreboard_url
  - Inertia shared shell.scoreboard_games_url
  - AccountPanel notify event
  - ShellDisclosure label and default slot
  - Component-injected notify callback and toast DOM event
example_usage: |
  Return Inertia::render('Admin/Evaluations/Index', $props).
  The dedicated entry assigns AppLayout unless the page declares another layout.
  Laravel remains responsible for each linked route and mutation's authorization.
