name: Prepared NHL Schedule Snapshots
type: Durable Read Projection
location:
  - app/Services/NhlScheduleCalculator.php
  - app/Services/NhlScheduleSnapshots.php
  - app/Jobs/BuildNhlScheduleSnapshotsJob.php
  - app/Console/Commands/PrepareNhlScheduleCommand.php
  - app/Listeners/QueueNhlScheduleSnapshots.php
  - app/Http/Controllers/NhlScheduleController.php
  - database/migrations/2026_11_16_210000_create_nhl_schedule_snapshots_table.php
purpose: Serve weekly schedules and remaining-season off-night totals without recalculating source facts during public navigation.
when_to_use:
  - Preparing the public Tools Schedule display.
  - Refreshing schedule views after schedule imports, final-game updates or season-stat syncs.
when_not_to_use:
  - Replacing nhl_games as the schedule source.
  - Storing predictions, live score feeds or player statistics.
rules:
  - Existing source metadata refresh cannot serve as a prepared display store. Keep calculated views in durable nhl_schedule_snapshots rows, independently of disposable Laravel cache.
  - Workers calculate complete weekly displays for the requested season and current-season remaining totals for today and the next Eastern date within that season. Existing off-night classification, team membership, dates and venue rules remain owned by InertiaAppShell.
  - Publish replacements atomically after calculation succeeds. A failed rebuild retains the last published data; concurrent publishers share a database-cache lock. Source imports must not fail because preparation admission is unavailable.
  - Public warm reads query only prepared rows and update inexpensive date/navigation metadata. They must not aggregate nhl_games, fetch remote sources or synchronously build snapshots. Missing known seasons queue preparation; unknown empty seasons must not admit arbitrary historical builds.
  - Prepare the next date in advance for warm midnight rollover. If preparation falls behind, preserve the most recent non-future off-night snapshot while a worker prepares the requested date. Its label remains its actual as-of date, never relabelled as fresh.
  - Admin preparation reuses AdminImports batches, ImportRun progress, super-admin gates and persisted AdminImportSchedules settings. Both automatic refresh jobs and the admin batch run on games-processing. Scheduling is opt-in with a 24-hour default interval for newly created settings; existing saved intervals remain authoritative. The circular recycle control toggles auto refresh immediately and is green when enabled; the adjacent gear configures its interval. At 24 hours an optional daily clock time uses America/Toronto wall time across DST. Without a clock time, or for other intervals, retain elapsed-interval scheduling. Show the configured timing and saved next due time on the card; status polling refreshes timing without overwriting a pending settings save. Automatic refresh targets the current season; manual preparation can build historical seasons.
  - Schedule metadata imports queue affected season refreshes after writes; cross-season weeks include adjacent affected seasons. Changed final live facts and completed season rollups also queue refreshes. Ordinary live clock updates do not.
  - Pending background refreshes deduplicate per season until processing begins, allowing source writes during an active build to queue follow-up preparation.
  - Workers retain pending uniqueness while waiting for the shared overlap middleware; the database publication lock also covers admin command builds. Snapshot game links are relative so worker-host URLs cannot leak into public displays. Do not persist unused off-night date lists or logo metadata in the totals projection.
  - Week visits request only schedule props, retaining the shared shell. A mounted-only bounded browser cache reuses loaded weeks for five minutes through Inertia client-side visits; changed off-night build versions invalidate reuse. It must not mutate global state or bypass server authorization for another page.
  - Cold preparation uses bounded polling of prepared rows only, with cleanup on unmount. Last successful rows stay visible; an initially empty view shows preparation feedback instead of false no-games messages.
public_interface:
  - NhlScheduleSnapshots::read()
  - NhlScheduleSnapshots::build()
  - NhlScheduleSnapshots::changedDate()
  - nhl:prepare-schedule
  - AdminImports source nhl-schedule-snapshots
  - GET /tools/schedule?week=YYYY-MM-DD
example_usage: |
  An admin queues Prepare NHL Schedule from Game Imports and enables its refresh schedule.
  Visitors read published weeks; their requests never perform the build inline.
