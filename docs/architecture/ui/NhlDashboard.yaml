name: NHL Home Dashboard
type: Public Inertia Dashboard
location:
  - app/Http/Controllers/NhlDashboardController.php
  - app/Services/NhlDashboardPayload.php
  - app/Services/NhlDashboardNews.php
  - resources/js/pages/Dashboard/Index.vue
  - resources/js/pages/Dashboard/Section.vue
  - docs/designs/diq-dashboard-desktop-design.png
purpose: Present the same NHL editorial and factual dashboard to guests and members without assembling predictions or lineups.
when_to_use:
  - Rendering the root home page or authenticated dashboard.
  - Selecting completed-game standout performances and current public NHL headlines.
when_not_to_use:
  - Replacing the existing games index or game-detail pathways.
  - Publishing invented editorial, injury information, performance statistics or forecasts.
  - Reading private league data into shared dashboard caches.
rules:
  - The approved image docs/designs/diq-dashboard-desktop-design.png is the visual reference for the dashboard grid, editorial cards, panels and desktop chrome. The complete DynastyIQ logo replaces the reference image's text branding. Mobile adapts the grid and retains the existing bottom navigation.
  - The default desktop overview keeps all dashboard panels above the fold at supported desktop viewport sizes. The performers, signings and injuries row stays compact and aligned. Shorter desktop viewports may scroll lists within their panels; cards and source records must not be removed to make the overview fit. Explicit search and expanded headlines return to normal page flow so requested content remains accessible. Mobile remains a naturally scrolling layout.
  - The root URI is public and renders the same component as the authenticated dashboard URI. Existing route names, authentication and navigation eligibility remain unchanged. The separate /games page retains its game index and operational controls.
  - Stories and videos come from the NHL-owned FORGE editorial API with the NHL context filter. Normalize provider headlines, summaries, publication dates, image templates and official links. Reject malformed slugs, future publication dates and off-provider images. Never render provider text as executable HTML.
  - Editorial feeds are separately cached for five minutes. The last successful feed is retained for one day and displayed with a stale indication after failure. Missing data has an explicit fallback link to NHL.com. Provider failure must not fail the dashboard.
  - Three recent stories occupy the featured cards. Around the NHL contains every remaining returned headline without repeating featured stories; additional headlines remain accessible through disclosure. Article and video navigation uses official NHL destinations.
  - Shared public facts are cached for five minutes by slate date. Search is validated, request-specific and never mixed into the shared cache. Search uses local canonical players and the already-fetched news feed.
  - The slate date follows the scoreboard's 11 a.m. America/Toronto rollover. Top Performers uses the latest fully completed regular-season or playoff game day on or before that date. Postponed and cancelled games do not block a completed day; unknown or unfinished games do.
  - Top Performers has four real performances when at least four are available, without reserved skater or goalie slots. Skaters qualify at three points or two goals; goalies qualify at at least +1.0 GSAx and .920 save percentage. Qualifiers rank by performance relative to the applicable threshold with stable factual tie breaks. Remaining slots use the highest-points skaters, then goals and shots; participating goalies may fill a shortage of skaters. Never manufacture players to fill missing imports.
  - GSAx uses one latest available goal model with scored predictions for the completed games. Every official non-empty-net, non-shootout SOG faced must have a scored expected-goal value and the count must match the official goalie boxscore. GSAx equals expected goals against minus official goals against. Incomplete evidence remains null and cannot qualify a goalie. Unused backups are excluded by positive TOI.
  - Player cards show position-appropriate statistics and factual badges. Player profiles link to NHL.com because no local public player-detail route exists.
  - Team Trends compares each team's latest ten finished games with its preceding ten. Offense uses GF/game, defense uses GA/game and Special Teams uses PP goals/game with boxscore coverage. Missing coverage is null; this panel does not claim to report PP success percentage.
  - Player Heat Check compares points per appearance over the latest five appearances with the preceding five. A zero prior rate uses an absolute delta. Breakout is descriptive, requiring at least three recent points, positive improvement and a recent rate at least twice the prior rate. These observations are not prediction adjustments.
  - Injury Watch uses current stored availability reports and omits recovered players. Signings and moves use public NHL-domain transactions, excluding draft and transfer events and all private fantasy transactions.
  - Dashboard reads must not trigger predictions, imports, migrations, queue workers or lineup assembly.
public_interface:
  - GET / named welcome
  - GET /dashboard named dashboard with existing authentication
  - Optional q query parameter for public dashboard search
  - NhlDashboardPayload::build
  - NhlDashboardNews::feed
  - Dashboard/Index Inertia component
example_usage: |
  return Inertia::render('Dashboard/Index', [
      'dashboard' => app(NhlDashboardPayload::class)->build(),
  ]);
