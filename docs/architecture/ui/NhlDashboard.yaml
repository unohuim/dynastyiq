name: NHL Home Dashboard
type: Public Inertia Dashboard
location:
  - app/Http/Controllers/NhlDashboardController.php
  - app/Services/NhlDashboardPayload.php
  - app/Services/NhlDashboardNews.php
  - resources/js/pages/Dashboard/Index.vue
  - resources/js/pages/Dashboard/Section.vue
  - docs/designs/diq-dashboard-desktop-design.png
purpose: Present the same NHL editorial and factual dashboard to guests and members without assembling predictions or lineups.
when_to_use:
  - Rendering the root home page or authenticated dashboard.
  - Selecting completed-game standout performances and current public NHL headlines.
when_not_to_use:
  - Replacing the existing games index or game-detail pathways.
  - Publishing invented editorial, injury information, performance statistics or forecasts.
  - Reading private league data into shared dashboard caches.
rules:
  - The approved image docs/designs/diq-dashboard-desktop-design.png is the visual reference for the dashboard grid, editorial cards, panels and desktop chrome. The complete DynastyIQ logo replaces the reference image's text branding. Mobile adapts the grid and retains the existing bottom navigation.
  - The default desktop overview keeps all dashboard panels above the fold at supported desktop viewport sizes. The performers, signings and injuries row stays compact and aligned. Shorter desktop viewports may scroll lists within their panels; cards and source records must not be removed to make the overview fit. Explicit search and expanded headlines return to normal page flow so requested content remains accessible. Mobile remains a naturally scrolling layout.
  - The root URI is public and renders the same component as the authenticated dashboard URI. Existing route names, authentication and navigation eligibility remain unchanged. The separate /games page retains its game index and operational controls.
  - Stories come from the NHL-owned FORGE editorial API with the NHL context filter. Normalize provider headlines, summaries, publication dates, image templates and official links. Reject malformed slugs, future publication dates and off-provider images. Never render provider text as executable HTML.
  - Display the NHL.com story attribution and feed update date directly above the top story area. Editorial feeds are cached for five minutes. The last successful feed is retained for one day and displayed with a stale indication after failure. Missing data has an explicit fallback link to NHL.com. Provider failure must not fail the dashboard.
  - Three recent stories occupy the featured cards. Below the desktop/tablet breakpoint, show one 160-pixel-high story card at a time in a native horizontal swipe carousel containing every fetched story, featured first then remaining headlines, deduplicated by story identity. Retain source order and full images without stretching or cropping. A subtle proportional scrollbar appears below when stories overflow, tracks scrolling and supports pointer dragging, track clicks and keyboard navigation. Tablet and desktop retain the three-card grid. Around the NHL contains every remaining returned headline without repeating featured stories; additional headlines remain accessible through disclosure. Article navigation uses official NHL destinations. The dashboard does not request or render a video feed.
  - Shared public facts are cached for five minutes by slate date. Search is validated, request-specific and never mixed into the shared cache. Search uses local canonical players and the already-fetched news feed.
  - The slate date follows the scoreboard's 11 a.m. America/Toronto rollover. Last Night's Top Performers and Last Night’s Top Lines use the latest fully completed regular-season or playoff game day on or before that date. Postponed and cancelled games do not block a completed day; unknown or unfinished games do.
  - Top Performers retains every qualifying performance, without reserved skater or goalie slots. When fewer than four qualify, fill to four real performances if available. Skaters qualify at three points or two goals; goalies qualify at at least +1.0 GSAx and .920 save percentage. Qualifiers rank by performance relative to the applicable threshold with stable factual tie breaks. Fallback slots use the highest-points skaters, then goals and shots; participating goalies may fill a shortage of skaters. Never manufacture players to fill missing imports.
  - Last Night's Top Performers uses one horizontally scrollable card row with a thin draggable scrollbar beneath the cards only when additional cards overflow the visible area. The scrollbar thumb reflects visible versus total content and follows scrolling; previous/next controls, touch and keyboard scrolling remain available. The scrollbar supports track clicks, pointer dragging and arrow/Home/End/Page keys, with accessible range values; its SVG geometry avoids inline CSS or global pointer listeners. Keep the compact panel height and large portraits. The panel displays its completed-night date as abbreviated weekday, month and day, without the Completed games prefix.
  - Last Night’s Top Lines replaces the video panel. Offer G, Corsi, CF%, Shifts and TOI tabs matching Team Trends. Rank all available canonical forward trios from that completed night by the selected metric and show the leading five, using goal differential, CF%, TOI and stable unit/game identity to break ties. G is goals for; Corsi is attempts for minus against; CF% is attempts for divided by total attempts. CF% ranking requires at least 300 seconds of total shared five-on-five game time and non-null CF%; the other tabs retain their candidates. Shared shifts count each stored forward-unit shift with positive five-on-five exposure once, regardless of other units splitting its timeline. Derive exact five-on-five TOI from simultaneous stored F/D/G unit shifts with five skaters and one goalie on each team; use distinct linked shot attempts with situation code 1551 and the canonical event normalizer for GF/GA and CF/CA. EV summaries alone are insufficient because they include other equal-strength and empty-net situations. Order trio names as LW, C, RW, placing the trio member with the most faceoffs taken across that game at C. Count both winning and losing participants from stored play-by-play using NHL player IDs. Break tied draw counts, including no draw evidence, by maximizing listed L/LW, C and R/RW position matches across the six permutations, then preserve player-ID order; this is inferred display ordering, not verified shift roles. Show rank, team logo, trio names, the selected value alone in a badge (with an accessible metric label) and the other four metrics inline, with negative secondary Corsi values in red; unavailable imports have an honest empty state. Links retain the existing local unit-stat route and authorization. No imports or new tables are introduced.
  - GSAx uses one latest available goal model with scored predictions for the completed games. Every official non-empty-net, non-shootout SOG faced must have a scored expected-goal value and the count must match the official goalie boxscore. GSAx equals expected goals against minus official goals against. Incomplete evidence remains null and cannot qualify a goalie. Unused backups are excluded by positive TOI.
  - Player cards show position-appropriate statistics and factual badges. Player profiles link to NHL.com because no local public player-detail route exists. External dashboard destinations open in a new tab with noopener noreferrer; local links retain same-tab navigation. Performer portraits occupy approximately 76 pixels of card height, following the reference.
  - Team Trends compares each team's latest ten finished games with its preceding ten when at least twenty finished current-season games are available. With fewer than twenty, it compares the latest five with the preceding five. Each row displays the actual available counts; absent previous games produce a null delta, never a fabricated comparison. Offense uses GF/game, defense uses GA/game and Special Teams uses PP goals/game with boxscore coverage. Missing coverage is null; this panel does not claim to report PP success percentage. Show all available teams, placing missing selected metrics last. Team Trends and Player Trends retain bounded panel heights with independent, keyboard-accessible vertical scrolling.
  - Player Trends compares points per appearance over the latest five appearances with the preceding five. A zero prior rate uses an absolute delta. Breakout is descriptive, requiring at least three recent points, positive improvement and a recent rate at least twice the prior rate. The payload retains all qualifying player comparisons so each selected tab can rank and show its leading 25 independently. These observations are not prediction adjustments.
  - Injury Watch uses current stored availability reports and omits recovered players. Show the four oldest-created qualifying records first, with stable ID ties, and display each anticipated return date or Return unknown when absent. Signings and moves use public NHL-domain transactions, excluding draft and transfer events and all private fantasy transactions.
  - Dashboard reads must not trigger predictions, imports, migrations, queue workers or lineup assembly.
public_interface:
  - GET / named welcome
  - GET /dashboard named dashboard with existing authentication
  - Optional q query parameter for public dashboard search
  - NhlDashboardPayload::build
  - NhlDashboardNews::feed
  - Dashboard/Index Inertia component
example_usage: |
  return Inertia::render('Dashboard/Index', [
      'dashboard' => app(NhlDashboardPayload::class)->build(),
  ]);
