name: Admin Engine Game Predictions
type: Private Diagnostic Snapshot Store
location:
  - app/Models/AdminEngineGamePrediction.php
  - app/Http/Controllers/Admin/AdminEngineGamePredictionController.php
  - resources/js/pages/Admin/SatEngines/Stack.vue
purpose: Retain bounded private copies of an admin's current prediction workspace without recalculating or affecting live forecasts.
when_to_use:
  - Autosaving partial or completed Predict today results.
  - Naming and restoring diagnostic comparisons across sessions.
when_not_to_use:
  - Partner predictions or canonical simulation evidence.
  - Shared admin or tenant storage.
rules:
  - Access inherits SAT admin page authorization. Every read and mutation is additionally scoped to the authenticated user, including super admins. These are global application user-owned records, not tenant-owned data.
  - Each owner has at most four rotating autosaves and fifty named saves. User-row locking serializes reservation, creation and deletion. Names are unique per owner; named copies cannot be updated through the autosave interface.
  - Autosaves retain the latest partial workspace per run. Starting another run reserves an unused slot or replaces the least recently updated slot. A session token prevents a displaced tab from writing into its replacement. Named saves are never automatically overwritten or evicted.
  - Workspace snapshots retain all engine accordions, each with captured settings, date, rows, sorting, expanded state and progress. New saves use version 2; version 1 single-engine saves restore as one accordion. Limits are 128 sections, 128 rows per section and 256 KiB per snapshot. Browser snapshots are diagnostic copies, not trusted prediction inputs.
  - Restoring never triggers model evaluation, provider requests, queues, or live definition changes. Deleted engines or stacks do not remove saved copies. Account deletion removes its private saves.
  - Predict today displays captured Engine confidence bounds and spread thresholds with saved units and comparison direction. Production qualifies and predicts; only Production rows are displayed. Stored results retain their original qualification decisions and presentation confidence after later policy changes and are labelled historical, not recalculated.
  - Per-engine actions replace only that engine's independent diagnostic accordion. Stack-level Predict today creates or replaces its member accordions and calls ordinary stack delegation once per game, sequentially without queue dispatch. Each game appears under its first qualifying engine only; all-declined games appear under the normal fallback engine with an explicit no-pick explanation. Pending and failed game requests remain visible in the first accordion. A stack run occupies one autosave slot and checkpoints the whole workspace. Stopping finishes the in-flight request before another batch may start. The selected stack model takes precedence for either button; absent that override, each engine uses its own model. Existing snapshots are not rewritten.
public_interface:
  - GET /admin/admin-engine-game-predictions
  - POST /admin/admin-engine-game-predictions
  - POST /admin/admin-engine-game-predictions/autosave
  - GET /admin/admin-engine-game-predictions/{save}
  - DELETE /admin/admin-engine-game-predictions/{save}
example_usage: |
  Predict today checkpoints autosave-1; Save named copy preserves a private comparison
  that can later be restored without recomputing the games.
