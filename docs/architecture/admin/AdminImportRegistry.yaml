name: Admin Import Registry
type: Admin Service Pattern
location:
  - app/Services/AdminImports.php
  - app/Http/Controllers/Admin/ImportsController.php
  - app/Jobs/RunImportCommandJob.php
  - app/Console/Commands/RefreshNhlPlayerMetadataCommand.php
  - app/Jobs/RefreshNhlPlayerMetadataChunkJob.php
  - bootstrap/app.php
  - resources/views/admin/imports.blade.php
  - resources/js/admin/admin-hub.js
purpose: Define manually runnable import sources and dispatch them as queue batches from the admin UI.
when_to_use:
  - Adding an admin-triggered import command.
  - Running a manual admin import.
  - Listing supported manual import sources.
when_not_to_use:
  - NHL stage orchestration.
  - Non-admin user imports.
rules:
  - Manual import sources must be registered in AdminImports.
  - Admin import dispatch must use queued batch execution.
  - OAuth-backed proof imports may use a direct bounded admin JSON endpoint only after an approved token storage model exists.
  - Admin import run progress should be read from import_runs progress fields rather than parsing command output.
  - NHL, Fantrax, and CapWages admin imports should update import_runs progress totals and processed counts when run from the admin panel.
  - Admin import sources may expose named actions when one visible workflow needs multiple command-backed modes; named actions must still dispatch through the same queued admin import path and keep progress under the visible import source key.
  - The NHL Players Update DB action must refresh existing canonical players from players.nhl_id through NHL player landing payloads and must not depend on roster or prospect discovery coverage.
  - The NHL Players Update DB action must dispatch bounded chunk jobs under one visible import run so multiple queue workers can process metadata refreshes concurrently while the UI reports aggregate progress.
  - NHL resolution imports may queue reconciliation work for existing canonical players with null NHL ids and should report the command dispatch sweep through import_runs.
  - Fantrax admin imports should process player records in bounded sequential chunk jobs so resolver work does not exceed queue worker timeouts.
  - Fantrax-backed admin import batches must use the fantrax queue, anticipated-lineup admin import batches must use the lineups queue, and other admin import batches must use the default queue.
  - Anticipated-lineup progress must include run-scoped X posts viewed and estimated spend directly in its records progress text; actual X billing remains provider authoritative.
  - Import-run estimated provider spend must persist in import_runs.estimated_cost_usd through terminal completion or failure; provider resource counts and applied rates remain supporting metadata.
  - Empty commands for provider-owned imports must delete only provider-owned imported records and must preserve canonical players.
  - Imports with dynamic discovery may increase total_records during the run as records become known.
  - Import keys must remain aligned with docs/ENUMS.md when enum-like.
  - Scheduled admin imports must use AdminImportSchedule and dispatch through the same queued AdminImports path as manual runs.
  - The nhl-game-boxscores source checks per-game eligibility every second; only non-final UTC-today games inside the configured start-before-puck-drop window may sync. Defaults are a 30-minute start window, a 900-second pregame interval, and a 300-second live interval. There is no separate general or one-hour cadence. Each game's boxscore_synced_at controls its cadence.
public_interface:
  - AdminImports::sources()
  - AdminImports::dispatch()
  - SyncTodayNhlBoxscoresCommand
  - nhl:refresh-player-metadata
  - admin.imports
  - admin.imports.run
  - admin.imports.status
  - admin.imports.retry
example_usage: |
  $batch = app(AdminImports::class)->dispatch('fantrax');
