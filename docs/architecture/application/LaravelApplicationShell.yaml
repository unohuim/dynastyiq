name: Laravel Application Shell
type: Framework Pattern
location:
  - routes/web.php
  - routes/api.php
  - app/Http/Controllers/
  - resources/views/
  - resources/js/app.js
  - app/Http/Middleware/HandleInertiaRequests.php
  - app/Providers/HorizonServiceProvider.php
purpose: Provide the primary authenticated and public web application using Laravel, Jetstream/Fortify, Blade, Alpine, staged Inertia/Vue pages, Tailwind, Livewire, queues, and Vite.
when_to_use:
  - Adding first-party HTTP routes.
  - Adding controllers, request validation, policies, jobs, Blade views, approved Inertia pages, or Vite-managed application JavaScript.
when_not_to_use:
  - Discord bot runtime code, which belongs under diq-bot/.
  - External scripts that should remain outside Laravel.
rules:
  - Laravel routes own browser and API entrypoints.
  - Blade views own server-rendered page shells.
  - Inertia pages may own approved migrated browser page shells while controllers continue to own backend props.
  - The public /games and /games/{nhlGameId} pages are Inertia/Vue-owned and must not reintroduce page Blade templates, Alpine state, or Livewire behavior.
  - Vite-managed JavaScript owns browser-side behavior.
  - Domain persistence and authorization stay in Laravel, not in the Discord bot runtime.
  - Horizon dashboard and internal API access is permitted only in production on the exact horizon-diq.on-forge.com request host; other hosts and environments are denied, including local and authenticated users.
  - Horizon permits Laravel guests through viewHorizon because Nginx Basic Authentication must protect the entire dedicated site. Laravel cannot verify that protection; the host restriction is not authentication and must not be deployed on an unprotected origin.
  - Horizon authorization is separate from Discord OAuth and must not alter main-application authentication, queue processing, or worker configuration.
  - Horizon must isolate model builds, profiles, projections, comparisons, SAT Engine discovery/ranking, next-game evaluations, and historical pregame-context builds on the projections queue. Coordinators, loaders, continuations, and child batches must retain that queue; NHL schedule discovery and ordinary import/fact-building pipelines remain on default.
  - Time-sensitive anticipated-lineup work and live prediction cache refreshes remain on lineups; Fantrax provider work remains on fantrax; unrelated work remains on default.
  - Horizon worker allocation is twelve fixed projections workers, five fixed default workers, two fixed Fantrax workers, and one fixed lineup worker in every environment, totaling twenty per Horizon instance rather than a cross-server limit.
  - Queue routing changes do not relocate previously serialized jobs or existing batches. Default workers must remain available to drain them; existing batch options remain authoritative for their child additions.
public_interface:
  - Laravel route definitions
  - Blade views and components
  - Inertia page components
  - Vite-managed JavaScript entrypoints
  - Laravel queues and jobs
example_usage: |
  Route::get('/stats', [StatsController::class, 'index'])->name('stats.index');
