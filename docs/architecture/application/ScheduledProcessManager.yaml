name: Scheduled Process Manager
type: Persistent Scheduling Abstraction
location:
  - app/Events/NhlPregameContextDayCompleted.php
  - app/Listeners/QueueNhlGamePredictions.php
  - app/Services/NhlGamePredictionHistory.php
  - resources/js/pages/Admin/GamePredictions.vue
  - app/Models/ScheduledProcess.php
  - app/Services/ScheduledProcessManager.php
  - app/Services/NhlPregameContextOrchestrator.php
  - app/Http/Controllers/Admin/NhlPregameContextController.php
  - app/Http/Controllers/Admin/NhlModelRunController.php
  - resources/views/admin/nhl-sat-models/_model-row.blade.php
  - resources/js/pages/Admin/SatModels/Index.vue
  - resources/js/admin/nhl-sat-models.js
  - app/Console/Commands/DispatchScheduledProcessesCommand.php
  - app/Http/Controllers/Admin/ScheduledProcessController.php
  - routes/console.php
  - resources/js/pages/Admin/Dashboard.vue
  - resources/js/admin/admin-hub.js
purpose: Centralize due-process decisions in persisted settings while migrating existing scheduler entries incrementally.
when_to_use:
  - Managing automatic NHL game discovery timing and scope.
  - Managing model-specific automatic pregame-context updates.
  - Managing the approved automatic current-day prediction trigger.
  - Migrating another scheduled process after explicit approval.
when_not_to_use:
  - Replacing all existing provider-import schedules at once.
  - Performing heavy work inside the scheduler tick.
  - Accepting arbitrary command names or executable settings from HTTP.
rules:
  - scheduled_processes is global super-admin-managed operational data, not tenant data. Allowlisted processes include NHL game discovery, model-keyed pregame-context updates and current-day game predictions; provider schedules remain in admin_import_schedules.
  - Laravel calls the manager every minute; enabled state and due times are authoritative in the database. A dispatch lock and locked schedule row suppress overlapping ticks. Dispatch at most one occurrence per process per tick; missed intervals must not create catch-up bursts.
  - Discovery starts at the persisted America/Toronto wall-clock time with a default 24-hour frequency. Daily schedules preserve local time across DST; other frequencies advance from actual dispatch time. Initial schedules wait for today's start time; an already overdue next_due_at remains due.
  - Discovery defaults to the previous three calendar dates, excluding today. Start time, integer frequency hours, and integer days back are validated server-side; the enable toggle saves independently and immediately.
  - Scheduler-created discovery runs explicitly enable payload.auto_process so completed discovery can advance into Full. Manual discovery paths disable it and wait for the operator's selected scope; the discovery pipeline owns enforcement.
  - A model-keyed pregame schedule uses `nhl-pregame-context-model-{model_run_id}` and may queue only that SAT model's own Train and Test seasons. `include_update_pregame` qualifies the task separately from the master enabled switch.
  - Pregame schedules create ordinary durable context runs through the existing bounded orchestrator. Active overlapping season work delays dispatch without advancing the due time; each admitted run records its model and auto-sync trigger.
  - Scheduled pregame refreshes queue only completed games missing team or participant snapshots for the selected context version. The builder upserts each selected snapshot key, filling missing or partial work without duplicating rows; manual Build Pregame remains the full rebuild path.
  - Day-based frequencies preserve the configured local time across DST; sub-day intervals advance from actual dispatch time. Settings changes never dispatch work directly.
  - Active automatic discovery or processing for the same process suppresses a new automatic run. Dispatch failures retain bounded error evidence; no scheduler entry performs game imports synchronously.
  - Settings reads and writes reuse authenticated super-admin and lifecycle middleware. Saving settings must not dispatch work. The Games Import Pipeline header exposes the existing recycle icon toggle and a settings slide-over.
  - NHL game processing is event-driven through GamesDiscovered after all discovery dates commit. It is not a separately timed scheduled process. Existing slot, claim, stage and per-game locking safeguards remain owned by the NHL import orchestrator.
  - The former direct nhl:discover and nhl:process schedules are removed only when this manager is deployed; all other scheduler entries remain unchanged. Manual commands remain available.
  - Prediction automation persists one settings row, is disabled until saved and enabled, and selects exactly one trigger mode. Defaults are a 24-hour interval starting at 06:00 America/Toronto. Existing timing rules govern daily DST and sub-day dispatches. Settings reads do not create rows; settings writes never dispatch. Mode/timing/enable changes reset the next due decision without deleting prior event evidence.
  - Time mode admits today's stored upcoming games through the shared prediction-run pathway on projections. Event mode ignores scheduler due times and consumes NhlPregameContextDayCompleted through a queued projections listener after commit. No automation recalculates started, final, past or future games. Manual date/range behavior remains unchanged.
  - The context loader emits at-least-once current-day readiness notifications after its transaction and loader lock. A date is ready only after its selected games are complete without exclusions, its context and league stages are complete, and any separately required comparison stage is complete. Historical dates and unrelated models cannot trigger today's forecasts. The listener rechecks the default model, source-run readiness, both teams' current-version snapshots and player coverage for every upcoming game before admission.
  - Serialize automation settings and dispatch evidence with a row lock. Shared admission locks games in stable order and delays automatic work when manual items or API preparation leases are active. Busy timer occurrences retain their due time; busy event deliveries release for retry until day end. Duplicate or older context notifications for an already admitted date/run are ignored, including after settings edits. A later context build may produce a new revision once prior work finishes.
  - Both triggers create normal durable run/game items through NhlGamePredictionHistory, retain latest successful predictions and immutable revisions, freeze trigger evidence beside the algorithm/model definition, and publish batches only after the admission transaction commits. Publication failures mark admitted items failed rather than leaving them queued. No prediction formula, confidence calculation or partner payload contract changes.
public_interface:
  - ScheduledProcessManager::tick()
  - GET /admin/game-predictions/automation
  - PUT /admin/game-predictions/automation
  - NhlPregameContextDayCompleted
  - processes:dispatch-due
  - GET /admin/scheduled-processes/nhl-game-discovery
  - PUT /admin/scheduled-processes/nhl-game-discovery
  - GET /admin/nhl-sat-models/{run}/context/auto-sync
  - PUT /admin/nhl-sat-models/{run}/context/auto-sync
  - PATCH /admin/nhl-sat-models/{run}/context/auto-sync
example_usage: |
  Laravel's minute tick invokes processes:dispatch-due.
  An enabled due discovery queues yesterday through three days ago.
  GamesDiscovered starts bounded processing after the discovery commits.
